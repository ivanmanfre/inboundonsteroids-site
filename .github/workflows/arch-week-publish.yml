# Publishes monthly client reports after the renewal/month-end build.
# Existing workflow identifier and historical report files remain compatible.
name: arch-week-publish
on:
  schedule:
    - cron: '15 18 28-31 * *'
    - cron: '15 19 28-31 * *'
    - cron: '15 20 28-31 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: arch-week-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull report and publish if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Identity must be set for the REPO, not just the commit command:
          # the retry path runs `git pull --rebase`, which needs a committer
          # and dies with "empty ident name" when two publishes race.
          git config user.name 'arch-week-bot'
          git config user.email 'noreply@ivanmanfredi.com'
          # Select the latest due report END date in Warsaw. Scheduled runs on
          # non-month-end candidate days exit without fetching or publishing.
          REPORT_END=$(python3 - <<'PYDATE'
          import calendar, datetime, os
          from zoneinfo import ZoneInfo
          today = datetime.datetime.now(ZoneInfo('Europe/Warsaw')).date()
          year, month = today.year, today.month
          scheduled = os.environ.get('GITHUB_EVENT_NAME') == 'schedule'
          due = datetime.date(year, month, calendar.monthrange(year, month)[1])
          if scheduled and today != due:
              raise SystemExit(0)
          if today < due:
              due = datetime.date(year, month, 1) - datetime.timedelta(days=1)
          print(due.isoformat())
          PYDATE
          )
          [ -n "$REPORT_END" ] || { echo 'not a monthly report date'; exit 0; }
          SRC="https://bjbvqvzbzczjbatgmccb.supabase.co/storage/v1/object/public/client-week-public/arch/${REPORT_END}.html"
          DST="shared/arch-month-${REPORT_END}.html"
          echo "report-end=${REPORT_END} -> ${DST}"
          CODE=$(curl -s -o /tmp/arch-report.html -w '%{http_code}' "$SRC")
          if [ "$CODE" != "200" ]; then
            echo "render not in bucket yet (HTTP $CODE), nothing to publish"; exit 0
          fi
          # refuse to publish something that is not a full document
          grep -qi '</html>' /tmp/arch-report.html || { echo 'truncated render, refusing'; exit 1; }
          if [ -f "$DST" ] && cmp -s /tmp/arch-report.html "$DST" \
             && [ -f shared/arch-week.html ] && cmp -s /tmp/arch-report.html shared/arch-week.html; then
            echo 'unchanged'; exit 0
          fi
          cp /tmp/arch-report.html "$DST"
          # A STABLE URL that always serves the newest report. The dated files
          # stay as the per-period archive, but the dated name moves each month,
          # so a bookmarked one silently goes stale. Ivan's link is this one.
          cp /tmp/arch-report.html shared/arch-week.html
          git add "$DST" shared/arch-week.html
          git commit -m "arch monthly report: period ending ${REPORT_END}"
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
          done
          # a push made with GITHUB_TOKEN does not trigger the Pages deploy
          # workflow (GitHub suppresses workflow-triggered-workflow cascades),
          # so the commit can land while the site keeps serving the old build.
          # Dispatch the Pages deploy explicitly.
          echo "dispatching Pages deploy (a GITHUB_TOKEN push does not trigger it)"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          # verify the live bundle, fail loudly if the page never appears
          LIVE="https://inboundonsteroids.com/shared/arch-month-${REPORT_END}.html"
          for i in $(seq 1 20); do
            sleep 20
            L=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE")
            echo "poll $i: $L"
            [ "$L" = "200" ] && exit 0
          done
          echo "published but ${LIVE} never returned 200"; exit 1
