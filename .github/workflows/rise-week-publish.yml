# Publishes the RISE weekly client report from the public render bucket to /shared/.
# No secrets: the bucket allows unauthenticated object GET; this repo is the publish target.
# Written by the rise-report-repair goal run 2026-08-25. Fires after the n8n build:
#   Mon 19:00 Europe/Warsaw  -> 17:15 / 18:15 / 19:15 UTC (covers CET and CEST)
# The Friday early-cut crons were removed 2026-08-25 with the Friday trigger in
# IHOpAedk4gJFNQo4: the report is a Sunday or Monday artifact, and a Friday poll
# could only ever publish last week's file again.
# Unchanged content is a no-op; a publish that never reaches HTTP 200 fails the job loudly.
name: rise-week-publish
on:
  schedule:
    - cron: '15 17 * * 1'
    - cron: '15 18 * * 1'
    - cron: '15 19 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rise-week-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull report and publish if changed
        run: |
          set -euo pipefail
          # Identity must be set for the REPO, not just the commit command:
          # the retry path runs `git pull --rebase`, which needs a committer
          # and dies with "empty ident name" when two publishes race.
          git config user.name 'rise-week-bot'
          git config user.email 'noreply@ivanmanfredi.com'
          # File Monday = most recent Monday on-or-before today. The build runs
          # ON the file Monday, so a Monday cron resolves today and a manual
          # workflow_dispatch later in the week still resolves the file that
          # exists. (The previous next-Monday formula was only correct on
          # Mondays; a Tuesday dispatch reached for a file not yet rendered.)
          DOW=$(date -u +%u)                       # 1=Mon..7=Sun
          SUB=$(( (DOW - 1) % 7 ))
          FILE_MON=$(date -u -d "-${SUB} days" +%F)
          WSTART=$(date -u -d "${FILE_MON} -7 days" +%F)
          MMDD=$(date -u -d "${WSTART}" +%m%d)
          SRC="https://bjbvqvzbzczjbatgmccb.supabase.co/storage/v1/object/public/client-week-public/risedtc/${FILE_MON}.html"
          DST="shared/rise-week-${MMDD}.html"
          echo "file=${FILE_MON} window-start=${WSTART} -> ${DST}"
          CODE=$(curl -s -o /tmp/report.html -w '%{http_code}' "$SRC")
          if [ "$CODE" != "200" ]; then
            echo "render not in bucket yet (HTTP $CODE), nothing to publish"; exit 0
          fi
          # refuse to publish something that is not a full document
          grep -qi '</html>' /tmp/report.html || { echo 'truncated render, refusing'; exit 1; }
          if [ -f "$DST" ] && cmp -s /tmp/report.html "$DST"; then
            echo 'unchanged'; exit 0
          fi
          cp /tmp/report.html "$DST"
          git add "$DST"
          git commit -m "rise weekly report: window starting ${WSTART}"
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
          done
          # verify the live bundle, fail loudly if the page never appears
          LIVE="https://inboundonsteroids.com/shared/rise-week-${MMDD}.html"
          for i in $(seq 1 20); do
            sleep 20
            L=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE")
            echo "poll $i: $L"
            [ "$L" = "200" ] && exit 0
          done
          echo "published but ${LIVE} never returned 200"; exit 1
