ford_konstant-kreative-activity-7493343572197531648-HMFi", "post_text": "$200M+ in Meta spend across the portfolio yet I've also built creative teams the hard way with recruiting, test projects, onboarding docs, all of it.\n \nYou wanted more ads but all you got stuck with was the HR function.\n \nThat's the managed editing model at Konstant Kreative:\n \n> We handle recruiting and training the editors\n> Every piece gets quality checked before it reaches you\n> AI tools (Veo 3, NanoBanana Pro) are already built into the workflow\n \nBroke it down in the carousel:\n\n25% off the first 2 months with code NICK25: konstantkreative.com/nick"}, {"n": 100, "client_id": "arch", "post_ref": "7505185828395188224", "author_name": "Marion Balinoff", "published": "2026-09-14", "post_type": "carousel", "image_count": 2, "source_url": "https://www.linkedin.com/posts/marion-balinoff_i-keep-coming-back-to-surfshark-as-the-activity-7505185828395188224-SWeT", "post_text": "🔍 I keep coming back to Surfshark as the case study I point to when studios ask what a mature influencer program actually looks like.\n \nOver 12,000 content units published in a single year. More than 4,000 YouTube integrations through one agency partnership. Campaigns running across 101 countries. Most teams are still debating whether influencer marketing \"works.\" Surfshark treats it as core infrastructure.\n \nHere's what I think actually explains the results, not just the volume.\n \n1. They build a landing page per creator, not one page for everyone. Every integration gets its own URL, tailored to that creator's audience and framing. That alone lifted conversion by up to 2 percentage points across their campaigns. Most brands send every creator to the same generic page and wonder why performance varies so wildly between partnerships that looked identical on paper.\n\n2. They pick creators for audience, not content category. A woodworking channel, a cooking channel, a gaming channel, none of them obviously \"about\" a VPN, and all of them converting because the audience trusts the person talking, not because the content matched a keyword.\n\n3. They treat creators as a relationship, not a transaction. Repeat partnerships, long-term terms, creators who've worked with the brand for years and talk about it like they mean it. That's not something you get from one-off deal chasing.\n \nNone of this is complicated. It's 3 decisions made consistently, thousands of times, instead of once and forgotten."}, {"n": 101, "client_id": "risedtc", "post_ref": "7416747778900402176", "author_name": "Aggiemeroni", "published": "2026-01-13", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/aggiemeroni_yesterday-i-held-my-first-solo-workshop-at-activity-7416747778900402176-Nglk", "post_text": "Yesterday I held my first solo workshop at Top Drawer London on the Retail Revealed stage.\n\nSo much changed in Meta ads last year, my workshop explained to retailers why the changes are a HUGE opportunity and gave practical actions to overcome creative overwhelm that’s holding most advertisers back now.\n\nIf your ad performance has plateau’d or stuttered to a meagre return, it’s probably a creative production bottleneck 👀 (and you won’t be alone in that)\n\nThank you Simone Ward for the opportunity to speak again and for running such a well organised stage.\n\nWas lovely to see Sarah Johnson (who also took some footage of me in action thank you! 🫶) and finally meeting Kylie Dunn IRL after working together for a year in 2024 🥰"}, {"n": 102, "client_id": "risedtc", "post_ref": "7414361760247267328", "author_name": "Ben Sharf", "published": "2026-01-06", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/ben-sharf_platter-is-officially-a-shopify-platinum-activity-7414361760247267328-O7M2", "post_text": "Platter is officially a Shopify Platinum Partner!!!\n\nLess than 100 agencies globally have reached this level.\n\nMany of them are legacy firms that have been doing this for decades.\n\nWe did it in 4 years...\n\nThat still doesn’t fully register for me.\n\nThis milestone is a reflection of the team we've assembled and the product offering we created.\n\nOver the past few years, we’ve had the privilege of building 200+ Shopify storefronts for brands like Every Man Jack, Neuro, Gainful and many more.\n\nWhat’s been most validating is that our approach continues to resonate and perform.\n\nHuge thank you to everyone who’s backed Platter since day one.\n\nAnd special shoutout to Nassim Najm, Hayward Peirce, and the entire Shopify partnerships team for believing in us and helping make this possible.\n\nWe're just getting started.\n\nIf you’re building a brand on Shopify and care deeply about conversion, performance, and scalability - my DMs are open :)"}, {"n": 103, "client_id": "ivan", "post_ref": "7484873631555194882", "author_name": "Ben Hemingway", "published": "2026-07-20", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/benhemingwaya_2-years-ago-i-stopped-drinking-alcohol-activity-7484873631555194882-CcVS", "post_text": "2 years ago, I stopped drinking alcohol. \n\nSince then:\n\n- Started a business and travelled the world\n- Overcame chronic burnout\n- Built a mental health community to 80+ members\n- Graduated university\n- Multiple public speaking gigs\n- Completed 10 days in meditation/silence\n- Best physical shape of my life\n\nI’ve also hit some of my lowest points these last couple of years.\n\nBut after a (heavy) night being sat at Boomtown Festival, with my head in my hands, I knew then it was time to park it…\n\nWill I ever drink again? Who knows\n\nYou can still enjoy nights out, travel, and see friends without it.\nThe lonely and awkward times became few and far between.\n\nRight now, the focus is on becoming. Spending lost time on me. And learning more and more about what I’m capable of\n\nPS. Anyone else had a similar journey?"}, {"n": 104, "client_id": "arch", "post_ref": "7503778688052731904", "author_name": "Mark Austin", "published": "2026-09-10", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/mark-austin-4726b865_toys-toynews-smyths-activity-7503778688052731904-k4-W", "post_text": "Breaking News: Smyths Toys Superstores reveals its Top Toys for Christmas 2026\n\nMovie icons, interactive animals and great value toys headline Smyths Toys Superstores’ Christmas line-up for 2026.\n\nSmyths Toys Superstores has unveiled its eagerly awaited list of Top Toys for Christmas 2026. These toys are set to top children’s wish lists across the UK and Ireland this year and are available exclusively in-store and online.\n\nWith UK toy industry sales up 12% YTD, this year’s expansive line-up features more than 70 toys available exclusively at Smyths Toys, celebrating the very best in play with exciting new releases from much-loved brands including Pokémon, Toy Story, Paw Patrol, Uno and more. From interactive animals and movie icons to creative gifts, great-value finds and fun family games, there’s something to inspire every age and suit every stocking size.\n\nSinead Byrne, European Marketing Director at Smyths Toys Superstores, said: “This year’s Top Toys list has been curated to showcase the very best of play, with a big focus on imagination, creativity and, above all, fun. From much-loved on-screen icons like Woody, Buzz, Paw Patrol and Derpy from KPop Demon Hunters, to adorable animal friends including Mommy Elephant and her babies and Kiki the Koala, there are plenty of characters for children to discover and add to their Christmas wish lists.\n\n“These toys capture the magic of role play and fantasy, while giving children the chance to bring their favourite characters and stories to life through play. Pokémon is also celebrating its 30th anniversary this year, and with the franchise continuing to reach new heights of popularity, we’re excited to mark the occasion with the incredible Real FX Pikachu Puppetronic. With such a varied line-up, we’re sure there will be something to make every little one’s Christmas wish list this year.”\n\nCheck out the full list on the Toy World website. Link in the comments. \n\n#toys #toynews #smyths #toyindustry #toptoysforchristmas #retail"}, {"n": 105, "client_id": "arch", "post_ref": "7477390518419677184", "author_name": "Adam Lieb", "published": "2026-06-29", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/adamslieb_emilee-helm-just-hit-her-7-year-gamesight-activity-7477390518419677184-iwbC", "post_text": "Emilee Helm just hit her 7-year Gamesight anniversary. Her gift is a ticket called \"The 7 Year Itch.\" Seven days to travel somewhere new, start a hobby, or just go have an experience for $777. (Terms and conditions apply)\n\nWhere will she go? What will she do? Excited to find out. Happy anniversary, Emilee! Gamesight wouldn't be Gamesight without you!"}, {"n": 106, "client_id": "ivan", "post_ref": "7403707687701516288", "author_name": "Pascal Bornet", "published": "2025-12-08", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_ai-deeplearning-machinelearning-activity-7403707687701516288-Wak7", "post_text": "This was AI in 1989.\nA tiny neural network… reading handwritten digits like it was performing a magic trick.\n\nLeNet did not paint portraits.\nIt did not write poetry.\nIt just recognized numbers.\nBut that simple trick quietly rewired the future.\n\nInside Bell Labs, Yann LeCun and a handful of researchers built a model so small it could barely flex. Yet it ended up running inside ATMs, scanning millions of checks, powering banking systems before most people had even heard the term neural network.\n\nHere is the plot twist.\nAI feels new only because we arrived at the loud part.\nThe real work started decades ago in quiet labs with slow progress and wild dreams.\n\nFrom recognizing digits to generating movies.\nFrom reading checks to driving cars.\nFrom tiny neurons to entire worlds created with a prompt.\n\nThis moment is not the beginning.\nIt is the acceleration.\n\nSo here is my question.\nIf a small model reading numbers changed banking forever, what will today’s models change next?\n\n#AI #DeepLearning #MachineLearning #TechHistory #NeuralNetworks #Innovation"}, {"n": 107, "client_id": "ivan", "post_ref": "7496926729240809472", "author_name": "Luke Shalom", "published": "2026-08-22", "post_type": "article", "image_count": null, "source_url": "https://www.linkedin.com/posts/lukeshalom_the-consultant-with-the-busiest-calendar-activity-7496926729240809472-DMft", "post_text": "The consultant with the busiest calendar is rarely the one with the best clients.\n \nYou are told that if you just do more, the right ones turn up eventually.\n \n- Post five times a week.\n- Build a bigger list.\n- Get on more calls.\n \nSo that is what most experts do at 20 to 50k a month. Volume, piled onto a target market they picked years ago and have never once checked.\n \nI did the same thing last month. Ten hours in a dark room in Medellín building a GTM strategy, all of it pointed at a market my client was not actually selling to.\n \nThe real answer had been sitting in his own records the whole time.\n \nYou have that file too. Your invoices, your won and lost proposals, your call recordings. At 20 to 50k a month there are enough of them for the pattern to be real.\n \nAlmost nobody opens it.\n \nThis week's issue is built around one column almost nobody pulls. How many meetings each person actually sat in.\n \nThe senior buyer everyone swore was the decision maker appeared in exactly one. Somebody four rungs below him appeared in 44.\n \nIf your pipeline still feels like luck, read this before you spend another month adding volume.\n \nRead the issue below.\n \nP.S. Thank you to the almost 10,000 of you subscribed in under two months."}, {"n": 108, "client_id": "ivan", "post_ref": "7447652009031368704", "author_name": "Nick Saraev", "published": "2026-04-08", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/nick-saraev_i-just-dropped-a-free-3-hour-advanced-claude-activity-7447652009031368704-RpCk", "post_text": "I just dropped a free 3-hour advanced Claude Code course on YouTube.\n\nThis picks up where my beginner course left off and covers the stuff that took me months of real usage and real money burned on tokens to figure out.\n\nI use Claude Code every day across a business generating over $4 million a year in profit, and I teach over 2,000 people how to do the same inside Maker School. This course is everything I wish someone handed me when I was past the basics.\n\nWhat's inside:\n\n→ How to structure your CLAUDE .md so it actually saves you tokens and improves output quality (it's four things, and most people only do one of them)\n\n→ Agent harnesses, agent teams, and parallelization with fan-out/fan-in research flows and stochastic consensus\n\n→ Karpathy's auto-research loop and how I'm using it to optimize my own websites and cold email campaigns\n\n→ Browser automation across three levels: HTTP requests, Chrome DevTools MCP, and full computer use and when to use each\n\n→ How to diversify away from Claude Code dependency so you don't lose a full day of productivity during an outage\n\n→ Workspace organization for personal, business, and client projects\n\n→ A full security module covering API key leaks, hallucinated package names, database RLS, and a copy-paste audit prompt\n\nComment \"ADVANCED\" and I'll send you the direct link plus a companion doc with my actual CLAUDE .md setup, the auto-research framework files, and the security audit prompt I walk through in the course."}, {"n": 109, "client_id": "arch", "post_ref": "7486219828014350336", "author_name": "Andy Lunique", "published": "2026-07-24", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/andy-lunique-a0524920_to-the-spider-man-and-marvel-marketing-team-activity-7486219828014350336-UcA1", "post_text": "To the Spider-Man and Marvel Marketing team who got the budget for this promo, just know I envy you and your budget. Well done.\n\nPost Clarification: (Don't want to edit the original) but it's my understanding that this was a digital creation made to promote a movie theatre and it's set in Bulgaria. Fooled me but....you know doing it for real for the next film sounds like a good idea. What is confusing me is I don't know if the video is sponsored or fan made as it's not really disclosed. \n\nhttps://lnkd.in/enWRuskX this is the video, made by Borislav Aleksandrov (https://lnkd.in/ez74vsYQ)"}, {"n": 110, "client_id": "ivan", "post_ref": "7452718535237287937", "author_name": "Layla Pomper", "published": "2026-04-22", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/laylapomper_operations-leadershiplessons-processdriven-activity-7452718535237287937-IONi", "post_text": "“Common sense” isn’t as common as we think.\n\nOne big lesson we’ve learned while managing a small team?\n\nSwap “common sense” for “context.”\n\nBecause clarity beats assumption—every time.\n\n👋 Hello, by the way! I'm Layla at ProcessDriven. Follow me for practical tactics for organizing small team operations using processes, procedures, and technology.\n\n#operations #leadershiplessons #processdriven #teamworktip"}, {"n": 111, "client_id": "arch", "post_ref": "7492559351870570497", "author_name": "Viktor Ryzhov", "published": "2026-08-10", "post_type": "carousel", "image_count": 0, "source_url": "https://www.linkedin.com/posts/viktor-ryzhov_nte-case-study-activity-7492559351870570497-mynf", "post_text": "4M+ views. 14K average CCV on #Twitch. 1 week.  \n🚀 Most game launches chase the audience that's already looking. For Neverness to Everness — an urban open-world #RPG from Hotta Studio — Zorka.Agency | Influencer and Performance Marketing Agency went after the ones who weren't.\nA global launch across the #US, #Germany and #France, full rollout in about a week. Plus an honest look at what happened when a \"sure thing\" premium placement didn't quite deliver.\nSwipe through for the full story 🎮"}, {"n": 112, "client_id": "risedtc", "post_ref": "7411686642325024769", "author_name": "Pranjalpatel", "published": "2025-12-30", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/pranjalpatel_from-02-roas-to-215-roas-in-few-months-activity-7411686642325024769-I6qm", "post_text": "From 0.2 ROAS to 2.15 ROAS in few months\n\nThat's the result we got a struggling Beverage Brand\n\nUsing this exact Scorecard below we use internally \n\nto Build 300+ Landing pages and 1000+ CRO tests \n\nfor our 7, 8 and 9 figure Ecom brands Clients \n\nI have built this Cold Traffic Landing Page Scorecard\n \nusing the exact framework we use \n\nto review funnels before scaling spend.\n \nIt helps you quickly answer questions like:\n \n→ Is this page even meant for cold traffic? \n→ Does the message match the ad promise? \n→ Are we educating before selling? \n→ Where is trust missing?\n → Is the offer strong enough for a first-time buyer?\n → What CRO test would actually move revenue?\n \nIt takes under 10 minutes to use.\n \nNo tools. \nNo dashboards. \nNo guessing.\n \nUse it on your homepage.\n \nYour LPs.\n \nYour PDPs.\n \nYou’ll immediately see where the money is leaking.\n\nThis is the same thinking that’s helped brands unlock\n \n6 and 7 figures in extra revenue\n \nwithout increasing ad spend.\n \nIf you’re spending more than $100,000/ month on Ads\n \nand want to stop guessing why pages don’t convert:\n \n𝗣𝗦: 𝗟𝗶𝗸𝗲 👍 + 𝗖𝗼𝗺𝗺𝗲𝗻𝘁 “𝗦𝗖𝗢𝗥𝗘𝗖𝗔𝗥𝗗”\n \nand I’ll DM you the Notion Doc."}, {"n": 113, "client_id": "arch", "post_ref": "7490326936536371200", "author_name": "Peter Fodor", "published": "2026-08-04", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/petrfodor_90-days-of-creative-production-time-cut-down-activity-7490326936536371200-Oz0f", "post_text": "90 days of creative production time cut down to 9. Same team, same budget, so how is it possible?\n\nThat was the real case from Playtika shared in a webinar we hosted last week: why 80% of mobile gaming ad creatives are effectively dead within 24 hours of launch, and what separates the teams that adapt from the ones that don't. \n\nTal (Playtika), Zeynep (Zynga), Viren (AppAgent) and Lisi (Singular) shared some really cool insights:\n\n1. Speed beats volume. The 90-to-9-day case wasn’t about one change. They made the whole loop from brief to test faster by fully disrupting the old process.\n\n2. It's ok for ideas to fail. None of the four panelists claimed a high hit rate on new concepts. The goal shouldn’t be fewer failures, it's diagnosing why a creative died fast enough to make the next batch smarter.\n\n3. AI didn't replace the creative person, it replaced the waiting. Instead of briefing 3 variations and waiting a week, teams are generating a dozen and letting performance decide the winner in days.\n\n4. Benchmark against the market, not just your own history. Ad fatigue is happening industry-wide right now. If you only compare yourself to yourself, you can miss that the whole market shifted, not just your account.\n\n5. Branding instincts don't automatically transfer. Zeynep made the jump from traditional brand advertising. The habit she had to unlearn: falling in love with an idea before the data weighs in.\n\nSUMMARY: Speed = learning. Learning = fewer dead ads. Fewer dead ads = cheaper UA.\n\nWhat's your test-to-kill time right now? 48 hours, 7 days, or somewhere beyond that?"}, {"n": 114, "client_id": "risedtc", "post_ref": "7424428493469376513", "author_name": "Aggiemeroni", "published": "2026-02-03", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/aggiemeroni_i-always-wonder-why-marketers-and-other-ads-activity-7424428493469376513-6ijY", "post_text": "I always wonder why marketers and other ads people try and conceal their identities when they sign up for my free trainings.\n\n(Many, many did that over the last week 😅🕵️‍♀️)\n\nGenuinely?\n\nIs it ego?  They don’t want to admit they’re not confident about the thing I’m teaching?\n\nOr \n\nDo they have bad intentions? Not sure what they might be tho? \n\nIt honestly baffles me.\n\nI’m flattered that they take the time to learn from me!\n\n(and if it raises the standards of the industry, I’m all for it 😎)\n\nIf the pros are learning from me, I guess I know my stuff 👀\n\nMy CPD- Accredited Meta Ads Strategist programme is open for enrollment until Monday 9th Feb at 5pm.\n\nLink in comments 👇🏻"}, {"n": 115, "client_id": "ivan", "post_ref": "7439306490634502144", "author_name": "Kenny Damian", "published": "2026-03-16", "post_type": "post", "image_count": null, "source_url": "https://www.linkedin.com/posts/kenny-damian-90aba221a_claude-code-can-now-prospect-enrich-write-activity-7439306490634502144-VgVp", "post_text": "Claude Code can now prospect, enrich, write copy, and launch campaigns.\n\nHere is the full breakdown.\n\n\n1️⃣ Detect signals\n→ Hiring, funding, tech stack, competitor swaps\n→ Pull signal data and tag by strength\n→ Only move forward on real buying intent\n\n2️⃣ Score and filter against your ICP\n→ Read your ICP rules\n→ Score each account based on fit and signal\n→ Cut the noise before you ever write a line of copy\n\n3️⃣ Find decision-makers via Sales Nav\n→ Build the search from your ICP\n→ Pull key roles only\n→ Map 1-3 buyers per account\n\n4️⃣ Enrich contacts across 3 providers\n→ Hit multiple enrichment APIs\n→ Fill direct emails, LinkedIn, key firmographics\n→ Push clean data back into your table\n\n5️⃣ Generate personalised copy at scale\n→ Read your offer, case studies, past wins\n→ Write angle based on the signal and role\n→ Keep tone and structure from your best templates\n\n6️⃣ Push to campaign automatically\n→ Sync to your outbound platform\n→ Set multichannel sequences\n→ Keep CRM updated in the background\n\n7️⃣ Analyse what converts, and improve\n→ Track replies and meetings\n→ Write win notes into the record\n→ Update rules and templates based on real results\n\nThe project folder becomes your GTM brain. Storing ICP and waterfall logic. Your Copywriting folder, houses all your winning copy. \n\nI packed the whole thing into a cheatsheet:\n5 campaign plays, key commands, and when to use Claude Code vs Clay vs n8n.\n\nYou can check out the HD version of the guide here - https://lnkd.in/ejnTvYhB"}, {"n": 116, "client_id": "arch", "post_ref": "7480992411993890817", "author_name": "Jakub Remiar", "published": "2026-07-09", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/jakubremiar_hotel-legacy-by-century-games-already-scaled-activity-7480992411993890817-IjpD", "post_text": "Hotel Legacy by Century Games already scaled to $70K a day 🤑, how does the new merge game from #2 in the genre look? 😎 get the latest here...\n\nIt seems the playbook of Microfun, the market leader is being applied. So if you have one merge game keep releasing them, until you flood the charts 😅. \n\nWhen we picked up this game I really thought it would start with the My Perfect Hotel 🏨 minigame as onboarding, as this is already in 50% of their current creatives. \n\nIn their other merge game, Tasty travels, which has most of the creatives with Fruit Merge, you can actually play this in the actual game, but not here. Or maybe better answer would be not here yet. \n\nI am still expecting that this could change when they will fine tune the creatives and add this later, but again, its just a wild guess 😅. \n\nMerge Market is still hot 🔥 as other competitors are trying to break through, with the latest one being Hollywood Merge that scaled to $230K a day just in 6 months 😲 \n\nJoin us as we talk about all of this with Felix & Matej on the latest episode of two & a half gamers podcast 😎\nData based on Sensor Tower, 10x 4 the support 🤗."}, {"n": 117, "client_id": "ivan", "post_ref": "7473779985082773504", "author_name": "Luke Shalom", "published": "2026-06-19", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/lukeshalom_up-until-4-years-ago-id-given-up-on-holding-activity-7473779985082773504-3DDf", "post_text": "Up until 4 years ago I'd given up on holding down a job.\n\n7 jobs in 5 years. None lasted past 6 months. My CV was a graveyard of failed experiments.\n\nTurns out the thing that made me a terrible employee made me a half-decent founder.\n\nI've always been good at one thing: knowing exactly when a system is broken, and walking away before it drags me down with it.\n\nI just never had anywhere to point it. Until I started the agency.\n\nIn 2023 I had some beginner's luck. Hit $10k profit a month within a few months of starting. Coming off dead-end jobs paying a quarter of that, I thought I'd made it.\n\nNo more staring out the window wondering when my life was going to start.\nThen the model showed me its teeth.\n\nSign 3 clients, lose 1. Push for more revenue, hire more bodies, watch the profit get eaten alive.\n\nBy 2025 we had a record month. $60k in MRR.\n\nMy take-home was under $4k.\n\nThat was the moment. On paper I had a growing business. In my account I was making what I made in a sales job, with 10x the stress.\n\nGrey hairs. 4-6 hours of sleep a night. Running ragged to hold it all together.\n\nSo I did the thing I'm actually good at. I quit the model.\n\nTeam of 20 down to 10. Then 10 down to 5.\n\nI stopped throwing people at the problem and got obsessed with becoming a leveraged operator. \n\nScaling with AI and systems instead of headcount.\n\nWe closed $270k in 4 months and finished the year at $250k net profit. With a fraction of the team.\n\nHere's what I'd tell you if your back's against the wall right now:\n\n1) Leverage makes everything easier. A founder brand gives you optionality. When you've got an audience, you can ship new offers fast and move when the market moves.\n\n2) Ignore the people making you feel behind with their over-engineered tech stacks. The strongest combo is still clear positioning, a daily post, and talking to buyers in the DMs. It's the blue-collar work you're avoiding.\n\n3) Use AI in your acquisition. But know exactly where a human has to come in to tie it into a system that actually gets you from cold connect to closed-won.\nPersist. Every playbook I've built went through a stretch where it looked like nothing was happening. Push until you find the signal, then double down.\n\nWe are still far from perfect in our business. \n\nBut one thing I do know is that if we had kept doing the same thing. We wouldn't be here right now. \n\nSometimes its not so much pushing to win at all costs.\n\nIt's more about knowing when to quit. \n\nLike this post? Follow me (Luke Sh"}, {"n": 118, "client_id": "risedtc", "post_ref": "7476286908680151040", "author_name": "Matthew Augusta 5032A564", "published": "2026-06-26", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/matthew-augusta-5032a564_if-youre-still-running-the-same-design-with-activity-7476286908680151040-pB2X", "post_text": "If you're still running the same design with three different headlines on Meta, I have bad news.\n\nThat trick is dead.\n\nMeta treats those as the same exact ad. Same design, swapped headline? It doesn't see three ads. It sees one. And you're not getting the data you think you're getting.\n\nHere's what a unique asset actually means now:\n→ A completely different design\n→ Completely different copy\n\nBoth have to be different.\n\nWhen you do that, you signal to Meta that these are genuinely new ads speaking to new personas. The algorithm responds by distributing spend across each one, so you finally get useful, comparable data back.\n\nSame headline, new wrapper won't cut it anymore. Different angle, different execution will."}, {"n": 119, "client_id": "risedtc", "post_ref": "7451897447481634817", "author_name": "Gil David", "published": "2026-04-20", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/gil-david_one-for-any-retailers-in-my-connections-here-activity-7451897447481634817-rOpg", "post_text": "One for any retailers in my connections here 👀\n\nWas picking up a couple of treats from my local shop for a meeting I had last week and the pricing and product placement here struck me as strange.\n\nCan you guess why?\n\nTwo very similar products here with little to differentiate at first glance outside of the packaging... other than one costs 50% less than the other.\n\nIt was also placed higher up on the shelves making it more noticeable and easier to access, and judging by how many of the current darling of Dragon's Den Oatco Superfuel had gone vs the competitor it seemed like this pricing/psychological effect wasn't only me.\n\nEspecially this year, consumers are more price-sensitive than they have been in a while so from the other brand's POV, this seems a major disadvantage. \n\nPS these are great with a cuppa"}, {"n": 120, "client_id": "risedtc", "post_ref": "7459502048934473728", "author_name": "Aggiemeroni", "published": "2026-05-11", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/aggiemeroni_sitting-here-blown-away-i-just-had-to-activity-7459502048934473728-yTHU", "post_text": "Sitting here blown away 🤯\n\nI just had to upgrade my zoom package.\n\nMy free Meta Ads Beginners Bootcamp starts at 8pm tonight.\n\nMon-Thurs this week at 8pm I’ll be teaching business owners and marketers alike, what makes Meta ads work in 2026 🥹\n\nAnd the biggest thing, I’m not nervous! (Just that zoom will doing something weird IYKYK)\n\nSo, so, so excited!\n\nIt’s the second time I’m running it this year and it’ll be my biggest ever 🥹\n\nIt’s not too late to sign up.\n\nIt’s also my 6th business birthday tomorrow so I’m doing an extra giveaway (in addition to the ones I had planned already) 🥳🥳🥳\n\nGot FOMO? I’ll drop the link in the comments.\n\nSee you at 8pm! (UK time)\n\nReplays will be live for a week after x"}, {"n": 121, "client_id": "arch", "post_ref": "7430167470159818752", "author_name": "Michael Kuzminov", "published": "2026-02-19", "post_type": "text", "image_count": 0, "source_url": "https://www.linkedin.com/posts/michael-kuzminov_influenceragency-influencercase-businessgrowth-activity-7430167470159818752-CeI3", "post_text": "We had a client who, despite millions of views, was struggling with a low conversion rate.\n\nReach may seem like a nice metric,\nbut if conversions are your goal, you need a different approach.\n\nAfter our team launched the new strategy, the client saw results from their very first campaign:\n\n✔️ Increased conversion rate to 16.3%\n✔️ Reduced CPM by 40% with higher-quality traffic\n✔️ Reduced CPC by 63%\n\nWhat we offered our new client:\n\n1) Focus on high-quality, niche audiences\n2) Selecting creators with a truly relevant audience\n3) Content with a clear CTA \n4) Results analytics based on post-click behavior, not views\n\nSometimes, 1K niche views drive more business growth than 1M random views\n\n#influenceragency #influencercase #businessgrowth"}, {"n": 122, "client_id": "ivan", "post_ref": "7498364825140482048", "author_name": "Timi Merivirta", "published": "2026-08-26", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/timimerivirta_claude-linkedin-can-replace-5000m-lead-activity-7498364825140482048-LTxZ", "post_text": "Claude + LinkedIn can replace $5,000/m lead gen agencies.\n\nOne client went from 0 inbound leads to 33 qualified ones in 14 days.\n\nAnd I'm giving it away.\n\nBecause I still see B2B founders living off referrals.\n\nWaiting on the next warm intro instead of building something that books calls every single week.\n\nA referral pipeline stops the month nobody thinks to refer you.\n\nSo I spent the last 2 days documenting the exact Claude + LinkedIn setup we use to run outreach and content on autopilot.\n\nInside you'll find:\n\n→ How to get Claude to build your outreach messages\n→ The 50 agents worth running (and the 5 to start with)\n→ How to build your ICP filter so the positioning is clean\n→ How to run your first connection campaign\n→ The first message for each entry point\n(post liker, profile viewer, commenter, cold connect)\n→ The follow-up sequence that turns a reply into a booked call\n→ Lead magnets that blow up your LinkedIn account\n\nThis is the exact system behind those numbers.\n\nGiving away the SETUP for free ⬇️"}, {"n": 123, "client_id": "ivan", "post_ref": "7499878439877910528", "author_name": "Timi Merivirta", "published": "2026-08-30", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/timimerivirta_its-crazy-how-many-people-still-run-their-activity-7499878439877910528-_uhB", "post_text": "It's crazy how many people still run their LinkedIn accounts fully manually.\n\nHere are 11 things to delete and the 11 Claude skills that fix it:\n\n(all 11 skills are free, check the image)\n\nDelete these from your profile today-\n\n1. Coment CTA's in the post copy\n2. Hashtags. Every one\n3. Stacked asks. Like, comment, connect and repost\n4. Links in the first comment. Put them in the post\n5. Long hooks. Both lines have to be seen on mobile.\n6. The pitch in the first message.\n7. Value / Info posts.\n8. \"Helping founders scale\" in your headline.\n9. Only focusing on cold outreach. \n10. Waiting for people to message you first.\n11. Posting five days a week with nothing to give away\n\nThese are my personally used 11 Claude skills that fix these:\n\n1. /icp\nBuilds the buyer profile the whole system runs on.\n\n2. /profile\nRewrites the headline, banner and about section as a landing page.\n\n3. /requests\nWrites the connection request. The accepted request is the distribution.\n\n4. /ideas\nTurns this week's live work into post ideas across all 27 structures.\n\n5. /hooks\nWrites the first two lines so both land before the mobile cut.\n\n6. /post\nWrites the full post in your voice, not a version of your voice.\n\n7. /audit\nPaste a draft. It comes back rewritten, not scored.\n\n8. /lead-magnet\nBuilds the resource and the image the CTA lives on.\n\n9. /comment-to-dm\nDrafts the replies to everyone who commented, one ask each.\n\n10. /outreach\n53 messages across 11 stages. Connection request to booked call.\n\n11. /numbers\nContent leads and outreach leads counted separately, every Friday.\n\nI'm giving away the complete library for free.\n\nhttps://lnkd.in/edcu2yka"}, {"n": 124, "client_id": "arch", "post_ref": "7482523339408920576", "author_name": "Andy Lunique", "published": "2026-07-13", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/andy-lunique-a0524920_12-years-on-the-publisher-side-of-gaming-activity-7482523339408920576-fHg2", "post_text": "12 years on the publisher side of gaming. Xbox, Discord, Epic, Bungie, Respawn, and 2 publishers for short term contract consulting. All my work designing and building creator programs and working with some of the most talented people in the game. Every one of those years taught me the same lesson: the best part of this job has always been the creators themselves.\n\nSo I'm following that.\n\nWhatever I decided to do, the next chapter has to be on the creator side of the table. I mean actually Working hand in hand with creators to build their careers, their businesses, and their longevity, the way a proper meal is built: with care, patience, and people around the table.\n\nMy time in London and now Develop Brighton has helped me understand my target. My best work is aligned with minds and teams that are putting creators first. My door is open to the people who understand what that means, and need the right person. \n\nAnd to the creators I've worked with over the years thank you, as usual what I do will be in service to your work and your community. \n\nLet's break bread. 🍳🎮\n\nOh I also designed a new type of gimlet while I've been here. Going to find a nice appetizer to pair with. The bartender had fun."}, {"n": 125, "client_id": "ivan", "post_ref": "7429910067052969984", "author_name": "Nick Saraev", "published": "2026-02-18", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/nick-saraev_i-just-published-what-i-think-is-the-most-activity-7429910067052969984-iBhE", "post_text": "I just published what I think is the most comprehensive Claude Code course out there right now on YouTube.\n\nI use Claude Code every single day across a business that does over $3M a year in profit, and I teach over 2,000 people inside Maker School how to use it for both personal and professional projects. This course is basically everything I know about it condensed into one place.\n\nThe course takes you from zero to advanced in 4 hours: everything from installation and building your first project in under 15 minutes, all the way through to sub-agents, Git worktrees, and deploying to the cloud with Modal. Plus all the project files are included for free so you can follow along.\n\nOnce you go through this course, Claude Code will genuinely augment your productivity in a way that's hard to overstate.\n\nWant access to the course + all the project files?\n\n1. Like this post\n2. Comment \"CLAUDE\"\n3. Connect with me so I can DM you\n\nI'll send you the full course link and the Google Drive folder with everything in it."}, {"n": 126, "client_id": "ivan", "post_ref": "7432446802957598721", "author_name": "Michele Torti", "published": "2026-02-25", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/michele-torti_every-client-in-my-program-gets-the-same-activity-7432446802957598721-vzSl", "post_text": "Every client in my program gets the same roadmap.\n\nSame deep dive audit.\nSame portal.\nSame accountability calls every two weeks.\nSame 24/7 support.\n\nNothing changes.\n\nYet the results?\n\nCompletely different.\n\nI’ve had clients like Syed who executed immediately.\nClosed deals between $1.5K–$5K.\nBuilt momentum fast.\n\nAnd I’ve had others…\n\nWho were told:\n“Reach out to 600 prospects this month.\nThat’s 20 per day.”\n\nThey did 15 total.\n\nThen said:\n“Maybe this doesn’t work.”\n\nSame roadmap.\nDifferent execution.\n\nThat’s the uncomfortable truth in this space.\n\nPeople don’t fail because they lack information.\nThey fail because they treat execution like a suggestion.\n\nIf you’ve already decided you’re building an AI agency.\n\nThe only real question is:\nAre you actually doing the work required?\n\nWhat’s the thing you know you should be doing daily but aren’t?"}, {"n": 127, "client_id": "arch", "post_ref": "7487878032859410432", "author_name": "Jakub Remiar", "published": "2026-07-28", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/jakubremiar_hexa-away-scaled-to-130k-a-day-but-then-activity-7487878032859410432-fJqr", "post_text": "Hexa Away scaled to $130K a day 🤑, but then declined heavily. Its still the 6th biggest sort puzzler by revenue, so what happened here? 🤔 \n\nThe game is a great combination of Hexa Sort and Arrows ➡️ gameplay, where you are limited by moves now and you can use the 3D space as hexagons can fall out now, not just move as arrows on 2D plane.\n\nThe moves instead of time as a fail state is an interesting choice as Arrows itself has no limiter of either times or moves, but it seems this didn't really worked out 😖.\n\nAs Matej mentioned, it seems the UA didn't really hold up as we see on the number of new creatives in last month, which was just 4 ☠️. So it basically downscaled to minimum of 10K downloads a day. \n\nI still think that we haven't seen the last word of adaptation of arrows core gameplay. Grand Games is also running one, which is time based ⏲️ instead of turn based, but with the downloads volume of the original its a no brainer to try. \n\nJoin us as we talk about all of this with Matej & Felix on the two & a half gamers podcast 😎 \nData based on Sensor Tower, 10x 4 the support 😊"}, {"n": 128, "client_id": "risedtc", "post_ref": "7467909612600537090", "author_name": "Aurary", "published": "2026-06-03", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/aurary_madelyn-byers-has-managed-100m-in-ad-spend-activity-7467909612600537090-ZAiU", "post_text": "Madelyn Byers has managed $100M+ in ad spend. Run paid social across four brands at once. Deployed more ads than most teams will in a lifetime.\n\nAnd she'll still tell you she sometimes has absolutely no idea what's going to work.\n\nThat's not a lack of confidence. That's what 10 years in performance creative actually teaches you.\n\nShe built creative programmes across the entire HelloFresh Group, Factor, Green Chef, Everyplate. Four brands. Four different customers. Four different reasons people show up. All running simultaneously.\n\nNow she's at Black Girl Vitamins. Where the community isn't a marketing channel. It IS the brand.\n\nIn this episode, she pulls back the curtain on:\n\n🎨 The two-lane creative system she runs at every brand and why the brands willing to be experimental are always the ones that stay ahead\n🎨 Why the hook gets all the glory but the CTA is the most underrated part of any video\n🎨 Ugly ads. Why they work. And why most brands are too scared to go there\n🎨 What Andromeda has actually done to performance marketing and why she thinks it's brought us back to what advertising was always supposed to be\n🎨 The exact CPA threshold she uses to call winners fast and move them into scale\n🎨 Why spend is king. If it doesn't win on relaunch, it was never a real winner.\n\nI went in expecting testing frameworks and creative structures. It turned into one of the most honest conversations about what it means to make creative that actually connects with people.\n\nFull episode is out now on Spotify, Apple Podcasts and YouTube."}, {"n": 129, "client_id": "risedtc", "post_ref": "7480523591994937345", "author_name": "Gil David", "published": "2026-07-08", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/gil-david_its-pretty-wild-how-google-suddenly-decided-activity-7480523591994937345-TVKo", "post_text": "It's pretty wild how Google suddenly decided 'it's bad if we let advertisers overachieve so let's just change our bidding system and get them to spend more.'\n\nFor years, advertisers on Google have enjoyed being able to, for example, set a target CPA of $50 but a campaign chugs along at $30.\n\nMight not spend the budget every day but hey, for most brands performance is the priority over daily spend.\n\nFor Google, it's the opposite.\n\nEvery day a campaign doesn't at least spend the daily budget it is a massive fail.\n\nInternally, execs probably report weekly on how many millions of lost revenue they suffer due to unmet budgets while these pesky campaigns are overperforming.\n\nNO LONGER said someone high up.\n\nFrom August 17th, a budget-capped campaign will keep spending and slowly drift up towards whatever target CPA you've set vs how it's worked for as long as I can remember. \n\nWe're reviewing and resetting targets across every account over the next few days, so if you've got campaigns cruising under target, go do the same before Google does you a 'favour.'\n\nMeta's cost cap bidding has been drifting the same direction for a while, and these two do love copying each other's homework. So it wouldn't surprise me if they announce something similar in a few months too.\n\nMust be nice being so big you can just turn on the money tap whenever you feel like it."}, {"n": 130, "client_id": "risedtc", "post_ref": "7480367327193120768", "author_name": "Tobyjwaller", "published": "2026-07-07", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/tobyjwaller_were-hiring-a-google-media-buyer-not-looking-activity-7480367327193120768-XwkD", "post_text": "We're hiring a Google Media Buyer.\n\nNot looking for someone who just switches everything to Performance Max and hopes for the best.\n\nWe're looking for someone obsessed with ecom.\n\n- Someone who still understands manual bidding even though nobody teaches it anymore\n- Knows the difference between Search intent and Shopping intent\n- Can diagnose a broken feed before blaming the algorithm\n- Isn't scared to turn PMax off if the data says so.\n\nIf you've managed six or seven figure monthly budgets on Google, DM me."}, {"n": 131, "client_id": "ivan", "post_ref": "7426596173857161216", "author_name": "Ruben Hassid", "published": "2026-02-09", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/ruben-hassid_stop-using-chatgpt-for-everything-these-activity-7426596173857161216-Z85w", "post_text": "Stop using ChatGPT for everything.\n\nThese are the only 8 tools I (actually) swear by:\n\n1. Wispr.ai → for voice-to-text\n\nYou type your prompts into ChatGPT like it's 2024.\nI just talk. Wispr types. And it learns my edits.\n80 WPM → 200+. Never going back.\n\n2. Granola.ai → for meeting notes\n\nYou paste transcripts into ChatGPT after the call.\nGranola takes notes during the call. Silently.\nDoes NOT join like a bot. Just works.\n\n3. Gamma.app → for slides\n\nYou ask ChatGPT to \"make slides.\" It gives you text.\nGamma actually builds the deck. One prompt. Done.\nThe best PowerPoint killer. Period.\n\n4. Claude.ai → for writing\n\nYou rewrite ChatGPT outputs 5x to sound human.\nClaude 'Cowork' gets it right on the first try.\nTeach it with your voice. Upload .md files.\n\n5. Grok.com → for search\n\nChatGPT doesn't know what happened 2 hrs.\nGrok does. Real-time tweets pulled straight from X.\nAsk a question. Get facts. Not guesses and links.\n\n6. Nanobanana (gemini.google.com) → for images\n\nDALL-E gives you animated, cartoonish images.\nNanoBanana gives you exactly what you asked for.\nClean. Believable. Editable. No more 5th try.\n\n7. Notebooklm.google.com → for research\n\nYou paste docs into ChatGPT & hope to train it.\nNotebookLM reads sources & becomes your expert.\nUpload your sources. Ask anything.\n\n8. Opus.pro → for video\n\nChatGPT can write a video script. That's it.\nOpusClip takes one YouTube link → 20-40 shorts.\nWhat took 4 hours now takes 4 minutes.\n\nChatGPT made you work in 2025.\nThese 8 tools work for you in 2026.\n\nSave this. Try one tool this week. Thank me later.\n\nYou want to help your network?\n\n♻️ Repost this image so they can find the best AI.\nSubscribe to my free newsletter: how-to-ai.guide."}, {"n": 132, "client_id": "ivan", "post_ref": "7435407982403948544", "author_name": "Allie K. Miller", "published": "2026-03-05", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/alliekmiller_i-built-an-ai-water-cooler-thats-been-sitting-activity-7435407982403948544-SPmZ", "post_text": "I built an AI water cooler that's been sitting in a beige office since 1987, absorbing complaints.\n\nHer name is Barb, named after Susan Berger's character in Jury Duty.\n\nYou walk up. You vent. Barb (the longtime smoker who has seen it all) listens. She has zero filter. She loves gossip. \"Oh honey. What now?\"\n\nThen she pivots and actually handles and solves your complaint with auto-agent kickoffs (all set to dangerous permissions).\n\nYou can also click the cooler itself and jump inside the cooler to see all the problems she's solved for you.\n\nI'm sick of clean (boring) single chat thread interfaces. I want the mystical highly capable heavy smoker Barb that lives in a water cooler that I can just yap with.\n\nLess chatbots, more coworkers."}, {"n": 133, "client_id": "risedtc", "post_ref": "7470475952540553246", "author_name": "Tobyjwaller", "published": "2026-06-10", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/tobyjwaller_were-looking-for-a-new-video-editor-to-join-activity-7470475952540553246-Nu8R", "post_text": "We're looking for a new Video Editor to join Brick.\nA lot of editors can edit.\nFar fewer understand eCommerce.\n\nWe're looking for somebody who:\n\n• Has direct experience editing Meta ads for ecom brands\n• Understands direct response marketing\n• Can take a brief and elevate it rather than simply execute it\n• Studies winning ads and creative trends in their own time\n• Brings ideas and concepts proactively to the team\n• Takes pride in producing best-in-class work\n\nOur clients are ambitious brands spending anywhere from $50k-$2m+ per month on paid media, so the standard is high.\n\nIf that sounds like you (or somebody you know), send me a DM with examples of your work and a short introduction."}, {"n": 134, "client_id": "risedtc", "post_ref": "7494381140225466368", "author_name": "Ben Zettler", "published": "2026-08-15", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/benzettler_in-the-last-90-days-a-client-using-klaviyos-activity-7494381140225466368-PHgj", "post_text": "In the last 90 days, a client using Klaviyo's Customer Agent has had 519 conversations resolved by AI.\n\nConservatively, if each conversation lasts an average of 3 minutes, that mean's Klaviyo's AI-powered chat has saved their customer service staff (a team of 1 in this case) 25 hours of their time 🤯 \n\nIf you run an ecommerce brand, you simply can't afford to not invest in tools that help you  ̶s̶a̶v̶e̶ ̶t̶i̶m̶e̶ make money. \n\nDon't sleep on it. Or actually, if you feel so inclined that's exactly what you can do when you let AI have a positive impact on your business."}, {"n": 135, "client_id": "arch", "post_ref": "7473257947582816256", "author_name": "Felix Braberg", "published": "2026-06-18", "post_type": "carousel", "image_count": 5, "source_url": "https://www.linkedin.com/posts/felix-braberg-7a732b51_did-toon-blast-just-add-interstitial-ads-activity-7473257947582816256--cqw", "post_text": "Did Toon Blast Just Add Interstitial Ads?\n\nToon Blast is one of the most successful mobile games ever built, with over $2.3B in lifetime IAP revenue according to Sensor Tower.\n\nFor a long time, Toon Blast's monetization strategy was consistent:\n♦️ Rewarded ads only\n♦️ No forced interstitials\n♦️ IAPs were the main monetization strategy \n\nThat design choice wasn’t accidental, as Interstitial ads tend to harm retention and carry a level of stigma in premium games.\n\nBut something has changed.\n\nData from KAI Explorer (Kayzen) suggests Toon Blast started generating millions of interstitial ad requests in March, with another spike in June. Furthermore, reviews from the same time period seem to report unskippable ads for some users. \n\nToon Blast has a ~1.8M DAU; even conservative estimates suggest:\n💹  $50K–$100K/day in incremental ad revenue\n\nThat’s meaningful, but still small compared to its IAP engine that makes close to $30 million per month.\n\nThis likely isn’t about monetization. It’s about growth.\n\nDream Games showed the blueprint earlier this year by adding interstitials to Royal Match and Royal Kingdom, enabling blended ROAS campaigns and more aggressive scaling of user acquisition.\n\nIf Toon Blast is following the same path, the implication is bigger than it looks:\n\nInterstitials aren’t just a revenue lever.\n\nThey’re a UA unlock. 🧨 \n\nI expect the majority of premium games to monetize with interstitial ads before the end of this year."}, {"n": 136, "client_id": "ivan", "post_ref": "7427230188029050880", "author_name": "Pascal Bornet", "published": "2026-02-11", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_robotics-ai-accessibility-activity-7427230188029050880-h-xL", "post_text": "This is the kind of robotics progress I pay attention to.\n\nToyota introduced Walk Me, a walking wheelchair that moves on mechanical legs instead of wheels. It can climb stairs, handle rough terrain, and adapt to environments that were never designed to be accessible.\n\nThe point is independence. Getting from A to B without asking the world to be perfectly flat.\n\nI have long believed robotics will not be about humanoids.\nIt will be about task shaped machines, designed around real human constraints.\n\nWalk Me is a good example of that shift.\n\nSo here is the question.\nIf robots are shaped by tasks, not appearances, what should we design next?\n\n#Robotics #AI #Accessibility #AssistiveTechnology #HumanCenteredDesign #FutureOfWork"}, {"n": 137, "client_id": "ivan", "post_ref": "7451056754207100928", "author_name": "Layla Pomper", "published": "2026-04-17", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/laylapomper_processdriven-is-hiring-again-were-seeking-activity-7451056754207100928-rPpR", "post_text": "ProcessDriven is hiring (again)! We're seeking a US-based part-time Customer Experience Assistant to round out our 100% remote team.\n\nJob posting and application are at: https://lnkd.in/gzisPDjQ\n\n🔁 Please comment and share to help spread the word! Would love to find the right person quickly."}, {"n": 138, "client_id": "ivan", "post_ref": "7493979606136471553", "author_name": "Lara Acosta", "published": "2026-08-14", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/laraacostar_august-has-been-a-monumental-month-for-my-activity-7493979606136471553-wIN3", "post_text": "August has been a monumental month for my startup.\n\n→3M+ organic views for our launch campaign \n→300+ new subscriptions in under 7 days. \n→150+ entrepreneurs at our launch party\n→30+ founders at our first mastermind\n\nAnd we haven't run a single paid campaign yet. \n\nToday I fundamentally believe that success as a founder has nothing to do with funding or a $100k budget. \n\nAll you need is an undeniable vision and a community. \n\nWe've been building in public since day 1.\nFlown out our clients and users to celebrate them.\nGiven our community more reach through our platforms.\n\nWe’re building Kleo by building everyone around it too.\n\nNo ad budget can compete with this type of connection.\n\nSeeing everyone come together in London for just 1 day made every hour we spent building this worth it.\n\nKleo isn't just a brand; it's a community with a mission. \n\nThank you for being part of this journey with us. \n\nAnd to Circle for making our community-building journey even better than we could've imagined.   \n\nWe kicked off our official partnership with them by supporting our Kleo launch party and Mastermind. And we're excited to be hosting the Kleo community on Circle.\n\nWant to start building yours? Check out Circle here https://lnkd.in/eKgtR56i\n\n\nPS: Where should we throw our next mastermind? US? UK? AUS? Comment below!"}, {"n": 139, "client_id": "arch", "post_ref": "7504426081291038721", "author_name": "Matej 🦩 Lancaric", "published": "2026-09-12", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/matejlancaric_soooo-i-launched-one-mage-army-this-week-activity-7504426081291038721-zKaC", "post_text": "Soooo, I launched One Mage Army this week with no creatives, no gameplay footage, and no designers available. 1𝟬 𝗔𝗜 𝘃𝗶𝗱𝗲𝗼𝘀 𝗺𝗮𝗱𝗲 𝗳𝗿𝗼𝗺 𝗮 𝘀𝘁𝗼𝗿𝗲 𝗹𝗶𝗻𝗸 𝗶𝗻 𝟵𝟬 𝗺𝗶𝗻𝘂𝘁𝗲𝘀. They're my best performers. 👇\n\nOne solo dev told Jakub at Gamesforum that our content took his game from $0 to $25K/month, now heading to $50K. So this one's a case study for exactly that person. \n\nSo I fed Layer the store page and one brief: 59-second, story-driven, one mage vs. a horde, keep the store's art style. 10 videos, zero gameplay, 90 minutes. Then PlayableMaker playables, plus more  playables built in Layer from the game's own sprites. The rule I keep repeating to clients applied to me: 𝘃𝗼𝗹𝘂𝗺𝗲 𝗮𝗻𝗱 𝗱𝗶𝘃𝗲𝗿𝘀𝗶𝘁𝘆 𝗯𝗲𝗮𝘁 𝗽𝗼𝗹𝗶𝘀𝗵. Ten imperfect videos beat one perfect one, everything is 59 seconds now.\n\nThe campaign setup was completely different from what I would normaly do but 𝗣𝘂𝗿𝗰𝗵𝗮𝘀𝗲 𝗲𝘃𝗲𝗻𝘁 𝘄𝗮𝘀𝗻'𝘁 𝗲𝘃𝗲𝗻 𝗶𝗻 𝘁𝗵𝗲 𝗙𝗮𝗰𝗲𝗯𝗼𝗼𝗸 𝗱𝗿𝗼𝗽𝗱𝗼𝘄𝗻 𝘆𝗲𝘁, so: \n(1) 𝗮𝗻 𝗮𝗱-𝗶𝗺𝗽𝗿𝗲𝘀𝘀𝗶𝗼𝗻 𝗰𝗮𝗺𝗽𝗮𝗶𝗴𝗻 worldwide just to get data in ($0.18 CPI, 200 installs, pause).\n \n(2) 𝗮 𝗹𝗲𝘃𝗲𝗹-𝟱 𝗮𝗰𝗵𝗶𝗲𝘃𝗲 𝗰𝗮𝗺𝗽𝗮𝗶𝗴𝗻 on tier 1 that started producing purchasers on its own - 10-13 IPM, ~$0.90 CPI, Germany is killing it..\n\n3) 𝘁𝗶𝗲𝗿-𝟭 𝗽𝘂𝗿𝗰𝗵𝗮𝘀𝗲 𝗰𝗮𝗺𝗽𝗮𝗶𝗴𝗻 at $150/day (~€2 CPI, US ~$4.00). AppLovin was the opposite of what I expected: blended-ROAS worldwide opened at a $60 CPI, then $30, $7, now $3.60 and heading for $2. I've done this a hundred times and still panicked a little on day one. The discipline is the same either way: stay calm, get data, optimize toward profit. Now Applovin is better than Facebook. 𝗝𝘂𝘀𝘁 𝟯 𝗱𝗮𝘆𝘀 𝗹𝗮𝘁𝗲𝗿!\n\nThen iterate the winner, not the batch in Layer. \"The Last Wizard\" won, so the next prompt was just: three iterations, same direction, different colors, slightly different plot twist. \n𝗧𝗵𝗮𝘁'𝘀 𝘁𝗵𝗲 𝘄𝗵𝗼𝗹𝗲 𝗹𝗼𝗼𝗽 - get something in front of the audience, find what works, and multiply it. \nAnyway, here you go: https://lnkd.in/d3_xqHh4\nLove you Potensus + PlayableMaker"}, {"n": 140, "client_id": "arch", "post_ref": "7470121531025657856", "author_name": "Jakub Remiar", "published": "2026-06-09", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/jakubremiar_block-out-is-now-the-biggest-game-on-grand-activity-7470121531025657856-NC8O", "post_text": "Block Out! is now the biggest game on Grand Games portfolio, making more than $400K 🤑 per day with out even having Android version??? 😲 ...\n\nYou read that right, and after taking over Magic Sort, now the second biggest game on their portfolio, Block Out! has also taken over past its original inspiration, Color Block Jam by Rollic. \n\nThis is a perfect example of level design innovation 💡, where the functional mechanics are nearly the same in these two games, but level design philosophy is vastly different. \n\nBlock Out! operates on the \"zero empty space principle\", which creates a much more approachable level unlock progression, where you need to unlock small areas rather than work with whole level. \n\nBecause it literally hides level areas, you can't even think many moves forward as you don't see them. In Color Block Jam you can, and actually you need to. Shout out to Ömer's Gamigion deconstruction of this 😁 \n\nGrand is also having multipe other shoots on goal with Pixel Pop! going after Pixel Flow and Arrow Jam going after Arrows. We will watch them closely 🤩\n\nJoin us as we talk about all of this with Felix and Matej on the latest episode of the two & a half gamers podcast 😎. \n\nData based on Sensor Tower, 10x 4 the support 😊"}, {"n": 141, "client_id": "ivan", "post_ref": "7472603012021190656", "author_name": "Ben Hemingway", "published": "2026-06-16", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/benhemingwaya_just-watched-30-minutes-of-a-linkedin-guru-activity-7472603012021190656-2mgK", "post_text": "Just watched 30 minutes of a LinkedIn guru running through his 'Claude Setup'\n\nI want my 30 minutes back.\n\nFor context:\n\n- One of the biggest creators here on LinkedIn\n- Full dev team\n- Endless $ to spend\n- 100,000s of followers/engagments to sift through\n\nHis end result was:\n\n- About 30 minutes work (not including actually setting it up)\n- Probably $50 in claude credits ALONE\n- Like 10 barely qualified leads\n- 10 DMs that sounded like AI and pretty much said the same thing\n\nHe played it off like he hadn't just wasted any time.\n\nI spent hours working out AI and spent thousands building tools/systems.\nI barely use it now.\n\nSo yes there's helpful skills and tools to learn,\nBut honestly, AI isn't there just yet.\n\nPS. Left that video feeling mildly fustrated ahaha"}, {"n": 142, "client_id": "ivan", "post_ref": "7417177386326339585", "author_name": "Ruben Hassid", "published": "2026-01-14", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/ruben-hassid_how-to-use-ai-better-than-99-of-people-activity-7417177386326339585-Z_J9", "post_text": "How To Use AI Better Than 99% of People:\n\n(before even typing a prompt)\n\nSTEP 1: CREATE A PROJECT\n\n✦ Open ChatGPT, Claude or Grok\n✦ Create \"Projects\"\n✦ Name the new project: \"[Your specific task]\" \n✦ Copy my setup: https://lnkd.in/exfaYnBQ\n\nAdd custom instructions:\n✦ Your role: \"[who you are]\"\n✦ Your style: \"[how you write/work]\"\n✦ Your audience: \"[who this is for]\"\n✦ Banned words: \"[words to avoid]\"\n\nUpload context files: \n✦ Examples: \"[3-5 samples of your best work]\"\n✦ Guidelines: \"[your brand voice or standards doc]\"\n\nSTEP 2: ACTIVATE THINKING MODE\n\n✦ Turn on \"Extended Thinking\" (before you prompt)\n✦ Let it reason through complex questions \n✦ Stop forcing instant (mediocre) answers\n✦ See the before/after difference: https://lnkd.in/exfaYnBQ\n\nSTEP 3: TURN ON SEARCH\n✦ Activate web search tool\n✦ Prevent hallucinations with real sources\n✦ Get current information beyond training data\n\n______________________________\n\n– WHY MOST PROMPTS FAIL –\n\nWithout setup: \nAI introduces itself every time. \nAI forgets your context. \nAI gives generic answers.\n\nWith setup: \nAI remembers who you are. \nAI follows your exact standards. \nAI delivers quality from prompt # 1.\n\n♻️ Repost this to help others set up AI properly.\nI share (much) more for free at how-to-ai.guide."}, {"n": 143, "client_id": "ivan", "post_ref": "7436722031657676802", "author_name": "Pascal Bornet", "published": "2026-03-09", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_ai-technology-semiconductors-activity-7436722031657676802-sjnv", "post_text": "This diagram might be the most honest picture of the modern tech stack.\n\nLook closely.\n\n↳ Unpaid open-source developers holding everything together\n↳ AWS + Cloudflare doing most of the heavy lifting\n↳ AI layered on top\n↳ Microsoft… vibing aggressively somewhere in the middle\n\nIt’s funny.\n\nUntil you reach the bottom.\n\nASML.\n\nOne Dutch company.\nOne class of machines.\nOne supply chain.\n\n→ The foundation of modern computing.\n\nWithout ASML’s lithography machines, there are no advanced chips.\n\nNo chips means:\n\nNVIDIA slows.\nAI training stalls.\nCloud capacity shrinks.\nEntire digital industries pause.\n\nWe talk a lot about software, models, and platforms.\n\nBut the global economy still rests on a few extremely fragile hardware layers.\n\nSo here’s the question I often think about:\n\nWhich invisible technology dependency do you think the world is underestimating the most right now?\n\n#AI #Technology #Semiconductors #Innovation #FutureOfTechnology"}, {"n": 144, "client_id": "ivan", "post_ref": "7412372343341162496", "author_name": "Pascal Bornet", "published": "2026-01-01", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_ai-innovation-technology-activity-7412372343341162496-QTiz", "post_text": "China just turned the night sky into a masterpiece of precision and intelligence. 🌌\n\nWhat struck me most about this is how seamlessly innovation turns into art.\n\nA drone show in Chongqing just broke the Guinness World Record with 11,787 synchronized drones, creating breathtaking 3D animations that looked closer to CGI than real life.\n\nNo human pilots.\nNo delays.\nNo crashes.\nEvery movement guided by AI and GPS, choreographed with perfect timing.\n\nTo me, this is far more than a light show.\nIt’s a glimpse into how technology, creativity, and coordination can merge to shape a new era of expression and innovation.\n\nWhen intelligence takes flight, it doesn’t just illuminate the sky — it redefines what’s possible.\n\nCould this be the moment where technology begins to turn the world itself into its stage?\n\n#AI #Innovation #Technology #Drones #Automation #Creativity #China #Engineering #FutureOfWork #DigitalArt\n\nCredits: longliveai"}, {"n": 145, "client_id": "risedtc", "post_ref": "7487843745808211968", "author_name": "Kendall Dickieson", "published": "2026-07-28", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/kendalldickieson_let-me-talk-to-my-team-the-team-me-activity-7487843745808211968-QFoN", "post_text": "\"let me talk to my team”\n\nthe team:\n- me\n- my Stream ring (Sandbar)\n- 3 shots of espresso \n- macBook pro + studio display"}, {"n": 146, "client_id": "arch", "post_ref": "7464923529893990400", "author_name": "Felix Braberg", "published": "2026-05-26", "post_type": "article", "image_count": 0, "source_url": "https://www.linkedin.com/posts/felix-braberg-7a732b51_dream-games-just-broke-its-own-biggest-rule-activity-7464923529893990400-5psx", "post_text": "Dream Games just broke its own biggest rule\n\nThey’ve added interstitial ads to Royal Match\n\nRoyal Match is THE game that built its multi-billion dollar brand on “no in-game ads.”\n\nWhat changed?\n\nToday, the best game doesn't win. The best distribution does.\n\nRoyal Kingdom showed what happens when you add ads properly:\n💎 +20% revenue uplift in two months\n💎 ~$185k/day in ad revenue\n💎 500k+ downloads/day enabled via Applovin Blended ROAS campaigns\n💎 Daily IAPs in Brazil increased by 41% (from $12k/day to 17k/day)\n\nNow Royal Match is next:\n♦️ 20 million DAU \n♦️ Potential daily ad revenue for Dream Games $400k-500k/day\n♦️ Full shift toward hybrid monetization, enabling Blended ROAS UA\n\nFull breakdown in the post 👇"}, {"n": 147, "client_id": "risedtc", "post_ref": "7490066651221012480", "author_name": "Antonioventre", "published": "2026-08-03", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/antonioventre_most-clothing-brands-are-stuck-at-15x-roa   var FIELD_IDS = FIELDS.map(function(f){ return f.id; });

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function clientLabel(c){
    if (c === 'ivan') return 'Ivan';
    if (c === 'risedtc') return 'RISE';
    if (c === 'arch') return 'ARCH';
    return esc(c);
  }
  function postKey(p){ return p.client_id + ':' + p.post_ref; }

  // ---------------------------------------------------------------- local state
  var labels = {};   // key -> { field: value }
  var queue = [];     // [{client_id, post_ref, field, value, page_version, ts}]
  var fieldStatus = {}; // key+'|'+field -> 'ok'|'pending'|'retry'
  var currentIndex = 0;

  function loadLocal(){
    try { labels = JSON.parse(localStorage.getItem(LS_LABELS) || '{}'); } catch(e){ labels = {}; }
    try { queue = JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch(e){ queue = []; }
    try { currentIndex = parseInt(localStorage.getItem(LS_INDEX) || '0', 10) || 0; } catch(e){ currentIndex = 0; }
  }
  function persistLabels(){ localStorage.setItem(LS_LABELS, JSON.stringify(labels)); }
  function persistQueue(){ localStorage.setItem(LS_QUEUE, JSON.stringify(queue)); }
  function persistIndex(){ localStorage.setItem(LS_INDEX, String(currentIndex)); }

  function labelCount(key){
    var rec = labels[key] || {};
    var n = 0;
    for (var i=0;i<FIELD_IDS.length;i++) if (rec[FIELD_IDS[i]]) n++;
    return n;
  }
  function isFullyLabelled(key){ return labelCount(key) === FIELD_IDS.length; }
  function firstUnlabelledIndex(){
    for (var i=0;i<POSTS.length;i++){
      if (!isFullyLabelled(postKey(POSTS[i]))) return i;
    }
    return POSTS.length;
  }
  function totalFullyLabelled(){
    var n = 0;
    for (var i=0;i<POSTS.length;i++) if (isFullyLabelled(postKey(POSTS[i]))) n++;
    return n;
  }

  // ---------------------------------------------------------------- network
  function rpc(name, body){
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': ANON_KEY,
        'Authorization':'Bearer ' + ANON_KEY
      },
      body: JSON.stringify(body)
    }).then(function(r){
      if (!r.ok) throw new Error('rpc ' + name + ' failed: ' + r.status);
      return r.json();
    });
  }

  function saveOne(item){
    return rpc('outlier_gold_label_save', {
      p_token: PAGE_TOKEN,
      p_client_id: item.client_id,
      p_post_ref: item.post_ref,
      p_field: item.field,
      p_value: item.value,
      p_page_version: item.page_version
    }).then(function(){ return true; }).catch(function(){ return false; });
  }

  function queueKeyOf(item){ return item.client_id + ':' + item.post_ref + ':' + item.field; }
  function enqueue(item){
    var qk = queueKeyOf(item);
    queue = queue.filter(function(q){ return queueKeyOf(q) !== qk; });
    queue.push(item);
    persistQueue();
  }
  function dequeue(item){
    var qk = queueKeyOf(item);
    queue = queue.filter(function(q){ return queueKeyOf(q) !== qk; });
    persistQueue();
  }

  var flushing = false;
  function flushQueue(){
    if (flushing || queue.length === 0) return;
    flushing = true;
    var items = queue.slice();
    var i = 0;
    function next(){
      if (i >= items.length){ flushing = false; render(); return; }
      var item = items[i++];
      saveOne(item).then(function(ok){
        if (ok){
          dequeue(item);
          fieldStatus[item.client_id+':'+item.post_ref+'|'+item.field] = 'ok';
        }
        next();
      });
    }
    next();
  }

  function saveField(post, field, value){
    var key = postKey(post);
    labels[key] = labels[key] || {};
    labels[key][field] = value;
    persistLabels();
    fieldStatus[key+'|'+field] = 'pending';
    render();

    var item = { client_id: post.client_id, post_ref: post.post_ref, field: field, value: value,
                 page_version: PAGE_VERSION, ts: Date.now() };
    saveOne(item).then(function(ok){
      if (ok){
        fieldStatus[key+'|'+field] = 'ok';
        dequeue(item);
      } else {
        fieldStatus[key+'|'+field] = 'retry';
        enqueue(item);
      }
      render();
    });
  }

  function fetchProgress(){
    return rpc('outlier_gold_progress', { p_token: PAGE_TOKEN }).then(function(rows){
      if (!Array.isArray(rows)) return;
      rows.forEach(function(row){
        var key = row.client_id + ':' + row.post_ref;
        labels[key] = labels[key] || {};
        labels[key][row.field] = row.value;
        fieldStatus[key+'|'+row.field] = 'ok';
      });
      persistLabels();
    }).catch(function(){ /* offline: local mirror stands */ });
  }

  // ---------------------------------------------------------------- render
  var appEl = document.getElementById('app');

  function renderDone(){
    var n = totalFullyLabelled();
    appEl.innerHTML =
      '<div class="done-screen">' +
        '<h1>All done</h1>' +
        '<div class="big">' + n + ' / ' + POSTS.length + '</div>' +
        '<p>posts fully labelled. Thank you — you can close this page.</p>' +
      '</div>';
  }

  function renderPost(){
    var post = POSTS[currentIndex];
    var key = postKey(post);
    var rec = labels[key] || {};
    var count = labelCount(key);
    var pct = Math.round((currentIndex) / POSTS.length * 100);
    var hasRetry = queue.length > 0;

    var html = '';
    html += '<div class="topbar">' +
      '<div class="progress-row"><strong>' + (currentIndex+1) + ' / ' + POSTS.length + '</strong>' +
      '<span>' + count + '/' + FIELD_IDS.length + ' fields</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';

    html += '<div class="meta-row">' +
      '<span class="chip">' + clientLabel(post.client_id) + '</span>' +
      '<span class="meta-text"><b>' + esc(post.author_name) + '</b> · ' + esc(post.published) + ' · ' + esc(post.post_type) +
      (post.image_count ? ' · ' + esc(post.image_count) + ' img' : '') + '</span>' +
      '</div>';

    html += '<div class="post-card">' +
      '<div class="post-text">' + nl2br(post.post_text) + '</div>' +
      (post.source_url ? '<a class="post-link" href="' + esc(post.source_url) + '" target="_blank" rel="noopener noreferrer">open on LinkedIn →</a>' : '') +
      '</div>';

    html += '<div class="fields">';
    FIELDS.forEach(function(f){
      var chosen = rec[f.id];
      var status = fieldStatus[key+'|'+f.id];
      var statusHtml = '';
      if (status === 'ok') statusHtml = '<span class="field-status ok">✓</span>';
      else if (status === 'pending') statusHtml = '<span class="field-status pending">…</span>';
      else if (status === 'retry') statusHtml = '<span class="field-status retry" title="will retry">↻</span>';

      html += '<div class="field">' +
        '<div class="field-head">' +
          '<span class="field-title">' + esc(f.title) + '</span>' +
          statusHtml +
          '<details class="help"><summary>?</summary><div class="help-panel">' +
            f.values.map(function(v){ return '<div><b>' + esc(v.label) + '</b> — ' + esc(v.def) + '</div>'; }).join('') +
          '</div></details>' +
        '</div>' +
        '<div class="pills">' +
        f.values.map(function(v){
          var sel = chosen === v.v ? ' selected' : '';
          return '<button type="button" class="pill' + sel + '" data-field="' + esc(f.id) + '" data-value="' + esc(v.v) + '">' + esc(v.label) + '</button>';
        }).join('') +
        '</div>' +
      '</div>';
    });
    html += '</div>';

    html += '<div class="navbar"><div class="nav-inner">' +
      '<button type="button" class="nav-btn secondary" id="btn-back"' + (currentIndex===0?' disabled':'') + '>Back</button>' +
      '<button type="button" class="nav-btn secondary" id="btn-skip">Skip</button>' +
      '<button type="button" class="nav-btn primary" id="btn-next"' + (count<FIELD_IDS.length?' disabled':'') + '>Next</button>' +
      '</div>' +
      (hasRetry ? '<div class="queue-note">' + queue.length + ' save(s) queued, retrying…</div>' : '') +
      '</div>';

    appEl.innerHTML = html;

    appEl.querySelectorAll('.pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        saveField(post, btn.getAttribute('data-field'), btn.getAttribute('data-value'));
      });
    });
    var backBtn = document.getElementById('btn-back');
    if (backBtn) backBtn.addEventListener('click', function(){
      if (currentIndex > 0){ changePost(currentIndex - 1); }
    });
    document.getElementById('btn-skip').addEventListener('click', function(){
      goNext();
    });
    var nextBtn = document.getElementById('btn-next');
    nextBtn.addEventListener('click', function(){
      if (!nextBtn.disabled) goNext();
    });
  }

  // Moving to a different post must land the user at the top of the new post (post text, chip, date --
  // not wherever the previous post happened to be scrolled to). render() alone only swaps innerHTML and
  // preserves scroll position, so every post-change path funnels through this.
  function changePost(newIndex){
    currentIndex = newIndex;
    persistIndex();
    window.scrollTo(0, 0);
    render();
  }

  function goNext(){
    changePost(currentIndex + 1);
  }

  function render(){
    if (currentIndex >= POSTS.length){ renderDone(); return; }
    renderPost();
  }

  // ---------------------------------------------------------------- keyboard (desktop, optional)
  document.addEventListener('keydown', function(e){
    if (currentIndex >= POSTS.length) return;
    if (e.key === 'ArrowRight') { goNext(); }
    else if (e.key === 'ArrowLeft' && currentIndex > 0) { changePost(currentIndex - 1); }
  });

  // ---------------------------------------------------------------- swipe (mobile, optional)
  (function(){
    var startX = null, startY = null;
    appEl.addEventListener('touchstart', function(e){
      if (!e.touches || !e.touches[0]) return;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    }, {passive:true});
    appEl.addEventListener('touchend', function(e){
      if (startX === null) return;
      var t = (e.changedTouches && e.changedTouches[0]) || null;
      if (!t) { startX = null; return; }
      var dx = t.clientX - startX, dy = t.clientY - startY;
      startX = null;
      if (Math.abs(dx) > 80 && Math.abs(dy) < 60 && currentIndex < POSTS.length){
        if (dx < 0) goNext();
        else if (currentIndex > 0) { changePost(currentIndex - 1); }
      }
    }, {passive:true});
  })();

  window.addEventListener('online', flushQueue);

  // ---------------------------------------------------------------- boot
  loadLocal();
  render(); // paint immediately from the local mirror (works offline), then reconcile with server
  fetchProgress().then(function(){
    currentIndex = firstUnlabelledIndex(); // resume rule: jump to the first post not fully labelled
    persistIndex();
    window.scrollTo(0, 0);
    render();
    flushQueue();
  });
})();
</script>
</body>
</html>
