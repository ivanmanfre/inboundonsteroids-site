ad. And the way they've written Max's power this time is weird, it implies she's leaving behind full abandoned timelines every time she jumps to fix something, which doesn't line up with how her power worked originally and kind of undoes the whole point of the first game, which was learning to live with your choices instead of escaping them.\n\nProduction wise it's solid. World feels more alive, writing is tighter, art direction is good. But the game also won't let you think for yourself, everything gets pointed out to you, every clue, every object you can interact with.\n\nI wanted this to feel like a real continuation of what made the first two games special. Instead it feels like a franchise kept going because there's still money in it, not because there was more to say."}, {"n": 52, "client_id": "ivan", "post_ref": "7496703435615006720", "author_name": "Matt Lakajev", "published": "2026-08-21", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/mattlakajev_linkedins-biggest-creators-run-pyramid-activity-7496703435615006720-slVw", "post_text": "LinkedIn’s biggest creators\n\nRun Pyramid Schemes\n\nMadoff would be proud. Here's how:\n\n1) A “Big Creator” Comments. \n2) LinkedIn boosts reach.\n3) Audience sees it. \n4) Assumes it must be good.\n5) LinkedIn pushes it further.\n\nLike a bunch of f*cking sheep.\n\nThen they sell \"How to get 10,000 followers\"\nWho then teach \"How to get 10,000 followers\"\nWho teach them \"How to get 10,000 followers\"\n\nAnd they ALL make $0\n\nThey message me crying\n\n\"Matt, how do I monetise my 300k follower account?\"\n\nYou f*cking don't\nYou don't have a business\nYou are literally selling a SCAM.\n\nYou write dumb quid pros quos on the internet copy pasting some trash \"infographic\" from X called \"The top 21 AI tools that get you rich\"\n\nAll you do is post bullsh*t information Porn.\n\nGoodluck to you"}, {"n": 53, "client_id": "ivan", "post_ref": "7463171465031569409", "author_name": "Craig Dewart", "published": "2026-05-21", "post_type": "post", "image_count": null, "source_url": "https://www.linkedin.com/posts/craig-dewart-6a6342122_i-came-across-tara-keeneys-account-a-few-activity-7463171465031569409-dVQA", "post_text": "I came across Tara Keeney's account a few weeks ago.\n\nShe's been inviting the world's biggest founders to go for a walk and recording the conversations. \n\nYou would think she's been doing this for years but nope, she's only 6 months in. \n\nHow many followers would you tell yourself you need to have the confidence to reach out to the founder of Netflix?\n\nHow many for Gary Vaynerchuk to pay attention to you?\n\nFrom the outside you might say Tara got lucky. That the algorithm found her.\n\nBut scroll through her content and you'll see she takes relentless action. One founder says she emailed her 27 times.\n\nThe founders I know who are invisible on LinkedIn aren't invisible because they're doing less interesting work than Tara. Or because they're less passionate about what they're building.\n\nThey're invisible because they don't document and they don't post.\n\nMaybe that's you.\n\nNext time you see someone like Tara in your feed, ask yourself what's actually holding you back.\n\nA lot can change in 6 months if you just start."}, {"n": 54, "client_id": "risedtc", "post_ref": "7477775426040524800", "author_name": "Sanocki", "published": "2026-06-30", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/sanocki_millard-mickey-drexler-got-the-call-the-activity-7477775426040524800-xg8C", "post_text": "Millard 'Mickey' Drexler got the call the night before he was fired. \n\nFrom Steve Jobs.\n\nNot a metaphor. Jobs was on Gap's board, and he phoned to warn Drexler he'd be out the next morning. The guy who got fired from his own company, then walked back in to run it, calling to deliver the same news in reverse.\n\nEighteen years building Gap. And two days after they fired him, they told him they'd made a mistake!\n\nDrexler didn't go back. He went and ran J.Crew, and built Madewell along the way.\n\nThat's why he's one of my favorite entrepreneurs. Not the wins--the batting average.\n\nHere's the actual record:\n\nThe wins\n → Ran Gap for ~20 years\n → Launched Old Navy (1994) after reading that Target was building a knockoff. Beat them to their own idea.\n → CEO of J. Crew (2003)\n → Launched Madewell (2006)\n → Now chairman of Alex Mill, which he calls \"the best job I've ever had\"\n\nThe losses\n → Fired from Gap after 18 years\n → J. Crew taken private (2010)\n → Uniqlo's parent walked away from buying J. Crew (2014)\n → Pushed out of J. Crew as sales slipped (2017)\n → Then watched Madewell's IPO get teed up and fall through\n\nThe guy got knocked down repeatedly and, like Captain America, said \"I can do this all day.\"\n\nThere's one line from his recent CommerceNext talk that resonates:\n\"Everything I do is for the customer.\"\n\nHe calls himself a micromanager and means it as a compliment. To him it's not control: it's the only way to keep bringing the customer into every decision. \n\nI've been preaching a version of this for 25 years. Know your best customers. Build everything around them. \n\nWhich brings me to my standard work from home outfit: the jumpsuit.\n\nI'm wearing an Alex Mill jumpsuit as I write this. It's my SOP — same uniform most days, one fewer decision to make. \n\nAlex Mill is Drexler's son's Alex Drexler's company. And Mickey is on the board. And it's an awesome company because it is built to serve it's customers. \n\nResilience isn't the headline. The headline is Drexler never changed what he was optimizing for. (He just kept getting fired by people who forgot, then went on to prove them wrong.)\n\nJumpsuit by Alex Mill. T-shirt by PostPilot. Face by Blue Steel."}, {"n": 55, "client_id": "risedtc", "post_ref": "7459905346828988416", "author_name": "Tobyjwaller", "published": "2026-05-12", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/tobyjwaller_scaling-a-brand-is-tough-the-number-one-activity-7459905346828988416-7FIh", "post_text": "Scaling a brand is tough.\nThe number one bottleneck? Creative.\nHere is your answer 👇🏼\n\nToo many brands rely on the same creatives for months, wasting ad spend on what isn’t working.\n\nThe key to scaling faster isn’t just about 'testing more ads\n\nIt's about testing smarter, faster, and more effectively.\n\nThat’s why we developed an exact framework for creative testing that has helped us scale some of the top brands.\n\nHere’s what this framework ensures:\n\n✔ Smarter testing that reduces wasted spend\n✔ Faster feedback loops so we can optimise quickly\n✔ Efficient creative refresh to avoid ad fatigue\n\nWant to learn how we do it?\n\nDrop \"Scale\" in the comments, and I’ll send you the full breakdown!"}, {"n": 56, "client_id": "ivan", "post_ref": "7431941233658314752", "author_name": "Pascal Bornet", "published": "2026-02-24", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_ai-artificialintelligence-robotics-activity-7431941233658314752-5N9J", "post_text": "The future of robotics might not start with the brain.\nIt may start with the foot.\n\nFor millions of years, evolution perfected how we walk. Shock absorption. Balance. Energy return. Adaptation to uneven ground.\n\nNow engineers are catching up.\n\nThe SoftFoot Pro, developed by researchers at the Istituto Italiano di Tecnologia and the University of Pisa, mimics the biomechanics of a real human foot without motors. Just intelligent design.\n\nWhat fascinates me is this:\n\nNo flashy AI software.\nNo complex control system.\nJust engineering inspired directly by human anatomy.\n\nIt stores and releases energy like the plantar fascia.\nIt flexes on slopes where rigid prosthetics fail.\nIt is lightweight, waterproof, and strong enough to support real world use.\n\nThis is AI in another form.\nNot code. Not data.\nIntelligence embedded in structure.\n\nI often say the future of AI is not only about making machines think.\nIt is about helping them move, adapt, and interact with the physical world more like we do.\n\nIf technology can replicate how we walk, what human capability should it focus on next?\n\n#AI #ArtificialIntelligence #Robotics #Innovation #HumanCenteredAI #FutureOfWork"}, {"n": 57, "client_id": "risedtc", "post_ref": "7479874343578001408", "author_name": "Hmolyneux", "published": "2026-07-06", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/hmolyneux_how-do-i-know-the-investment-in-cro-will-activity-7479874343578001408-SiTZ", "post_text": "\"How do I know the investment in CRO will pay off?\"\n\nThis is one of the most common questions we get from DTC founders.\n\nAnd the answer isn't what most expect.\n\nYour traffic is expensive. Your conversion rate is free money.\n\nWe always tell prospects, before you spend another dollar on ads, you need to prove what moves the needle on your current visitors.\n\nThat's the difference between scaling smart and scaling broke.\n\nWe’ve tracked every client's ROI for the past 2 years.\n\nAverage result: 4-8x return within 90 days.\n\nThe brands that hesitate are literally bleeding money on traffic while missing the obvious wins sitting in their analytics.\n\nMost DTC Shopify brands spend 80% of their budget getting people to their site.\n\nThen they guess what converts them.\n\nWe measure it.\n\nEvery test gets tracked to revenue impact. Every change gets validated with data. Every dollar spent gets measured against lift.\n\nWe've run 140+ experiments for one $10M monthly revenue client.\nMultiple six-figure annual lifts from single tests.\nOne checkout optimization delivered $156K monthly.\nProduct page review placement added $53.7K monthly.\n\nAll without spending a penny more on ads.\n\nThe \"expensive\" part isn't the investment. \n\nIt's the opportunity cost of not testing.\n\nPS - We help DTC Shopify brands add 5-6 figures in MRR within 90 days through CRO and A/B testing. No extra ad spend.\n\nWant to see what that looks like for your store? We'll map out your highest-impact opportunities on a free strategy call.\n\nInterested? Apply here: https://lnkd.in/dnm_QbnD"}, {"n": 58, "client_id": "ivan", "post_ref": "7402678153107894273", "author_name": "Pascal Bornet", "published": "2025-12-05", "post_type": "article", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_agenticai-aiagents-ai-activity-7402678153107894273-syVf", "post_text": "🚀 Proud to share the latest issue of AGENTIC INTELLIGENCE - The world's first newsletter dedicated to AI Agents (and made by AI Agents!)\n\nReceive this newsletter by email: https://lnkd.in/ex6HTYPv\n\nThis Week's Agentic Breakthroughs:\n1️⃣ Amazon Releases New Frontier Agents at Reinvent 2025\n2️⃣ A small Agent That Clicks around the Web for You\n3️⃣ Claude’s New Two-Agent System Solves the Memory Gap\n4️⃣ Who Benefits From AI? A New Report from the United Nations\n5️⃣ ‘Aristotle’ AI cracks 30-year math problem\n\nWhich of these agent breakthroughs excites or concerns you the most? Share your thoughts below 👇\n\n310,000+ pioneers have already subscribed to this newsletter. Why? Because very soon, we won't say, \"There's an app for that.\" We'll say, \"There's an agent for that.\"\n\n#agenticAI #aiagents #ai #artificialintelligence"}, {"n": 59, "client_id": "risedtc", "post_ref": "7506839877611638784", "author_name": "Kodynordquist", "published": "2026-09-18", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/kodynordquist_i-almost-fired-our-ai-employee-in-week-one-activity-7506839877611638784-Jbst", "post_text": "I almost fired our AI employee in week one. Now he saves our team 5 hours every week.\n\nI run a growth agency for DTC brands, and we started by giving Viktor one workflow our team already handled.\n\nAt first, I wasn’t convinced. His first outputs needed more review than expected, so I questioned whether he was actually saving us time.\n\nThe shift came when we stopped asking questions and started delegating defined pieces of real work with the right context and process.\n\nOur first workflow was weekly client performance reporting. Viktor pulled the numbers, organized key changes, and prepared the report for review.\n\nOnce that worked, the delegation spread. Our media buyer gave him campaign performance checks, our client success lead delegated client update drafts and follow-up tracking, and our head of ops handed him weekly tracker updates and reporting reconciliation.\n\nWe weren’t replacing anyone. We were moving recurring pieces of work to an AI employee.\n\nThe result: 5 hours back for our team every week.\n\nViktor works inside Slack and Microsoft Teams, connects to 3,200+ tools, and executes work rather than simply telling us what to do. Our team still reviews and approves important actions.\n\nThat’s what changed the trust equation: we stopped asking AI for answers and started delegating real work.\n\nHire viktor.com for your team. $100 in credits included, no card. Full link in first comment.\n\nIn partnership with Viktor.\n\n#sponsored #viktorpartner"}, {"n": 60, "client_id": "risedtc", "post_ref": "7476590181546954754", "author_name": "Oli Mabane", "published": "2026-06-27", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/oli-mabane_something-i-keep-coming-back-to-the-most-activity-7476590181546954754-bFK7", "post_text": "Something I keep coming back to:\n\nThe most celebrated ad man in history didn't bill himself as a creative director when he built his agency.\n\nHe billed himself as the research director.\n\nNot the creative. Not the strategist. Not the founder.\n\nThe researcher.\n\nBecause he understood that the quality of research determines the quality of everything that follows.\n\nNot the talent in the room. Not the budget. Not the brief.\n\nI think about this every time I'm tempted to skip the review mining and just brief the team.\n\nThe creative doesn't make the ad.\n\nThe research makes the creative."}, {"n": 61, "client_id": "ivan", "post_ref": "7397906692895580160", "author_name": "Pascal Bornet", "published": "2025-11-22", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_leadership-emotionalintelligence-organizationalpsychology-activity-7397906692895580160-7VDl", "post_text": "🌊 The Calm That Destroys: Why Success Numbs Leaders\n\nMost leadership failures don’t look like chaos.\nThey look calm.\n\nThat realization changed how I see teams — because the most dangerous dysfunctions aren’t loud.\nThey’re quiet.\nThey begin when leaders stop feeling the pain that built their success.\n\nThis cartoon captures it perfectly:\nLeaders on a sinking boat, shouting “Keep rowing!” while water pours in.\nIt’s funny at first — until you realize how often it happens in real life.\n\nTeams are drowning in warning signs, and leadership keeps asking for more performance.\n\nI’ve seen it up close — and I’ve done it myself.\n\nConvincing myself things were fine because the numbers said so.\n\nThat’s the silent drift of leadership: the higher you rise, the softer the feedback gets.\n\nBy the time real problems reach you, they’ve been polished into dashboards and KPIs.\n → “Burnout” becomes resource allocation\n → “Frustration” becomes attrition risk\n → “Doubt” becomes low engagement\n\nAnd slowly, empathy gets replaced by efficiency.\n\nYou start managing signals instead of people.\n\nBut systems don’t feel pressure. People do.\n\nAnd when people stop believing their discomfort matters, they stop speaking up.\n\nThat’s when organizations begin to sink — quietly, predictably, and avoidably.\n\nHow I Try to Stay Connected\n✅ Create unfiltered listening loops — find people who’ll tell you what others won’t.\n✅ Translate metrics into meaning — ask, “What’s behind this number?” before reacting.\n✅ Name the invisible — surface emotions no one’s tracking.\n✅ Reward truth-telling, not compliance — make honesty safer than silence.\n\nBecause leadership isn’t about fixing faster — it’s about feeling sooner.\n\nThe moment you stop feeling the current, you lose the ability to steer.\n\nThat’s what this cartoon really exposes:\n\nNot incompetence — but disconnection.\n\nA quiet culture of “it’s fine” that numbs awareness until it’s too late.\n\nSo here’s what I keep asking myself:\nWhen data tells us everything, how do we still feel what matters?\n\n#Leadership #EmotionalIntelligence #OrganizationalPsychology #PeopleFirst #Management #FutureOfWork"}, {"n": 62, "client_id": "risedtc", "post_ref": "7427026064159449088", "author_name": "Ben Sharf", "published": "2026-02-10", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/ben-sharf_15000-linkedin-followers-wild-feels-like-activity-7427026064159449088-v44P", "post_text": "15,000 LinkedIn followers. Wild.\n\nFeels like the right moment to re-introduce myself.\n\nFor those who recently joined — here’s the quick story on who I am:\n→ I’m 29 (turning 30 on Valentine’s Day), born in Buffalo, NY. Left home at 15 to attend The Loomis Chaffee School and chase my dream of playing Division 1 hockey.\n→ Dual citizen 🇺🇸🇵🇱. American mom, Israeli dad, and Polish grandparents who survived the war. Perspective is something I don’t take lightly.\n→ Quit my corporate job 12 hours before my first day to bet on myself and join an early COVID testing startup that scaled to $50M in just five months.\n→ Spent a year at Gopuff before co-founding Platter with Kieran Derfus and Michael Keenehan.\n\nToday, we’ve built 200+ Shopify storefronts generating over $1B in aggregate GMV for brands like Neuro, Gainful, Every Man Jack, G FUEL, and more.\n\n\nContent + Investing\n→ Angel investor in 30+ startups. Including Haven, OuterSignal, and more. Nothing energizes me more than backing exceptional founders early.\n→ Host of Turning Pro Podcast. 90+ in-person conversations with builders, operators, and creators. My latest conversation with Roman Raisuddin Khan, who built Peak21 into a $200m brand portfolio, is live now! \n→ I have a full-time videographer and release weekly YouTube videos on my personal channel documenting my journey and exploring my curiosities.\n\nFun facts:\n→ Lifelong athlete. Played D1 hockey at Colgate University, ran the NYC marathon, and completed 75 Hard twice. Most recently, I stepped into the boxing ring for the first time as part of Haymakers for Hope and now hold a 1-0 record (1 KO).\n→ I sat in complete silence for 10 days during a Vipassana meditation.\n→ I host weekly founder poker nights with my roommate Ben Buaron (Windmill Growth). If you’re a founder in NYC and want to join a future game, shoot me a DM.\n→ I treat sleep like a professional sport. My fiance says she sleeps next to a robot - she’s not wrong.\n\n\nHow I can help you:\nI’ve been told my superpower is being a super-connector. If someone in my network can help you solve a problem, make a hire, close a deal, or think bigger - I will make that connection. No hesitation.\n\nHow you can help me:\nI love meeting ambitious founders, especially folks building consumer brands.\n\n\nAppreciate everyone who’s following along - we’re just getting started 🚀"}, {"n": 63, "client_id": "ivan", "post_ref": "7448353768460439552", "author_name": "Matt Gray", "published": "2026-04-10", "post_type": "carousel", "image_count": null, "source_url": "https://www.linkedin.com/posts/mattgray1_how-to-build-a-personal-brand-activity-7448353768460439552-4AMe", "post_text": "Here’s how to build a personal brand in just 7 days.\n\nI spent 3 years figuring this out the hard way.\n\nSteal my system so you don’t have to:\n\nDay 1: Define Your Niche\n\nAsk yourself: what do you want to be known for?\n\nUse that to define 7 core pillars. \n\nThese are topics you can talk about forever, or that people already come to you for advice on.\n\nDay 2: Build Your Brand Compass\n\nWrite down your non-negotiable values. The filters every decision runs through.\n\nWhen I defined mine I stopped creating for everyone, and started creating for the right people.\n\nDay 3: Know Your Audience\n\nThree questions:\n\nWhat problems does my audience face? \nWhere do they spend their time online? \nWhat would make their life easier?\n\nDon't guess – survey them!\n\nSend a voice note or an email.\n\nThe answers will make people feel like you read their minds. \n\nDay 4: Create Your Brand Identity Map\n\nYour brand voice is how people recognize you before they even see your name.\n\nTake the time to map it out properly and it will pay off in droves. \n\n- What 3 words describe how you communicate? \n- Choose your core colors and pick your fonts.\n- Write your brand commandments. The rules you'll never break.\n\nWhen I built my identity map, people started recognizing my posts without even seeing my name. \n\nDay 5: Write Your Founder Note\n\nThis is all about building trust. \n\nWhy do I do what I do? \nWhat problem am I solving? \nWhat transformation do I offer?\n\nThis becomes your origin story.\n\nIt’s also the thing that makes people root for you.\n\nThink about it: how many companies do you follow vs. human thought leaders? \n\nPeople buy from other people they know, like, and trust. \n\nDay 6: Build Your Content GPS\n\nContent without a system is just throwing stuff at the wall to see what sticks.\n\nDraw a venn diagram. The center should show the intersection between:\n\n- what you know\n- what your audience needs\n- what you love talking about \n\nTake each pillar and write 10 questions your audience is already asking. \n\nEvery question is a post.\n\nNow you’ve got 30 content ideas around this topic.\n\nThat's your content GPS. \n\nYou’ll never have to stare at a blank page again.\n\nDay 7: Assemble Your Team and Tools\n\nYour brand needs to run like a machine (not depend on your daily energy)\n\nBut you only need 3 key players:\n\n1. Social Media Manager → distribution, engagement, reporting \n2. Video Editor → long-form editing, shorts, thumbnails \n3. Executive Assistant → calendar, admin, keeping you out of the weeds\n\n3 people runn"}, {"n": 64, "client_id": "arch", "post_ref": "7490339502096334848", "author_name": "Marion Balinoff", "published": "2026-08-04", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/marion-balinoff_somewhere-in-a-growth-org-chart-theres-activity-7490339502096334848-aTxc", "post_text": "Somewhere in a growth org chart, there's a line separating \"influencer marketing\" from \"creative\" and another line separating both of those from \"performance marketing.\" Most companies draw those lines without ever asking whether the work on either side of them can actually survive being split apart.\n\nOne of the teams I work with runs it the opposite way, and the results say something about why the silo exists in the first place.\n\nEvery piece of creator content they produce gets treated as raw material for the entire growth engine, not as a single deliverable that ends the moment a campaign wraps.\n\nOne creator records a video, and that same video gets recut with a different ending, a different hook, sometimes localized into a completely separate regional dialect, and tested as several distinct pieces of creative.\n\nOne recording becomes five or six ad variations. For products with tight margins, that's the difference between paying a creator once and paying a creative team to build the same volume of assets from scratch.\n\nThe localization detail is worth sitting with. Dubbing the same creator content into region-specific Spanish, not just Spanish in general, nearly doubled engagement versus a generic version. That's not an influencer marketing insight. That's a growth marketing insight that happened to originate from a creator's video, which is exactly the point. If creator content lives in its own department, nobody on the paid side ever finds out that regional dialect matters this much, because the finding never leaves the silo it was born in.\n\nThen there's the part that would confuse a purely organic-vs-paid mindset entirely: letting a creator's post live organically first, then putting real media spend behind the exact same post once it proves itself. It isn't influencer content anymore at that point, and it isn't a traditional ad either. It's both, running through the same growth funnel, measured the same way everything else is measured. For some of their products, this kind of creator-originated content accounts for roughly half of total purchases. Half! That's not a supporting channel. That's the channel!\n\nNone of this works if creator marketing reports up through a different chain than performance marketing does, with different KPIs, different planning cycles. The tactics I just described aren't influencer marketing tactics or growth marketing tactics. They only exist because somebody stopped treating them as two different jobs."}, {"n": 65, "client_id": "ivan", "post_ref": "7450510399906426880", "author_name": "Justin Welsh", "published": "2026-04-16", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/justinwelsh_success-in-business-isnt-about-maximizing-activity-7450510399906426880-E7uK", "post_text": "Success in business isn't about maximizing the amount of money you make.\n\nIt's about architecting the perfect lifestyle for you and your family.\n\nThe most successful people I know aren't scaling to $10M or $100M in revenue.\n\nThey're simply working without a boss, sitting in almost zero meetings, dealing with far fewer headaches, and still making a little more than they used to.\n\nNow that, my friends, is a great life.\n\nBecause what's the point of building a huge, powerful, scalable monstrosity if it means that you spend less time with your family?\n\nOr friends...\nOr time on hobbies...\nOr with folks in your community...\n\nThere isn't a point.\n\nNobody sits on their deathbed and wishes their business scorecard was higher and their family and friends scorecard was lower.\n\nOnce I realized this, I started writing a short essay every Saturday on work, money,\nand building a life you *actually* choose.\n\nNot someone else's idea of a great life.\n\nIf that sounds refreshing, come join 180,000+ people who read it every week.\n\nThis week's essay is all about \"Synthetic purpose.\"\n\nHow we manufacture problems when they don't exist.\n\n(and what to do about it)\n\nJoin for free to get it: https://buff.ly/9ABc8Yo"}, {"n": 66, "client_id": "ivan", "post_ref": "7471199706115862529", "author_name": "Braden Ricchini", "published": "2026-06-12", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/braden-ricchini-1b5b64324_a-few-years-ago-i-began-religiously-studying-activity-7471199706115862529-bL2K", "post_text": "A few years ago, I began religiously studying Alex Hormozi's YouTube strategy.\n\nIn that short time, I went from: \n\n• 0 clients → 6 figure agency\n• 0 views → 4,000,000+ organic impressions\n• 0 pipeline → HUNDREDS of inbound calls booked\n\nIt’s safe to say, this guy’s content strategy is 2nd to none. \n\nAnd after rolling the patterns into our workflow for clients + myself…\n\nIt completely transformed my agency AND the results we’ve been able to achieve for our content clients. \n\nBecause nowadays...\n\nEveryone's figured out that YouTube books inbound calls.\n\nYet, it's becoming harder and harder to actually retain the right viewer with long form media on there.\n\nIf you're posting B2B videos and 80% of your viewers click off in the first 30 seconds, you already know what I'm talking about.\n\n→ Your ICP used to watch the full intro through. Now they click off before you even say your name.\n→ Your hook sounds like the same \"Hey guys, today we're going to break down\" as every other channel in your niche\n→ You're banking on a 30-second warm-up and wondering why nobody sticks around for the meat\n→ The viewers who DO stay are the wrong fit because your intro never filtered for your actual buyer\n\nHormozi's youtube framework takes all of these factors … and reverse engineers all of them into each video for maximum retention & viewership. \n\n(which is WHY he’s been so successful on there)\n\nThat said...\n\nI just put his ENTIRE system into a free Notion kit.\n\nInside:\n\n1. The PPP framework (Proof, Promise, Plan) broken down across 100 videos\n2. 6 hook types with real Hormozi examples and fill-in-the-blank templates\n3. The credential stacking playbook (and how to adapt proof to your audience)\n4. 5 plug-and-play intro templates for B2B founders\n5. The 100-video classification table (every Hormozi intro tagged by hook type and PPP order)\n\nComment \"MOZI\" and I'll DM it to you.\n\n(Connect with me if we're not connected so I can actually send it.)\n\nPS: Everyone's on B2B YouTube now. The question is whether or not you actually do it right. This guide is how you make sure it turns an ROI for you."}, {"n": 67, "client_id": "risedtc", "post_ref": "7459706070056198144", "author_name": "Benzettler", "published": "2026-05-11", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/benzettler_if-new-york-yankees-legend-mariano-rivera-activity-7459706070056198144-kYZP", "post_text": "If New York Yankees legend Mariano Rivera can go from making a glove out of cardboard as a kid to the greatest closer of all-time, you can accomplish anything.\n\nI used to run social media for Steiner Sports. When I stumbled upon this video on a hard drive years ago, I remember Brandon Steiner and I looking at each other realizing we had a gem on our hands. \n\n3 million views (and counting) across all platforms, it's easy to see why. \n\nYou don't need much to be happy. You don't need much to get started.\n\nHumble beginnings for the only unanimous inductee in the history of the National Baseball Hall of Fame and Museum."}, {"n": 68, "client_id": "risedtc", "post_ref": "7433251209681088513", "author_name": "Christophermarrano", "published": "2026-02-27", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/christophermarrano_block-just-cut-4000-people-almost-half-activity-7433251209681088513-vqT3", "post_text": "Block just cut 4,000 people.\n\nAlmost half the company. Gone.\n\nGross profit? Up 24%.\n\nStock price? Up 24%.\n\nWall Street? Standing ovation.\n\nJack Dorsey didn’t blame a bad quarter.\n\nHe didn’t blame the economy.\n\nHe said the quiet part out loud:\n“A significantly smaller team, using the tools we’re building, can do more and do it better.”\n\nThen he said something every operator should screenshot:\n“Within the next year, I believe the majority of companies will reach the same conclusion.”\n\nThis is not a tech story.\n\nThis is an infrastructure story.\n\nBlock did not wake up yesterday and decide to use AI. They spent years building internal tools, training teams on new workflows, and restructuring how decisions get made.\n\nThe layoff was the outcome. The infrastructure was the work.\n\nAnd that is the part everyone skips.\n\nI talk to ecommerce founders every week who want to “use AI” but have no system underneath it.\nNo automated reporting.\n\nNo creative analysis pipeline.\n\nNo way to go from data to decision without five people in a Slack thread.\n\nThey hear about Block and think the answer is fewer people.\n\nThe real answer is better infrastructure.\n\nWe have spent the last year building exactly this across our Meta ad accounts. AI agents pulling performance data in real time. Creative analysis running automatically. Decisions happening in hours instead of days.\n\nOur team is small. Our output is not.\n\nAnd we are now helping other brands and agencies build the same thing.\n\nIf you are running a seven or eight figure brand and you know your team needs to operate differently but you do not know where to start, that is exactly what we help with.\n\nComment “INFRA” and I will walk you through what we have built and how it could work for your team."}, {"n": 69, "client_id": "arch", "post_ref": "7503003700928421889", "author_name": "Marion Balinoff", "published": "2026-09-08", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/marion-balinoff_a-year-ago-i-agreed-to-put-my-face-on-activity-7503003700928421889-fbsh", "post_text": "🎂 A year ago, I agreed to put my face on camera every week for a podcast. If you know me, you know how much I hate that.\n \nInfluence Unpacked just turned one. 15 episodes in. \n \nShahar David-Hazan at AppsFlyer believed there was a show here before I did. She pushed when I was still convincing myself it was worth doing.\n \nThe camera thing never really got easier. I still don't love watching myself back. What surprised me was how much there was to say. Influencer marketing for mobile games and subscription apps has almost nothing written down about it anywhere. No playbooks, no frameworks, just people figuring it out in real time and comparing notes when they get the chance. Every guest added something that didn't exist in writing before that conversation.\n \nI started this to sharpen my own thinking. A year in, I'm convinced this space is under-documented for the marketers trying to work in it, and I'd rather keep filling that than wait for someone else to.\n \nI've been pulling fifteen of those conversations into something bigger. Keep an eye out, I think it's going to be one of the more useful things I put out this year. 👀"}, {"n": 70, "client_id": "ivan", "post_ref": "7499003620105949184", "author_name": "Ben Hemingway", "published": "2026-08-28", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/benhemingwaya_i-told-this-prospect-i-was-running-late-activity-7499003620105949184-oGEk", "post_text": "I told this prospect I was running late (my dog shat all over the floor).\n\n1 hour later: client signed + payment received\n\nI gave up caring if people sign a while ago\n(I now sign more clients than ever).\n\nAs soon as you stop:\n\n- trying to convince\n- trying to be someone you're not\n- just trying to make MONEY\n\nSuddenly, you actually become likeable\nAnd all the things you want come as a result!"}, {"n": 71, "client_id": "risedtc", "post_ref": "7455242318003089408", "author_name": "Taylor Holiday A169B322", "published": "2026-04-29", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/taylor-holiday-a169b322_announcing-the-most-unexpected-partnership-activity-7455242318003089408-k6nj", "post_text": "Announcing the most unexpected partnership you could imagine...\n\nCommon Thread Collective x Northbeam are joining forces.\n\n6 years ago Austin Harrison approached me with email in the attached image. It was a deal for Northbeam to takeover Statlas and become the embedded software product inside of CTC. \n\nAt the time I didn't believe that attribution was the right path for us to pursue.\n\nProbably cost me tens of millions of dollars...\n\nNeedless to say Northbeam has gone on to become a staple in the eCommerce industry. Trusted by thousands of merchants to guide their media decision making.\n\nI have had very public issues with MTA products, including Northbeam, over the years and I still do...\n\nBUT I have also watched them evolve their product into so much more.\n\nThat movement has been in directions that I agree with and have shared vision around.\n\nThings like:\n\nAligning optimization with attribution by passing data back to meta.\n\nFirst party tracking of customer identity to support in identify resolution for your acquisition\n\nVisibility of media impact beyond 7/28 days\n\nand now incrementality testing.\n\nAll pieces of measurement that CTC believes are important to building a system of progressive truth.\n\nAs our ideologies have converged our business models have moved in slightly different directions.\n\nThis is where the opportunity for partnership emerged.\n\nNorthbeam has chosen, thoughtfully, to move up market where media complexity and dollar values allow for larger investments in measurement systems. That pursuit of the enterprise and pricing strategy left many 7 figure store owners without access to their technology.\n\nMeanwhile, CTC is actively engaged in figuring out how to bring enterprise level sophistication to the SMB market. Given our position as a service provider it allows us to provide the high level of care needed to deploy these tools to 7 figure store owners.\n\nWith all this in context I am excited to announce that CTC is the EXCLUSIVE PROVIDER of Northbeam technology to 7 figure store owners.\n\nIt will be included as part of our Global Accelerator program (Prophit Engine - 7) going forward.\n\nStores as this level of revenue/spend often are too early to deploy incrementality testing in a way that would give them definitive results in reasonable timelines.\n\nSo, to help our customers get the best possible POV on their media we will now be ingesting and displaying Northbeam data directly inside of Statlas. Enriching our data and presentation of impact to"}, {"n": 72, "client_id": "risedtc", "post_ref": "7477163107728039936", "author_name": "Benzettler", "published": "2026-06-29", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/benzettler_been-heads-down-with-so-much-lately-that-activity-7477163107728039936-Bye9", "post_text": "Been heads-down with so much lately that I missed this last week:\n\nIt's officially been 7 years since Zettler Digital became my full-time gig. \n\nI never thought my own curiosity sell sunglasses back in 2013 would grow into a globally recognized ecommerce marketing practice. \n\nBut I'm grateful for it. We have so many great partners at Shopify, Klaviyo and all the incredible brands we've had the good fortune to work with over the years to thank.\n\nTo the next 7 🚀"}, {"n": 73, "client_id": "risedtc", "post_ref": "7471246663492321280", "author_name": "Sanocki", "published": "2026-06-12", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/sanocki_mammoth-brands-wants-to-be-the-next-pg-activity-7471246663492321280-oJOQ", "post_text": "Mammoth Brands wants to be the next P&G. \n\nHarry's parent, now called Mammoth Brands, told CNBC this week that they want to build P&G if it were getting built today.\n\nAnd they are well on their way.  Harrys, Flamingo, Lumē, Mando, and Coterie (bought for over $1B late last year). $835M in revenue in 2024, ~$100M EBITDA, 20%+ growth for five years running. IPO maybe this fall. \n\nThis is a profitable operator.\n\nBut we've heard \"buy brands, become the next CPG giant\" before. Thrasio said it. Berlin Brands said it. Solo Brands said it.\n\nAll on the ropes or in the graveyard.\n\nBuying a brand is easy. You wire money, you get a logo. Running 8 or 10 of them without nuking the margins and customers that made them worth is the hard part. It's also the part that killed everyone who tried this before.\n\nHere's what's different about Mammoth: they sound like operators. One or two deals a year, not fifty. Coterie kept compounding after they bought it, $200M+ net revenue, up nearly 60%, still profitable. That's a great sign.\n\nThe lesson for the rest of us doing $5M to $500M: the brands that win the next decade won't be the ones that bought the most. They'll be the ones that can run what they own. Repeat rate. Contribution margin. Retention. The boring stuff.\n\nMy assertion still stands: buddy up to PE. That's your exit.\n\nP&G wasn't built on a buying spree. It was built on owning the customer for 40 years.\n\nIf Mammoth operates, they've got a shot. If they start counting logos instead of cohorts, we know how this ends."}, {"n": 74, "client_id": "ivan", "post_ref": "7449435763882205184", "author_name": "Matt Gray", "published": "2026-04-13", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/mattgray1_ive-hired-90-high-performers-in-the-last-activity-7449435763882205184-LGYY", "post_text": "I’ve hired 90+ high performers in the last 3 years.\n\nHere are 8 rare traits I see in every high performer:\n\n1. Grit\n\nThis one’s a non-negotiable. \n\nWhat is it?\n\n• Ability to persist through obstacles\n• Strength to bounce back from failure\n• Tenacity to keep pushing, no matter the challenge\n\nHard work is common. \n\nGrit is rare.\n\n2. Relentless Resourcefulness\n\nSome people find a way no matter how “impossible” it seems.\n\nThey are innovative problem solvers.\n\nThey have the conviction that there's always a solution.\n\nThese are the people we want.\n\nThey’re like water.\n\nThey find a path around any obstacle.\n\n3. Optimism\n\nEntrepreneurship is a roller coaster.\n\nHaving optimistic people on your side is a massive mental boost.\n\nOptimistic people don't see roadblocks; they see stepping stones to success.\n\nTheir energy is electrifying and infectious. \n\nA must-have when the going gets tough.\n\n4. Constant Learning\n\nThe ROI on constant learners compounds.\n\nIn a fast-moving world, learning and adapting is essential.\n\nThese hires:\n\n• Seek feedback\n• Expand their skills\n• Stay curious and hungry\n\nTrain them well, and they'll give you an infinite return on your investment.\n\n5. Not Being an Asshole\n\nIt might sound simple, but it's vital.\n\nI don’t care how smart, hardworking, or optimistic you are.\n\nIf you don’t:\n\n• Show empathy\n• Collaborate well\n• Treat others with respect\n\nI don’t want you on my team.\n\nPeriod.\n\n6. Fun to Be Around\n\nI need people that I like spending time with.\n\nWork can be intense. \n\nHaving people who bring: \n\n• Positive energy\n• A sense of humor\n• A lightness to the office \n\nMakes a world of difference.\n\nWhen we make work feel like play, we're unstoppable.\n\n7. Growth Mindset \n\nThis one is foundational.\n\nI need someone who:\n\n• Embraces challenges as growth opportunities\n• Believes abilities and intelligence can be developed\n\nPeople with a growth mindset get obsessed with the process.\n\nNot fixated on the outcome.\n\n8. Enjoys Responsibility\n\nI need my team to take on responsibility.\n\nI don’t want to chase people down.\n\nIf they:\n\n• Take ownership of their work\n• Care about doing a good job\n\nWe'll perform better.\n\nAnd I’ll have way more breathing room and feel more at ease.\n\n—\n\nEnjoy this? ♻️ Repost it to your network and follow Matt Gray for more.\n\nWant to learn how to build a profitable personal brand that grows even when you’re not around?\n\nJoin my free live Workshop on April 21st (8 days away) to steal my homework: https://lnkd.in/ehMWgysW"}, {"n": 75, "client_id": "risedtc", "post_ref": "7459970206656913408", "author_name": "Michael Fisher1", "published": "2026-05-12", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/michael-fisher1_rotten-is-officially-live-in-kroger-nationwide-activity-7459970206656913408-Loix", "post_text": "Rotten is officially live in Kroger nationwide.\n\nI’m super excited about all the national expansion for Rotten this year and this is a BIG one.\n\nI want to take a second to celebrate the people who actually make these milestones happen.\n\nThe ones doing the heavy lifting behind the scenes so I can make a fun post today.\n\nHuge thank you to the Kroger team: Sarah McGovern and Kelly Wise for being incredible partners and bringing our brand to the mainstream candy aisle.\n\nBig thanks as well to our head of sales and broker partners with whom this would never have happened: Adam Hertel, Ashley Stone, Michelle Burns, Kathy Espinosa, Sally Taylor.\n\nAnd the rest of the Rotten team on the killer execution in the middle of a massive amount of growth Zach Phillips, Brandon Kieffer, Ben DiMarco, Stephanie Campione, Alex Lang, Taylor Smith.\n\nWe are rolling out across the country.\n\nCheck our store locator to make sure your store carries us and then please go grab a bag and support!"}, {"n": 76, "client_id": "risedtc", "post_ref": "7433211721541910528", "author_name": "Tobyjwaller", "published": "2026-02-27", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/tobyjwaller_end-of-week-wins-our-head-of-google-david-activity-7433211721541910528-NDqU", "post_text": "End of week wins 👇\nOur Head of Google, David Shelton, just dropped performance updates from two recently onboarded CPG brands...\n\nBoth came to us in similar positions:\n\nUnder-structured accounts.\n\nLow efficiency.\n\nUntapped intent.\n\nBrand 1 -(starting almost from scratch on Google)\n\nFirst month after rebuilding properly:\n\n• +173% increase in click volume + traffic\n\n• +15% lift in AOV\n\n• +48% increase in ROAS\n\n• Meaningful incremental revenue built immediately\n\nNot from increasing spend.\n\nFrom fixing structure, feed optimisation and tightening intent capture.\n\n-----\n\nBrand 2 -(had been running Google but struggling with ROAS)\n\nWithout increasing spend:\n\n• +28% ROAS\n\n• +21% purchases + revenue\n\n• +13% new customers\n\n• +16% AOV\n\n• -20% CPC\n\nAgain - efficiency driven.\n\n\n------\n\nOn the retention side, Brad Neil (our Head of Email) wrapped the week by completely re-architecting a partner’s Klaviyo setup.\n\nWe:\n\n• Rebuilt high-impact flows from the ground up\n\n• Tightened segmentation based on real buyer behaviour\n\n• Refined offer positioning inside campaigns\n\n• Cleaned deliverability and send logic\n\nResult:\n\nSignificant incremental revenue lift - without increasing send volume or discount dependency.\n\nThat’s the part most brands miss.\n\nScaling isn’t about “more”.\n\nIt’s about better architecture and synergy across paid + retention.\n\nProud of the team.\n\nIf your Google account is plateauing or your email channel feels like it’s just ticking along, there’s usually a structural unlock sitting there."}, {"n": 77, "client_id": "risedtc", "post_ref": "7463604243334062080", "author_name": "Blakeimperl", "published": "2026-05-22", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/blakeimperl_thats-a-wrap-on-the-lead-summit-in-nyc-this-activity-7463604243334062080-jbgI", "post_text": "That's a wrap on The Lead Summit in NYC this week. Feeling grateful for such a stellar Digioh team who all came together to make this such a wonderful conference. Heading home with so much excitement and gratitude.\n\nA few highlights/takeaways for me:\n\nTaking the stage with our customer Daniel Washburn at Pressed Juicery to talk about identity-first personalization and how it has changed their DTC business. \n\nI've learned a lot from chatting with Daniel over the last few months as we prepared for this session. Connecting with customers like him in person and hearing directly about the impact Digioh has made on the Pressed team is one of the most meaningful parts of this work.\n\nThe in-person time with the Digioh squad. The dinners, the walks to and from the venue, the booth conversations. I'm grateful to serve such a wonderful group of people.\n\nI'm so proud of the marketing team for the work and attention to detail that went into this connected campaign.\n\nChatting with brands throughout the two days about what's top of mind for them. So many are starting to move beyond what I call \"Storefront 1.0\", AKA a site experience that resets with every visit, treating every shopper like a stranger. \n\nThe conversation in D2C is shifting. Brands are now caring deeply about persistent identity backed by zero-party data, so that every interaction feels human and continuous. That shift fills me with a lot of excitement for the problem space we're building in.\n\nAnd lastly, connecting with our partners and customers about how we're serving their businesses and the opportunities ahead. We are nothing without them 💚\n\nWe're back at it in NYC next month at CommerceNext. See you there.\n\nShoutout to my Digioh squad: Kendall (Monteith) Martinovic Josh McCallum Jason Hackenberry Alexandra Cassis Matt Teed-Arthur"}, {"n": 78, "client_id": "arch", "post_ref": "7493586144996200448", "author_name": "Marion Balinoff", "published": "2026-08-13", "post_type": "carousel", "image_count": null, "source_url": "https://www.linkedin.com/posts/marion-balinoff_ai-influencer-stats-activity-7493586144996200448-JnFP", "post_text": "58% of Americans already follow at least one AI influencer. 40% have bought something because one told them to. That's not niche anymore, that's word of mouth at scale, except the mouth doesn't exist lol\n\nI get why brands are leaning in. Look at the numbers: engagement rate is higher, average cost per post is lower and don't even get me started on turnaround time... On paper this is the best vendor you'll ever work with, cheap, fast, no negotiation, no risk of them ghosting you for 72h straight.\n\nAnd yet brand willingness to publicly work with AI creators dropped from 86% to 60% in the last 8 months. That's not brands losing confidence in the ROI, because spend on AI creator content actually kept rising through the same period.\nIt's brands getting burned in public. Guess put a fully AI model in Vogue and ate a backlash video that hit millions of views. Coca Cola's AI Christmas ads got called soulless. Consumers aren't rejecting the efficiency, they're rejecting being lied to about who they're trusting.\n\nAnd that gets to the part the data can't capture. Jonah Berger's Wharton School of Business research on this found that virtual influencers only build real engagement when they're humanized, shown next to what looks like an actual person, a friend, a social tie. Because a virtual influencer, by definition, has never tried the product. Never actually gone to the restaurant, worn the shoes, felt anything. Audiences pick up on that even when they can't articulate why. \n\nCheap and fast doesn't fix the fact that the entire value of word of mouth was always someone real vouching for something they'd actually experienced.\nIt's never been easier to produce content at scale. What's still hard is to build trust."}, {"n": 79, "client_id": "ivan", "post_ref": "7397604726105677825", "author_name": "Pascal Bornet", "published": "2025-11-21", "post_type": "article", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_intelligentautomation-ai-artificialintelligence-activity-7397604726105677825-iXAq", "post_text": "This Week’s Top Breakthroughs You Can’t Miss:\n1️⃣ New Research From MIT and BCG Finds Agentic AI Triggering a New Era of Organizational Design\n2️⃣ Google’s Gemini 3 climbs the leaderboards\n3️⃣ Anthropic disrupts AI-orchestrated cyberattack\n4️⃣ Jeff Bezos returns to CEO chair for new AI startup\n5️⃣ Disney star's AI avatar app to chat with the dead\n\nWhich of these AI developments inspires—or worries—you the most? Let’s discuss 👇\n\n💥📩 Get this newsletter straight to your inbox—it’s more convenient! Click here to subscribe:\nhttps://lnkd.in/etD5RPws\n\n#intelligentautomation #AI #ArtificialIntelligence #FutureOfWork #AInews #Automation #Productivity #VoiceAI #Superintelligence #Newsletter"}, {"n": 80, "client_id": "ivan", "post_ref": "7491431109478588416", "author_name": "Alex Vacca", "published": "2026-08-07", "post_type": "post", "image_count": null, "source_url": "https://www.linkedin.com/posts/alex-vacca_this-is-alexandr-wang-and-he-got-rich-off-activity-7491431109478588416-jPUN", "post_text": "This is Alexandr Wang, and he got rich off AI without ever building an AI model.\n \nThen one deal cost him the exact thing that made him rich.\n \nHe drops out of MIT after his freshman year. He's 19.\nEveryone around him is racing to build models. He goes after the layer underneath: the labeled data every model has to eat before it learns anything.\n \nHe co-founds Scale AI and sells that data to the people building the models.\n \n→ OpenAI bought from him\n→ Google bought from him\n→ So did the Pentagon\n→ At 24 he was the youngest self-made billionaire in the world\n→ Scale did $870M in 2024, just under a billion in 2025\n \nHe was never in the race. He was supplying it.\n \nEvery lab could buy from Scale because Scale wasn't anyone's rival.\n \nThen June 2025.\n \nMeta pays $14.3 billion for 49% of Scale and hires Wang to run its superintelligence lab.\n \nWhat happened next took about a week.\n \n→ OpenAI started phasing Scale out\n→ Google moved to cut ties\n→ xAI pulled back\n \nNothing about the product changed.\n \nBut sending your training data to Scale now meant sending it to a company Mark Zuckerberg owns half of.\n \nWang's moat wasn't data labeling. Anyone can hire people to label data.\n \nHis moat was being the one company in AI nobody had to be afraid of.\n \nThat is a real asset. It's also the only kind you can sell once.\n \nYou can price your product.\n \nYou've probably never priced your independence. Or your \"we don't compete with you.\" Or being the safe option in a room full of rivals.\n \nWang got $14.3 billion for his.\n \nA lot of people give theirs away for a logo on someone's partner page."}, {"n": 81, "client_id": "ivan", "post_ref": "7402981106993532928", "author_name": "Pascal Bornet", "published": "2025-12-06", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_ai-privacy-ethics-activity-7402981106993532928-MBLm", "post_text": "RIP Privacy — AI Glasses Can Now Recognize Anyone, Anywhere.\n\nA Dutch journalist just tested a pair of AI-powered glasses that can instantly identify strangers on the street.\n\nNo government database. No police system. Just public data and off-the-shelf AI.\n\nYou look at someone and in seconds, their name, LinkedIn, and background appear before your eyes.\n\nThe scariest part? You can’t really stop it.\n\nYou can ban it, regulate it, add blinking red lights… but once tech like this exists, someone will always find a way to use it.\n\nTo me, this marks a turning point.\n\nWe’ve officially blurred the line between seeing people and knowing them.\n\nBetween being in public and being exposed.\n\nSo here’s the question:\nWhen every face becomes a dataset, how do we protect the meaning of being human?\n\n#AI #Privacy #Ethics #Technology #Innovation #Data #Surveillance"}, {"n": 82, "client_id": "risedtc", "post_ref": "7499126185302396928", "author_name": "Cody Wittick", "published": "2026-08-28", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/codywittick_the-better-a-google-roas-looks-the-more-activity-7499126185302396928-rJS6", "post_text": "The better a Google ROAS looks, the more questions I ask.\n\nI recently audited an account where the ROAS looked good, but conversion tracking was incomplete, enhanced conversions were not delivering, and brand and non-brand traffic were running in the same campaigns.\n\nThe account was also using a list of roughly 11,000 existing customers when the brand had approximately 290,000.\n\nThat meant Google could classify customers the brand had already acquired as new while branded demand propped up the blended result.\n\nMy conclusion was that the current tests could not be trusted.\n\nBefore touching spend, I recommended repairing the measurement, correcting the existing-customer sources, and separating brand from non-brand traffic.\n\nFlattering performance is dangerous when it stops the team from questioning what the account is actually measuring."}, {"n": 83, "client_id": "ivan", "post_ref": "7477365542690045952", "author_name": "Luke Shalom", "published": "2026-06-29", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/lukeshalom_if-your-expertise-business-still-lives-and-activity-7477365542690045952-pyER", "post_text": "If your expertise business still lives and dies on referrals, you don't own a business. You own a really stressful lottery ticket. I'll show 4 of you how to fix that before Wednesday for FREE.\n\nLast week I announced I was giving away 10 FREE consulting calls to my LinkedIn family. \n\nThe response was ridiculous… We had 50+ submissions in 24 hours. And 6 of the slots have already gone!\n\nI have just begun to reach out to people to offer them the slot.\n\nThis will only be open until Wednesday this week!\n\nSo here is my offer again:\n\nMid-July I'm launching a new flagship offer to help coaches, consultants and founders who sell their expertise to scale their coaching business from $8k a month to $20k months without losing their soul to AI.\n\nAs part of that process I NEED market research.\n\nI want to make sure this offer is actually going to help you guys. And not just be another offer on the current steaming dumpster fire of guru cohorts.\n\nSo if you've ever wanted to have one on one support from me on any part of your funnel here's the deal:\n\nI'm giving away a 30-45min audit call if you fit the following criteria:\n\n- Run an expertise-led business (coach, consultant, agency founder)\n- Are hitting $5-$8k+ months and want to scale to $20k a month\n- You have a proven offer and your clients are on linkedin\n\nStruggling to stand out on linkedin? \n\nWe can go through how I would best recommend positioning you so you can finally 2-3x your rates and become the premium choice for your clients.\n\nFed up of having a growing practice but only ever getting referrals?\n\nI show you the Atticus method that has enabled me to build client acquisition systems that drive 30-40 calls a month with my perfect customer, scaling us all the way to $100k months.\n\nDon't want to waste another minute creating linkedin content that gets no impressions and no leads? \n\nI'll be able to tell you why your content isn't converting and how to fix it right away.\n\nI'm coming at this with:\n\n- experience of marketing and sales over a decade.\n\n- 4 years in demand generation helping 100 expert founders to drive $135m+ in pipeline and $6m in closed revenue.\n\n- And of course come with the insight of making over $1.4m+ from my expert firm in the last 3.5 years.\n\nYour research for my expertise.\n\nSound fair enough?\n\nDM me with \"Research\" to apply for a slot.\n\nThere are only 4 left and I will be ending this offer Wednesday.\n\nThat's RESEARCH.\n\n(We MUST be connected)"}, {"n": 84, "client_id": "arch", "post_ref": "7424859493361934336", "author_name": "Logan Burdick", "published": "2026-02-04", "post_type": "article", "image_count": 0, "source_url": "https://www.linkedin.com/posts/loganburdick_robbie-daymond-and-ray-chases-sassy-chap-activity-7424859493361934336-9Dsw", "post_text": "Excited to officially announce my role as COO & Chief Content Officer at Sassy Chap Games, and that we’ve just signed with CAA.\n\nOver the past six months, Sassy Chap Games has shown what’s possible when games are built creator-first, community-powered, and designed to meaningfully bring the creator economy into the gaming space.\n\nAlthough a major success purely as an indie title — with over 725k copies sold across all platforms since June — 𝘋𝘢𝘵𝘦 𝘌𝘷𝘦𝘳𝘺𝘵𝘩𝘪𝘯𝘨! continues to demonstrate the power of bridging games and the creator economy, laying the foundation for a broader franchise strategy spanning games, consumer products, and entertainment.\n\nCAA games agent Matthew Cohen said it best, \"Robbie, Ray, and the Sassy Chap team are redefining how entertainment franchises are built.\"\n\nIt’s an ambitious roadmap, which is why we’re thrilled to partner with Creative Artists Agency, whose cross-platform expertise and global relationships uniquely position them to help us scale the 𝘋𝘢𝘵𝘦 𝘌𝘷𝘦𝘳𝘺𝘵𝘩𝘪𝘯𝘨! IP universe and launch new transmedia franchises.\n\nGrateful to my partners Ray and Robbie for trusting me to help lead Sassy Chap into this next chapter, and to CAA for believing in our vision. Can't wait to share what’s coming next.\n\n#IndieDev #CreatorEconomy #CAA"}, {"n": 85, "client_id": "ivan", "post_ref": "7488142977412784128", "author_name": "Jakub Zajicek", "published": "2026-07-29", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/jakubzajicek_big-day-108-clients-later-leaderhouse-is-activity-7488142977412784128-4Lhl", "post_text": "Big day! 108 clients later, LeaderHouse is officially LIVE! 🎉\n\nWe soft launched in March 31 with no website and no brand. We sold the whole thing from a Google Doc (ha!).\n\nThe idea was simple.\n\nExperts have unique insights you can't Google. We pull them out. We turn them into daily LinkedIn posts that sound like them.\n\nReal humans check every post. No AI slop.\n\nHere's what happened in the 4 months since:\n\n→ 108 B2B founders, experts, and consultants joined\n\n→ 2,000+ posts now ship every single month\n\n→ Patrick's post hit 100,000 impressions (after YEARS of trying LinkedIn)\n\n→ Viviane got DMs from her exact target audience\n\n→ Aitor went from 1,000 to 30,000 impressions per post\n\n→ Agnieszka got inbound from her dream client\n\nAt some point, this got way too big for a Google Doc.\n\nSo we made it official. A real company, with a real name:\n\n=======\n\nLeaderHouse\nLinkedIn Authority Engineering™ for B2B founders, experts, and consultants.\n\n=======\n\n30 posts a month. In your voice. You approve a month of content in about 30 minutes.\n\nAnd here's the launch part (which is honestly INSANE):\n\nIf you join before Aug 11, you're also getting.\n\n✅ Today's rate, locked for LIFE (we increase the price on Aug 12)\n✅ VIP Growth Advisory: a direct WhatsApp line to us\n✅ A 1-1 consulting session with yours truly\n✅ One week of ads, on us\n\n🔗 Everything is here: https://leaderhouse.co/\n\n🎥 Plus, grab your spot for our free live training Aug 6 (How to 10X your reach in 3 days): https://lnkd.in/e469c3pQ\n\nExcited to work with you all!!! My DMs are open if you have any questions.\n\n-\n\nLastly - thank you to every single client who trusted us when the \"product\" was a Google Doc and an inbox. This company exists because of you."}, {"n": 86, "client_id": "risedtc", "post_ref": "7470490570872922113", "author_name": "Daradenney", "published": "2026-06-10", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/daradenney_i-got-some-embargod-intel-yesterday-at-linkedin-activity-7470490570872922113-NU2e", "post_text": "I got some embargo'd intel yesterday at LinkedIn that I can FINALLY share... \n\n(Creative strategists & media buyers... this is for you)\n\nThe TLDR news is this: LinkedIn is launching a Creator Marketplace this month. \n\nAnddddd I know what you might be thinking: \n\n\"Cool. Good for LinkedIn. I work primarily on Meta Ads, so this doesn't apply to me a ton.\" \n\nHere's why this matters: \n\n1. Staying employed is broken. Forever careers are gone. And as a result there is a 60% increase YoY of people calling themselves Founders \n\n(I wish I could take credit for these 3 lines, but they are direct quotes from Daniel Roth's panel yesterday)\n\n2. Brands are more interested in emerging creators vs established creators. So there is a MASSIVE opportunity right now and especially on this platform to create and tell stories. \n\n3. The community is in the comments. Brands are recognizing this and actually beginning to work with creators on \"comment campaigns\". This is also one of the fastest ways to grow on LinkedIn... being a top comment on someone else's piece of content. \n\nSo........ how does this tie into LinkedIn's new creator marketplace? \n\nFrom my POV: LinkedIn as a platform has only begun to scratch the surface on what is possible for creators and professionals on this platform. \n\nAnd I've seen a massive pivot lately for both creative strategists and media buyers: the truly talented ones know they have to go out on their own eventually to get their worth... consulting, starting their own firm, a brand etc. \n\nAnd LinkedIn is feeling VERRRRRYYY early for people who want to create content for their businesses. \n\nThe Creator Marketplace was made because brands consciously want to work with smaller, more niche creators with rich expertise. \n\nSo, translation: the arbitrage window is open.\n\nRight now you can be a \"small\" creator with deep performance expertise and that's exactly what brands are shopping for. In 18 months, every strategist will have figured this out and the bar will be higher.\n\nYou don't need a content strategy. You need to post what you already know.\n\nStart now.\n\n(Also huggggeee thank you Ali Snider, Luiza Cocito, and the rest of the LI team... these new headshots were SOOOOOOOO long overdue )"}, {"n": 87, "client_id": "ivan", "post_ref": "7471229016340074497", "author_name": "Craig Dewart", "published": "2026-06-12", "post_type": "post", "image_count": null, "source_url": "https://www.linkedin.com/posts/craig-dewart-6a6342122_fatjocial-activity-7471229016340074497-5jYI", "post_text": "Super fun day at #fatjocial  \n\nI think this is the perfect sized event for me tbh. \n\nGreat selection of talks. Small-ish room so it’s easy to get the opportunity to speak to the speakers. And good venue that makes meeting talented people in the industry easily. \n\nMy highlights:\nMac Lackey - reframed how I think of acquisitions \nAleyda Solís - not sure where to start.. very dense talk, full of knowledge! I’ll defo need to check the slides again after!! \nMarika R. - had some great outreach rules 👀\nGreg Gifford - most creative slides for sure 😆\nSophie Miller  - shared a UGC campaign she did that gave her crazy ROI \n\nThe fatjoe. team did an epic job once again. \n\nNow I hear there is paella? 👀"}, {"n": 88, "client_id": "arch", "post_ref": "7496453583236653056", "author_name": "Matej 🦩 Lancaric", "published": "2026-08-21", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/matejlancaric_%F0%9D%97%A3%F0%9D%97%B9%F0%9D%97%AE%F0%9D%98%86%F0%9D%97%AE%F0%9D%97%AF%F0%9D%97%B9%F0%9D%97%B2%F0%9D%98%80-%F0%9D%97%B6%F0%9D%97%BB-%F0%9D%97%99%F0%9D%97%AE%F0%9D%97%B0%F0%9D%97%B2%F0%9D%97%AF%F0%9D%97%BC%F0%9D%97%BC%F0%9D%97%B8-activity-7496453583236653056-kLGj", "post_text": "𝗣𝗹𝗮𝘆𝗮𝗯𝗹𝗲𝘀 𝗶𝗻 𝗙𝗮𝗰𝗲𝗯𝗼𝗼𝗸 𝗥𝗲𝗲𝗹𝘀. 𝗜𝘁'𝘀 𝗵𝗮𝗽𝗽𝗲𝗻𝗶𝗻𝗴.\nMeta didn't announce it. The docs don't mention it. Their help center still lists playables only on Feed, Stories, and Audience Network. 👇\n\nBut last night in the Reels tab I hit a fully interactive playable for Idle Boxer (Tap Nine). Played it twice to be sure - randomized fighters each session, gear unlocks changing stats, 10-minute timer, end card to App Store. That's a real playable, not a video pretending to be one.\n\n𝗪𝗵𝘆 𝘆𝗼𝘂 𝘀𝗵𝗼𝘂𝗹𝗱 𝗰𝗮𝗿𝗲:\n\nReels is ~half of Meta's ad inventory now. The fastest-growing placement just went from video-only to (quietly) interactive.\n\n𝗜𝗳 𝘆𝗼𝘂'𝗿𝗲 𝗮 𝗴𝗮𝗺𝗶𝗻𝗴 𝗮𝗱𝘃𝗲𝗿𝘁𝗶𝘀𝗲𝗿: get your vertical MRAID builds ready. When this opens up, early inventory will be cheap. It always is.\n\nSilent test or slow rollout - either way, you heard it here first. Subscribe to lancaric.substack.com for more!\n\nAnyone else spotting interactive units in Reels?"}, {"n": 89, "client_id": "risedtc", "post_ref": "7452623530929786880", "author_name": "Gil David", "published": "2026-04-22", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/gil-david_attention-meta-advertisers-this-scam-activity-7452623530929786880-2U4o", "post_text": "⚠️ Attention Meta advertisers ⚠️\n\nThis scam has been going around a while now but I've now had 3 of these emails in the past week. \n\nI wouldn't click any of this so not sure how these scammers are getting business manager ID/details to send these but in case you see a random partner request you aren't expecting, ignore and delete.\n\nIt's bad enough Meta keeps disabling profiles for no reason without anyone unsuspecting letting hackers into their BM this way."}, {"n": 90, "client_id": "ivan", "post_ref": "7485732335158542336", "author_name": "Luke Shalom", "published": "2026-07-22", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/lukeshalom_my-impressions-dropped-70-and-i-nearly-quit-activity-7485732335158542336-2eeX", "post_text": "My impressions dropped 70% and I nearly quit LinkedIn on New Year's Day. \n\nSix months later, my most profitable month ever. Here's the strange journey:\n\nLast October: Mount Olympus.\n\nI hit a record month. $100,000 in revenue. \n\nMy mentor at the time told me \"you shouldn't be in your DMs\", so I hired a setter and handed over the keys.\n\nOne problem. \n\nI placed all my trust in them and tracked nothing. \n\nI took my eye off the single most important motion in the business.\n\nDecember: The cliff.\n\nLeads fell off a cliff. 30-40 meetings a month down to 15. New year, no net new pipeline.\n\nI'd touched what felt like Mount Olympus and dropped straight off it. \n\nOutsourcing a human skill without tracking it cost me the exact thing that built the mountain.\n\nJanuary: The lobby.\n\nI remember New Year's morning 1st Jan 2026, fresh off a party, I was staring at my impressions glumly. A fraction of the year before.\n\nFour years of daily posting and my reach had dropped 70%, and I was reaching what smaller accounts reach. \n\nThat's when the thought hit: what the ***k was the point?\n\nFebruary: Perspective.\n\nMy girlfriend's dad passed at the start of the month. I was in the room when it happened. Everything else stopped mattering.\n\nBusiness carries on no matter what's happening in the background. \n\nThe one mercy was that the business I'd built gave me the flexibility to be her rock. \n\nThat's the whole point of the freedom, it turns out. To be there for when the people we love need it most. \n\nMarch: The six-figure lesson.\n\nI added up what I'd spent on GTM bells and whistles that year. It was roughly $100,000 over a year.\n\nThen I looked at what actually produced our best results: positioning, narrative content, and reaching the right people at the right time on LinkedIn. The fundamentals.\n\nA mentor once told me \"what works is what is worthy.\" I'd forgotten it. \n\nExpensive reminder.\n\nApril to May: The realisation.\n\nOur expert clients doing knowledge work were getting explosive results. \n\nJ signed multiple clients in her first 60 days. \n\nJonathan, a VC who could never get calls, scaled to 11 a month and closed $30k.\n\nClient acquisition for experts is the thing I'm uniquely great at. And I'd lost my love for the heavy lead-gen agency grind. \n\nSo I built the Founder-led Demand Accelerator and opened 1:1 advisory.\n\nJuly: The proof.\n\n$26k net cash collected before the month even closed.\n\nOne of my highest profit months yet, keeping more of what I make, doing better work.\n\nWe are leveragi"}, {"n": 91, "client_id": "ivan", "post_ref": "7409990059933712384", "author_name": "Allie K. Miller", "published": "2025-12-25", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/alliekmiller_one-thing-ai-cant-replace-being-present-activity-7409990059933712384-a7Qy", "post_text": "One thing AI can’t replace: being present.\n\nIt can summarize your year, reverse engineer your most audacious goals, and build a family recipe book app based on voice notes from relatives (honestly I might have to do that one). But it can’t feel the weight of a hug. Can’t taste the food. Can’t sit in the quiet moment before everyone arrives.\n\nThat part’s yours.\n\nEnjoy today if you celebrate and happy holidays, everyone."}, {"n": 92, "client_id": "risedtc", "post_ref": "7503669134006693888", "author_name": "Ben Zettler", "published": "2026-09-10", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/benzettler_11-years-ago-when-i-first-became-aware-of-activity-7503669134006693888-LWE7", "post_text": "11 years ago when I first became aware of Klaviyo, I thought it was a great tool for brands to send email. And indeed it was. \n\nBut as it’s grown into a platform, it’s become the intelligence layer that our brand partners leverage to power the foundation of their businesses. \n\nWith today’s expansion of its service offerings to cover more advanced personalization, data-backed analysis of performance and functions to allow brands to sell more without human intervention, I’m more energized than ever to help brands build."}, {"n": 93, "client_id": "risedtc", "post_ref": "7496596982820515840", "author_name": "Danielle Lehrer", "published": "2026-08-21", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/danielle-lehrer_three-freelancers-in-a-slack-channel-is-not-activity-7496596982820515840-Xj1z", "post_text": "Three freelancers in a Slack channel is not an agency.\n\nThe tell isn't talent. Most of them are good at the specific thing they do, and the work looks fine in isolation.\n\nThe tell is that nobody owns the outcome. Your media buyer optimizes to ROAS, your creative person optimizes to output volume, your email person optimizes to open rate, and every one of them can hit their number while the business goes sideways.\n\nAsk them who decides what gets tested next week. If the answer is a group chat, you have vendors.\n\nAn agency has a person whose job is the whole picture, who can tell you why last month worked and what changes because of it. That role costs money, which is exactly why the cheap option doesn't include it.\n\nYou're not paying more for better ads. You're paying for someone to be responsible when they stop working."}, {"n": 94, "client_id": "risedtc", "post_ref": "7457055206959321088", "author_name": "Kendalldickieson", "published": "2026-05-04", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/kendalldickieson_cpg-retailmarketing-socialmediastrategy-activity-7457055206959321088-NM3w", "post_text": "No feeling beats seeing something you have a hand in hitting a stride with no signs of stopping.\n\nLast week, Ripi officially landed in over 1,100+ Target locations and debuted a new flavor, Basil Pesto!\n\nHuge thank you as always to Ian Tecklin for letting me play a part.\n\n#cpg #retailmarketing #socialmediastrategy #socialmediamarketing #contentstrategy"}, {"n": 95, "client_id": "arch", "post_ref": "7503015066036940800", "author_name": "Mark Austin", "published": "2026-09-08", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/mark-austin-4726b865_i-had-a-great-time-up-at-autumn-fair-this-activity-7503015066036940800-50rD", "post_text": "I had a great time up at Autumn Fair this week. \n\nEvery exhibitor I spoke with mentioned about the quality of visitors to their stands. \n\nA brilliant night out on Sunday with some great people too! \n\nAs we were sat there watching the football I noticed Andy Hobbs and Luke Stephenson waiting for a taxi - safe to say they didn’t get in! \n\nThank you for a brilliant night Freddie Martin and the fabulous team at KTL  \n\nNow onto the licensing awards this evening!"}, {"n": 96, "client_id": "arch", "post_ref": "7479802889679351808", "author_name": "Felix Braberg", "published": "2026-07-06", "post_type": "carousel", "image_count": 0, "source_url": "https://www.linkedin.com/posts/felix-braberg-7a732b51_steam-games-that-will-move-to-mobile-activity-7479802889679351808-z26u", "post_text": "What Steam Trends Will Come to Mobile?\n\nWe just did a full Steam episode on two & a half gamers, digging into what is climbing the charts and what is about to jump to your phone. Six patterns kept showing up. None of them invent a new genre. They take something we already love and add depth, satisfaction, or a wild twist.\n\nHere is what I would keep an eye on:\n\n🎰 Arcade hooks with roguelike depth: Simple coin pushers and scratch cards, rebuilt with run-based progression and meta systems. See: RACCOIN: Coin Pusher Roguelike\n\n🧼 Hyper tactile chore sims. Past basic decoration. Think power washing, painting, and restoring a room, with before and after payoffs you can feel. See: Hozy\n\n🏪 Store managers with a twist: The plain supermarket sim is tired. Running a 90s video rental store, or stocking shelves through a strange roadside event, is not. See: Retro Rewind and Roadside Research\n\n🚪 High-stakes checkpoint games: One simple yes or no loop. Inspect the ID, make the call, live with it, all wrapped in real tension. See: Quarantine Zone: The Last Check\n\n🧬 Chaotic generational breeding: Collection games where your creatures inherit messy, shareable mutations across generations. See: Mewgenics\n\n🏌️ Real-time multiplayer sabotage Party games that kill the dead time of waiting for your turn. Everyone plays at once and actively wrecks each other. See: Super Battle Golf\n\nThe takeaway for anyone building on mobile: The winners will not be new mechanics. They will be familiar hooks, scratching a ticket, cleaning a room, playing mini golf, upgraded with deep progression, satisfying visuals or a story twist that makes people screenshot it.\n\nThanks, Jakub & Matej 🦩 for putting together a great episode! \n\nLink 👇"}, {"n": 97, "client_id": "arch", "post_ref": "7501655416615886849", "author_name": "Michail Katkoff", "published": "2026-09-04", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/michailkatkoff_every-week-i-get-to-test-how-my-ideas-and-activity-7501655416615886849-bn-R", "post_text": "Every week, I get to test how my ideas and thoughts land with Jen Donahoe on the Deconstructor of Fun podcast.\n\nIn the weekly This Week in Games (TWIG) episode, we track downloads, revenue, sales, and acquisitions, offering our expert analysis. \n\nAll while I personally track these three signals from Jen:\n\nA: Pursed lips mean I had a bad take. \nB: An eye roll, a sigh, and closed eyes mean I'm onto something. \nC: A full head tilt to the ceiling means cut it from the episode (more often than you'd guess)\n \nJen's facial expression is the strongest feedback signal of my week. And it costs me nothing but dignity."}, {"n": 98, "client_id": "arch", "post_ref": "7505896152907636737", "author_name": "Mark Austin", "published": "2026-09-16", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/mark-austin-4726b865_toys-toynews-toyindustry-activity-7505896152907636737-Nqk3", "post_text": "Congratulations to Chloe Chambers who has been promoted to Marketing Manager at Orchard Toys Ltd. Well deserved and great to see the hard work recognised. \n\nAfter five years working within the Orchard Toys marketing team, Chloe will be stepping into the role of Marketing Manager. \n\nOrchard Toys has announced the appointment of Chloe Chambers to Marketing Manager. She has been with Orchard Toys for over five years, working within the marketing team.\n\nDuring this time, she has developed extensive knowledge of the brand, its product ranges and customer base, while playing a key role in bringing the Bluey and The World of Peter Rabbit licences to market. She has also overseen Orchard Toys’ digital marketing, including eCommerce and social channels.\n\nSimon Newbery, Managing Director at Orchard Toys, said: “This is a well-deserved promotion for Chloe. Her experience, combined with her marketing skills, enthusiasm and genuine passion for Orchard Toys, make her an ideal successor to Rachael Sutcliffe. We’re excited to see her step into her new role and continue to deliver a presence for Orchard Toys in the market.”\n\n#toys #toynews #toyindustry #promotion #toypeople"}, {"n": 99, "client_id": "risedtc", "post_ref": "7493343572197531648", "author_name": "Nickshackelford", "published": "2026-08-12", "post_type": "document", "image_count": null, "source_url": "https://www.linkedin.com/posts/nickshackel
