<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gold-set labelling</title>
<style>
  :root{
    --bg:#F7F5F0; --ink:#1A1A1A; --accent:#C8F169;
    --line:#DEDACF; --muted:#6B6862; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;padding:0 0 96px 0;min-height:100vh;position:relative;}

  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line);}
  .progress-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .progress-row strong{color:var(--ink);font-size:14px;}
  .progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .2s ease;}

  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 0;}
  .chip{border:1px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
  .meta-text{font-size:13px;color:var(--muted);}
  .meta-text b{color:var(--ink);font-weight:600;}

  .post-card{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .post-text{max-height:45vh;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.5;}
  .post-link{display:inline-block;margin-top:10px;font-size:12px;color:var(--muted);text-decoration:underline;}
  .post-link:visited{color:var(--muted);}

  .fields{padding:16px;}
  .field{margin-bottom:20px;}
  .field-head{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;}
  .field-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;}
  .field-status{font-size:13px;line-height:1;padding-top:2px;}
  .field-status.ok{color:#5c7a1e;}
  .field-status.pending{color:var(--muted);}
  .field-status.retry{color:#b34700;}

  details.help{margin-left:auto;}
  details.help summary{
    list-style:none;cursor:pointer;width:20px;height:20px;border-radius:50%;
    border:1px solid var(--muted);color:var(--muted);font-size:12px;
    display:flex;align-items:center;justify-content:center;user-select:none;
  }
  details.help summary::-webkit-details-marker{display:none;}
  details.help[open] summary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .help-panel{margin-top:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:12.5px;line-height:1.5;color:var(--muted);}
  .help-panel div{margin-bottom:4px;}
  .help-panel b{color:var(--ink);}

  .pills{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    appearance:none;border:1px solid var(--ink);background:var(--card);color:var(--ink);
    border-radius:999px;padding:10px 14px;font-size:14px;min-height:44px;line-height:1.1;
    cursor:pointer;font-family:inherit;
  }
  .pill.selected{background:var(--accent);border-color:var(--accent);font-weight:700;}
  .pill:active{transform:scale(.98);}

  .navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);
    border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  .nav-btn{
    flex:1;min-height:48px;border-radius:12px;border:1px solid var(--ink);background:var(--card);
    color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .nav-btn.secondary{flex:0 0 auto;padding:0 18px;font-weight:500;color:var(--muted);border-color:var(--line);}
  .nav-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .nav-btn.primary[disabled]{background:var(--line);color:var(--muted);border-color:var(--line);cursor:not-allowed;}
  .queue-note{font-size:11px;color:#b34700;text-align:center;padding-top:6px;}

  .done-screen{padding:40px 24px;text-align:center;}
  .done-screen h1{font-size:22px;margin-bottom:12px;}
  .done-screen p{color:var(--muted);font-size:15px;line-height:1.6;}
  .done-screen .big{font-size:40px;font-weight:700;color:var(--ink);margin:16px 0;}

  @media (min-width:700px){
    .post-text{max-height:40vh;}
    .pill{padding:9px 16px;}
  }
</style>
</head>

  var LS_INDEX = 'cb17_gold_index_v1';

  var POSTS = [{"n": 1, "client_id": "arch", "post_ref": "7445011048786579457", "author_name": "James Hacking", "published": "2026-04-01", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/james-hacking_in-2017-we-won-a-600k-deal-we-were-a-team-activity-7445011048786579457-RY4q", "post_text": "In 2017 we won a £600k deal.\n\nWe were a team of 3.\n\nIt was a global social launch for a video game.\n\nNone of us had done anything like it before.\nWe definitely didn’t even expect to win it.\n\nWhen we got off the call, we all had the same thought:\n\n“How the f**k are we going to pull this off?”\n\nNo process. No clue. Just a client expecting the results we’d promised.\n\nSo we slept in the office for almost two weeks.\nDay by day, figuring it out.\n\nWe delivered a campaign that did over 500 million views and millions of downloads.\n\nWhen you’re small and you say yes to something you’ve never done, you don’t get to fail.\n\nSocially Powerful"}, {"n": 2, "client_id": "ivan", "post_ref": "7490733923006824448", "author_name": "Lara Acosta", "published": "2026-08-05", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/laraacostar_ive-grown-from-0-350k-followers-on-linkedin-activity-7490733923006824448-Ad14", "post_text": "I've grown from 0-350k followers on LinkedIn. \n\nAnd just built the world's most powerful platform that helps anyone do the same (in less time). \n\nThis is Kleo 3: a strategist, ghostwriter + coach in one.\n\nThe first tool that actually gets you.\n\nGrab Kleo's launch offer here (expires in 2 days): https://kleo.so/offer\n\nHere's how it works: \n\n1. Kleo builds your personal content strategy \n\nBased on your exact goals for your personal brand, Kleo turns proven growth data into a personalised strategy.\n\n2. Writing proven high-performing content\n\nYou can now connect your LinkedIn, upload your documents, save posts, sync meeting transcripts, and add your ideas. \n\nKleo learns from you and pairs it with proven hooks, formats, storytelling and educational frameworks. \n\nAll to write the perfect posts that sound like you.\n\nBut perform 100x better. \n\n3.⁠ ⁠The perfect head of marketing and strategy\n\nJust like an agency or a marketing team, Kleo remembers everything you've shared and learns what's working. \n\nBut it also keeps you posting weekly by sending reminders with pre-written ideas and posts.\n\nAll ready for you to hit publish. \n\n4.⁠ ⁠Take Kleo with you wherever you go\n\nKleo now works inside Telegram and WhatsApp (soon), just send it a post, an idea or a draft... \n\nAnd it will prepare a post engineered for success.\n\nThis is the proudest moment of my career. \n\nIn 2023, I was no one on the platform, just an immigrant with nothing to lose. I went all in on 1 thing. \n\nBuilding the future I wanted instead of waiting for one.\n\nToday, we've built the platform that gives anyone who aspires to do the same that exact same chance.\n\nI don't just say this; I've seen it already. \n\n1,200+ founders, creators, and experts have already used Kleo to go viral, land clients, grow their audiences, and build their businesses. The next story could be yours.\n\nWe believe your talent should never stay invisible.\n\nKleo makes sure it doesn't. \n\nTo celebrate our new release with you, we're giving the first 1,000 people who comment KLEO 3 access to our LinkedIn profile builder and optimiser.\n\nWatch our the REPLAY from product launch and masterclass here: https://linktw.in/gTsYaN\n\nPS: Who's joining us later? Comment below, and we'll pick 10 of you to write posts live!"}, {"n": 3, "client_id": "arch", "post_ref": "7498261202129838080", "author_name": "Felix Braberg", "published": "2026-08-26", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/felix-braberg-7a732b51_august-is-a-low-ecpm-month-on-mobile-everyone-activity-7498261202129838080-2aBY", "post_text": "August is a low eCPM month on mobile!\n\nEveryone prepares for January eCPMs, but most developers forget about August. \n\nIn August, your impressions and engagement usually look normal, but your eCPMs drop by 20-25% compared to mid-June.\n\nOn US iOS, a rewarded placement clearing $18 in December is doing $13 to $14.50 right now. Same app. Same users. Same stack.\n\nJanuary eCPM drops have the common courtesy to be obvious.\n\nAugust is an absence event. The budgets exist, and they're approved. Nobody is at their desk to spend them.\n\nThe good news is that August eCPMs recover faster than January. \n\nSee my full write-up below on eCPM seasonality in mobile as an index!\n\n👇"}, {"n": 4, "client_id": "ivan", "post_ref": "7404598239368282112", "author_name": "Allie K. Miller", "published": "2025-12-10", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/alliekmiller_a-summary-of-the-big-apple-departures-meta-activity-7404598239368282112-4sG9", "post_text": "A summary of the big Apple departures - Meta and OpenAI benefit the most: \n\n- Jony Ive, Chief Design Officer, left June 2019 to start LoveFrom (now working with OpenAI on mysterious screenless AI hardware with potential launch in 2027)\n- Luca Maestri, CFO, stepped back Jan 2025 and now leads corporate services \n- Jeff Williams, COO, stepped down July 2025, retired Nov 2025\n- Ruoming Pang, Head of AI Foundation Models, left July 2025 for Meta\n- Jian Zhang, AI Robotics Lead, left Sept 2025 for Meta\n- Ke Yang, Head of AI Search, left Oct 2025 for Meta\n- John Giannandrea, Head of AI, announced retirement Dec 1 2025 (retiring Spring 2026)\n- Alan Dye, Head of UI Design, left Dec 2025 for Meta\n- Billy Sorrentino, Sr. Design Director, left Dec 2025 for Meta\n- Lisa Jackson, VP of Environment, Policy & Social Initiatives, retiring late Jan 2026\n- Kate Adams, General Counsel, retiring late 2026​​​​​​​​​​​​​​​​ \n\nApple’s new GC will be Jennifer Newstead from…you’ll never guess…Meta. \n\nRumors are out there that Tim Cook could leave in 2026, but with this much executive shakeup, they’re going to need some sliver of stability."}, {"n": 5, "client_id": "risedtc", "post_ref": "7490335627809464320", "author_name": "Jake Thornhill", "published": "2026-08-04", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/jake-thornhill_new-people-keep-showing-up-here-so-im-activity-7490335627809464320-6NvE", "post_text": "New people keep showing up here, so:\n\nI'm Jake. I mail things to people for a living.\n\n1. 500,000+ pieces mailed across 34 documented campaigns.\n\n2. $7M+ in revenue I can trace directly back to those drops.\n\n3. Four industries: ecommerce, info products, B2B services, home services.\n\n4. My longest running campaign went 6.5 years with zero changes to the creative. Same card. Same list source. Same offer. Try that with a Meta ad.\n\n5. Took one client from a single test mailing to 200,000 pieces a month.\n\n6. Quoted a $29M company $15,000 once. She said \"that's a rounding error,\" then told me they spend a million a month on Facebook.\n\n7. I don't sell software. I write the card, design it, produce it, and mail it. Direct mail without having to figure out direct mail.\n\n8. I've talked more people out of mailing than into it. If your AOV is $28 and your margin is 30%, the math doesn't work and I'll say so.\n\n9. My whole pitch is one sentence: the money is already on your list, you just can't get to it."}, {"n": 6, "client_id": "risedtc", "post_ref": "7467198280393777152", "author_name": "Gavintrippe", "published": "2026-06-01", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/gavintrippe_if-youre-a-cmo-at-a-shopify-brand-looking-activity-7467198280393777152-m1NS", "post_text": "If you're a CMO at a Shopify brand looking at your dashboard churn reports every week and making decisions based on it, well, I would not. That number is measuring almost nothing. This might sound strange, but churn doesn't really exist in e-commerce. \n\nSay a customer of yours bought a mattress in 2021, and you haven't heard from them since. Are they churned? Of course not. Mattresses last 8 years. They'll be back when they need one. But your dashboard is counting them as dead because Shopify uses a \"returning\" window that has nothing to do with how your customers actually buy.\n\nI’m not saying you don’t think about churn, but you do need a churn window built on your data. For most brands, that's 365 days. For long-cycle products like mattresses or ski gear, stretch it to whatever number makes sense for your customers’ buying behavior.\n\nOnce it's calibrated, that report shows you things Shopify never could. A client of ours pulled an annual promo two months early last year and didn't run it on the original date. A year later, on that original promo anniversary, 622 customers from the cohort hit the end of their window and churned. Only 165 new buyers came in to replace them. Their Shopify 70/30 split barely moved.\n\nShopify is a great commerce platform, but it's not a customer health platform. If you want to know whether your list is alive, build that view yourself (or hire us, ha)."}, {"n": 7, "client_id": "arch", "post_ref": "7487919052988964866", "author_name": "Rohan Farquhar", "published": "2026-07-28", "post_type": "text", "image_count": 0, "source_url": "https://www.linkedin.com/posts/rohan-farquhar-21a154244_dtc-brands-cracked-this-years-ago-out-of-activity-7487919052988964866-b_bt", "post_text": "DTC brands cracked this years ago out of pure necessity. The best app founders have now joined them at the top table.💰\n\nAirbnb. Grammarly. DoorDash. MasterClass. Perplexity.\n\nAll running active, sophisticated creator programmes right now.\n\nNot as experiments. These are core acquisition channels with real budget, real tracking, and real results.\n\nThe leading apps aren't asking whether influencer marketing works anymore.\n\nThey've moved on to how to do it better, bigger. 🎯\n\nThe question is whether your app is keeping pace.\n\nBecause the gap between those who are and those who aren't gets wider every quarter. 👀🔥"}, {"n": 8, "client_id": "risedtc", "post_ref": "7401278103018233856", "author_name": "Michael Fisher1", "published": "2025-12-01", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/michael-fisher1_in-candy-the-extremes-still-get-a-lot-of-activity-7401278103018233856-v2Z1", "post_text": "In candy, the extremes still get a lot of the shelf space.\nFull sugar on one side.\nZero sugar and artificial on the other.\n\nBut we’ve seen how this ends.\nSoda is going through it.\n\nFor years, better-for-you meant Diet Coke.\nZero sugar. Full of artificial junk.\n\nThen Poppi and Olipop rewrote the rules.\nLess sugar. Better ingredients. Still felt like a treat.\n\nCandy’s on the same path.\nYou don’t have to choose between junk and joyless.\n\nThere’s a middle ground.\nCleaner, smarter candy that actually tastes good.\n\nThat’s the space we’re building in.\nAnd we think it’s the future."}, {"n": 9, "client_id": "risedtc", "post_ref": "7494086436330106881", "author_name": "Taylor Holiday", "published": "2026-08-14", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/taylor-holiday-a169b322_yesterday-we-had-a-private-group-of-15-founders-activity-7494086436330106881-svBq", "post_text": "Yesterday we had a private group of 15 founders and CEO's sharing about their experience previously selling, or currently planning to sell, their brand. \n\nImmediately following I received a text from one of them saying how valuable the space was and asking if we could potentially start a networking group specifically for people currently in the process of selling. \n\nA space to trade deal notes, process negotiations and pressure test ideas. \n\nWe will bring in guest speakers who have recently transacted, bankers, PE groups etc. \n\nCome together for the duration of your process and then swap out once you are complete. \n\nAn ongoing group of entrepreneurs helping each other maximize the results of their process. \n\nTest name: \"Final Lap\"\n\nIan Jordan and are going to curate a list of interested parties. \n\nDM either of us if this would be interesting to you. \n\nDon't have to be actively in process, just considering"}, {"n": 10, "client_id": "arch", "post_ref": "7501182081050324992", "author_name": "Michail Katkoff", "published": "2026-09-03", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/michailkatkoff_the-western-game-industry-is-cooked-thats-activity-7501182081050324992-BTiO", "post_text": "\"The Western game industry is cooked\". That's the wrong take. The truth is more dramatic...\n\nFirstly, 𝐒𝐭𝐚𝐫 𝐖𝐚𝐫𝐬 𝐙𝐞𝐫𝐨 𝐂𝐨𝐦𝐩𝐚𝐧𝐲 𝐢𝐬 𝐚 𝐟𝐚𝐧𝐭𝐚𝐬𝐭𝐢𝐜 𝐠𝐚𝐦𝐞. It's XCOM in the Star Wars setting, made by many of the developers who created those legendary XCOM titles. This game will surely sell well enough to reach break-even.\n\nSecondly, XCOM is both a cult classic and a niche game. Turn-based tactical combat is literally like playing D&D. Perfect for men like me. Nerds born in the 80s. Boring for pretty much everyone else, and a Star Wars licence doesn't change that. That's why it 𝐰𝐨𝐧'𝐭 𝐥𝐢𝐤𝐞𝐥𝐲 𝐬𝐞𝐥𝐥 𝐦𝐮𝐜𝐡 𝐦𝐨𝐫𝐞 𝐭𝐡𝐚𝐧 𝐛𝐫𝐞𝐚𝐤-𝐞𝐯𝐞𝐧.\n\nThirdly, Bit Reactor should be working on DLC, a sequel, and a version of the game with a different IP. The fact that they are not doing so is not due to the market. It's due to 𝐢𝐧𝐭𝐞𝐫𝐧𝐚𝐥 𝐜𝐨𝐧𝐟𝐥𝐢𝐜𝐭 𝐚𝐦𝐨𝐧𝐠𝐬𝐭 𝐭𝐡𝐞 𝐟𝐨𝐮𝐧𝐝𝐢𝐧𝐠 𝐭𝐞𝐚𝐦. Everyone is suing each other. That spooks the publishers and collapses the company around them, despite a successful debut title.\n\n𝐓𝐡𝐞 𝐫𝐞𝐚𝐥 𝐭𝐚𝐤𝐞𝐚𝐰𝐚𝐲? Around 65% of high-potential startups fail due to co-founder conflict and team-related problems. This is one of them. Not the market. Not the product. It's a story about the leaders who can't get along and the team around them bearing the consequences.\n\nIf you're a founder, you know this story all too well. I know I do.\n\nAnd if you're born in the 80s, buy this game. Just like me, you'll love it.\n\nPS: More takes like these? Every week, for free, in the Deconstructor of Fun newsletter."}, {"n": 11, "client_id": "ivan", "post_ref": "7436289894131322880", "author_name": "Pascal Bornet", "published": "2026-03-08", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_ai-tech-innovation-activity-7436289894131322880-fSL7", "post_text": "𝗜𝗻𝘃𝗲𝗻𝘁𝗶𝗼𝗻𝘀 𝗳𝗿𝗼𝗺 𝟭𝟵𝟮𝟬 𝘁𝗼 𝟭𝟵𝟲𝟬.\n\nSometimes I forget how many “modern” ideas already existed decades ago.\n\nElectric scooters were already there.\nEven cars with 𝟵𝟬-𝗱𝗲𝗴𝗿𝗲𝗲 𝗿𝗼𝘁𝗮𝘁𝗶𝗻𝗴 𝘄𝗵𝗲𝗲𝗹𝘀.\n\nIt reminds me that innovation is often not about new ideas, but about 𝘁𝗵𝗲 𝗿𝗶𝗴𝗵𝘁 𝗺𝗼𝗺𝗲𝗻𝘁.\n\nSome inventions arrive too early.\n\nSo I’m curious:\n\n𝗪𝗵𝗶𝗰𝗵 𝗼𝗹𝗱 𝗶𝗻𝗻𝗼𝘃𝗮𝘁𝗶𝗼𝗻 𝗱𝗼 𝘆𝗼𝘂 𝘁𝗵𝗶𝗻𝗸 𝗱𝗲𝘀𝗲𝗿𝘃𝗲𝘀 𝗮 𝗰𝗼𝗺𝗲𝗯𝗮𝗰𝗸 𝘁𝗼𝗱𝗮𝘆?\n\nSource: Endrit Restelica\n\n#AI #Tech #Innovation #Past"}, {"n": 12, "client_id": "arch", "post_ref": "7506262263343869954", "author_name": "Mark Austin", "published": "2026-09-17", "post_type": "article", "image_count": 0, "source_url": "https://www.linkedin.com/posts/mark-austin-4726b865_the-entertainer-strikes-digital-commerce-activity-7506262263343869954-GXjg", "post_text": "The news is coming thick and fast for The Entertainer.\n\nThe Entertainer strikes digital commerce partnership with THG Commerce\n\nTHG Commerce will be responsible for The Entertainer’s digital experience, making discovering and buying toys easier, more inspiring and more personalised.\n\nThe Entertainer has appointed THG Commerce as its new digital commerce partner, accelerating its transformation and opening up new ways for customers to discover and shop for toys online and in-store.\n\nThe multi-year partnership will see THG Commerce design, build and power The Entertainer’s digital experience, creating a more intuitive and personalised journey for families, gift buyers and the growing number of kidult toy and collectible enthusiasts.\n\nThe investment is a further step in The Entertainer’s journey to build an omnichannel customer experience, combining the expertise, curation and sense of discovery customers value in its stores with the convenience and personalisation of modern digital retail.\n\nRead more here:\n\n#toynews #toyindustry #retail #ecommerce #toys"}, {"n": 13, "client_id": "risedtc", "post_ref": "7405348605848596480", "author_name": "Sampiliero", "published": "2025-12-12", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/sampiliero_do-not-group-all-your-campaigns-together-activity-7405348605848596480-T7Um", "post_text": "DO NOT group all your campaigns together.\n\nPerfect example of a “healthy” ad account spending ~15-30k per month ripping a 62X frequency over the last 30 days.\n\nI built a FREE calculator that breaks down the exact frequencies I recommend in ad accounts so you can prevent overspending on existing customers.\n\nComment “calculator” and I will send it to you.\n(Must be connected on Linkedin)"}, {"n": 14, "client_id": "risedtc", "post_ref": "7435055047278755840", "author_name": "Christophermarrano", "published": "2026-03-04", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/christophermarrano_meta-just-made-two-announcements-that-most-activity-7435055047278755840-qSUK", "post_text": "Meta just made two announcements that most brands are going to miss.\n\nDetailed targeting is now mostly a suggestion.\nASC and AAC campaigns are being phased out entirely by September 2026.\n\nRead those together and there’s a clear pattern.\nMeta is systematically removing every manual control lever advertisers have relied on for the last decade.\n\nAudience targeting. Campaign structure. Budget allocation.\n\nAll of it is moving into the machine.\n\nAnd the brands that are going to struggle the most are the ones who built their entire strategy around controlling those levers.\n\nBecause when the lever disappears, so does the strategy.\n\nHere’s what that leaves you with.\n- Your offer.\n- Your creative.\n- The strength of your signal.\n\nThat’s it. That’s the whole game now.\n\nThe agencies still arguing about ad set structure and audience stacking are having the wrong conversation entirely.\n\nMeta has already decided that conversation is over.\n\nThe only edge left is what you put in front of people and whether it makes them stop.\n\nEverything else is just settings.\n\nWhat are you seeing in your accounts since targeting started getting overridden?"}, {"n": 15, "client_id": "ivan", "post_ref": "7483883271928410114", "author_name": "Braden Ricchini", "published": "2026-07-17", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/braden-ricchini-1b5b64324_jordan-welsh-just-hit-138000month-with-activity-7483883271928410114-KEAC", "post_text": "Jordan Welsh just hit $138,000/month with just 2,000 YT subs.\n\nI dug through HOURS of his content to reverse-engineer the system\n\nHe was at $138,000 a month with 2,000 subscribers.\n\nThat revenue came off his first four videos.\n\nHe launched it in the make-money space, where creators fizzle out left and right, and the small channel won anyway.\n\nWhat stood out:\n\nThe channel never chases broad views.\n\nEVERY video speaks to the exact person he can help and solves one specific problem for them.\n\nThat said… \n\nI packaged my breakdown into a video masterclass where I go over: \n\n• The micro-niche play (why 3K subs out-earns 1M+ in 2025)\n• His high-intent SEO video formula (rank for the terms your buyers actually search)\n• The exact \"raw content\" structure he uses → social proof intro, roadmap, value, mid-roll CTA, traffic driver\n• The adapt-or-die shift most creators are sleeping on\n\nI'm giving it away because 90% of people overcomplicate content-driven lead gen. If this saves you months, even better.\n\nTo get it:\n\n1. Connect with me (so I can DM you)\n2. Comment \"IDEAS\" below"}, {"n": 16, "client_id": "arch", "post_ref": "7496106405846974464", "author_name": "Michail Katkoff", "published": "2026-08-20", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/michailkatkoff_in-my-20s-i-moved-to-sf-today-i-would-activity-7496106405846974464-883Z", "post_text": "In my 20s, I moved to SF. Today, I would actually recommend a young and hungry (non-American) to consider London over Silicon Valley. 5 reason why…\n\n1. The city doesn’t close at 9pm. \n\nLondon has over 3,00 pubs. There’s nightlife. And night tube. In SF, restaurants start stacking chairs while you’re ordering.\n\n2. No BART trauma\n\nTube covers the city. You can literally go anywhere. BART takes you to Oakland (had 2nd most violent crimes in the US in my days) and back if you’re lucky.\n\n3. Europe is a £50 flight.\n\nFriday flight to Lisbon, Rome, or Athens (❤️). Cheaper than a Tahoe Airbnb and nobody there wants to tell you about their fundraise.. \n\n4. Getting sick isn’t a go fund me event.\n\nNHS is slow and creaky. It also doesn’t send you a $4,200 bill for a broken finger.\n\n5. It’s much easier to get in, legally too.\n\nGlobal Talent visa, no job offer needed, endorsed by a body that reads your work. High Potential Individual visa, which hands top-university grads two years just for having graduated. \n\nNet-net: London is more fun. More diverse. More interesting. More real. SF pays roughly 3x for the same job, and if you’re in AI it’s not close. \n\nIf I’d have to do it again, I’d do both. First London to cap off my twenties. Then SF to make my balance sheet.\n\n(I’m in London 6-10 times a year and it’s a stunning city every time in a different way)"}, {"n": 17, "client_id": "ivan", "post_ref": "7505984201037418496", "author_name": "Braden Ricchini", "published": "2026-09-16", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/braden-ricchini-1b5b64324_2-months-ago-i-stopped-writing-youtube-scripts-activity-7505984201037418496-peyy", "post_text": "2 months ago, I stopped writing YouTube scripts by hand.\n\nThen, we generated 100k views + 10 calls booked from 1 video:\n\nIt’s what happened after I rebuilt my YouTube workflow as a stack of 11 skills inside Claude Code.\n\n• ideation\n• titles\n• thumbnails\n• hooks\n• intros\n• scripts\n• mid-roll CTAs\n• end CTAs\n• SEO descriptions\n• tags.\n\nThis stack is what turns a raw AI draft → a VIRAL video that books calls.\n\n(we just used this to generate 100k views + 10 calls booked from ONE video)\n\nAnd they’re the exact 11 skills my team runs on every client video.\n\nDetails on how to get it are 👇"}, {"n": 18, "client_id": "arch", "post_ref": "7506622404358750208", "author_name": "Mark Austin", "published": "2026-09-18", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/mark-austin-4726b865_toys-toynews-toyindustry-activity-7506622404358750208-Hwtg", "post_text": "Jazwares, LLC partners with Sanrio, Inc. to expand Hello Kitty and Friends range to EMEA\n\nPlush toys, figures and more inspired by the beloved world of Hello Kitty and Friends will launch in Europe, the Middle East and Africa.\n\nJazwares has announced a licensing agreement with Sanrio, extending Jazwares’ successful Hello Kitty and Friends toy line to Europe, the Middle East and Africa (EMEA). The agreement will bring Sanrio’s beloved Hello Kitty and Friends characters to even more fans in the region through playful, imaginative products designed for kids and collectors.\n\nAvailable across key EMEA markets, the collection of trendy plush and figures, play sets, vehicles and seasonal items reimagines Hello Kitty alongside fan-favorite friends including Cinnamoroll, Kerokerokeroppi, Pompompurin, Tuxedosam, My Melody, Kuromi, Pochacco, Bad Badtz-Maru and Little Twin Stars.\n\n“Hello Kitty and Friends commands a truly multi-generational, global fanbase, cementing its place as one of the world’s most iconic franchises. With Sanrio’s exciting plans for 2026 and beyond, we are delighted to expand and further strengthen our partnership to include toy distribution rights across EMEA, where the property enjoys a highly engaged fanbase,” said Jonny Taylor, SVP EMEA and APAC. “We look forward to bringing our world class toy offering to consumers across the region for many years ahead.”\n\n“We are thrilled to partner with Jazwares to bring fans across EMEA its iconic, high-quality toys, from plush to play sets and beyond. This partnership strengthens our presence in the toy category while expanding the reach of Hello Kitty and Friends across the region,” added Silvia F., Chief Operating Officer, Sanrio – EMEA, India and Oceania Mr Men – Worldwide. “Sanrio is built on meaningful, long-lasting connections, and together we look forward to growing our fanbase and extending that special bond to generations to come.”\n\nOne of the world’s most famous icons, Hello Kitty, first debuted more than 50 years ago and remains a pop culture mainstay beloved by fans across generations. Capturing the brand’s core values of friendship, kindness and inclusivity, Jazwares’ Hello Kitty and Friends toy line embraces Sanrio’s signature kawaii style and the playful, colourful nature through a wide range of toys and collectibles. The expansion of Sanrio’s partnership with Jazwares builds on the success of the initial range of cross-category products first debuted in 2024 in North America and South Ame"}, {"n": 19, "client_id": "ivan", "post_ref": "7495804185825710081", "author_name": "Lara Acosta", "published": "2026-08-19", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/laraacostar_i-have-353701-followers-on-linkedin-this-activity-7495804185825710081-t-2w", "post_text": "I have 353,701 followers on LinkedIn. \n\nThis is the AI system I use to write viral content every single week (while growing my businesses). \n\nLet me show you how it works in 3 steps: \n\nIf you want to be in the top 1% in your niche, virality engineering is exactly how you do this. \n\n1. Data collection: understand exactly what topics, formats and angles work across LinkedIn. \n\n2. Content engineering: based on the data, and proven patterns engineer your hooks and writing to match the content that outperformed for other LinkedIn creators.\n\n3. Authority building: get crystal clear on what topic your audience is interested in the most and use it as the leading keyword(s) in your hooks and graphics. \n\nThis is the process I've used over the last 4 years.\nThe same process that's made me $3M+ on Linkedin. \n\nClients used to pay me thousands to do this for them, but I don't run a ghostwriting agency anymore... \n\nSo I put the entire process inside an AI tool instead. \n\nToday Kleo follows that exact same system. \n\nIt learns everything about you.\nIt builds you a personalised strategy.\nIt gives you a 30-day content plan.\n\nAll in minutes rather than weeks. \n\nThis system works. Thousands of entrepreneurs and creators are going viral with Kleo today. \n\nIf you want to be our next viral personal brand...\nTry kleo here: https://kleo.so/offer\n\nNew yearly users get access to our $2500 coaching programme + weekly calls and resources. \n\nYou in?\n\nRepost ♻️ if this was valuable to you\n\nPS: I used to do this process manually for years, I used to spend 2 hours a day writing my own content... what about you? Curious to know, maybe I was too slow..."}, {"n": 20, "client_id": "ivan", "post_ref": "7428124551877722112", "author_name": "Mateja Gutesa", "published": "2026-02-13", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/matejagutesa_guy-made-one-tweak-to-his-messaging-booked-activity-7428124551877722112-fGVE", "post_text": "Guy made one tweak to his messaging.\n\nBooked 2 calls on a Friday.\n\nNo VSL. No ads. No complex funnel.\n\nJust better messaging.\n\nSmall changes. Big results.\n\nBook a call if you want to find out how:\n\nhttps://lnkd.in/eSEVF5Je"}, {"n": 21, "client_id": "arch", "post_ref": "7489945667776442368", "author_name": "James Hacking", "published": "2026-08-03", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/james-hacking_after-37-years-im-leaving-the-uk-activity-7489945667776442368-Zbfw", "post_text": "After 37 years, I’m leaving the UK 🇬🇧 \n\nNearly 10 years ago, I started Socially Powerful sitting in my pants, buying a domain name and hoping I’d finally found something that worked.\n\nI’d already lost more than £500,000 of my own money on a previous business.\n\nMy expectations weren’t exactly high 😂\n\nI thought it would be a few mates and me riding the wave for as long as it lasted.\n\nFast-forward to today:\n\n200 people.\nThree global offices, soon to be four.\nAnd partnerships with some of the world's biggest brands.\n\nI’d always wanted to live and work overseas.\n\nBut with two boys and a settled life in London, I thought that opportunity had passed me by.\n\nThen this business created an opportunity I couldn’t ignore.\n\nSo we’re packing up our lives and starting a completely new adventure.\n\nA new home for my family.\nA new office for Socially Powerful.\nAnd a huge opportunity to take the business even further.\n\nWhere are we going?\n\nAll will be revealed soon.\n\nLet’s just say September might be a bit warm… ☀️"}, {"n": 22, "client_id": "arch", "post_ref": "7496476112865386496", "author_name": "Felix Braberg", "published": "2026-08-21", "post_type": "text", "image_count": 0, "source_url": "https://www.linkedin.com/posts/felix-braberg-7a732b51_how-much-iap-revenue-is-currently-generated-activity-7496476112865386496-T8QO", "post_text": "How much IAP revenue is currently generated outside the Play Store and App Store?\n\nThere's been a lot of talk about mobile gaming revenue growth slowing down. One issue is that at every conference I go to, all major gaming companies are anecdotally doing better than ever. \n\nThe issue is that more and more mobile gaming revenue is currently being transacted outside of the app stores, which goes unreported by both Apple and Google. \n\nAs a thought and market-sizing exercise, we posed this question to Chip Thurston at FastSpring, which helped us break this down into an estimate. \n\nApple recently released that 2025 App Store gaming revenue came in at $52.5 billion. Based on the latest FastSpring D2C survey, we estimate that, on average, 59% of gaming companies now have webstores that drive 15% of revenue outside the app stores. \n\nEventually, our estimate came in at between $10-14 billion worth of mobile gaming revenue being conducted outside of the app stores in 2025!\n\nWhat do you think? \n\nWe have the full estimate logic breakdown in our latest two & a half gamers episode with FastSpring. \n\nLink below 👇 \n\nJakub Remiar & Matej 🦩 Lancaric"}, {"n": 23, "client_id": "risedtc", "post_ref": "7480644402843926529", "author_name": "Codywittick", "published": "2026-07-08", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/codywittick_i-got-taken-to-a-300-omakase-dinner-last-activity-7480644402843926529-uwW2", "post_text": "I got taken to a $300 omakase dinner last Tuesday.\n\nI didn't pay for it.\n\nA sales rep from an attribution platform paid for it.\n\nHe's been trying to get us to switch from a competitor for 6 months.\n\nWe're not switching.\n\nBut I told him we're \"evaluating.\"\nThat phrase means absolutely nothing.\n\nBut in DTC SaaS sales, it's the equivalent of ringing a dinner bell.\nHe asks about our onboarding timeline.\n\nI stare at my second monitor, exhale slowly, and mention server-side tracking conflicts with our CDP.\n\nWe don't have a CDP.\n\nHe furiously takes notes and offers to loop in a solutions engineer.\n\nAn influencer discovery tool sent me a branded Yeti tumbler and a handwritten note last month.\n\nI told them we were \"testing a competitor's database to benchmark creator quality.\"\n\nI haven't logged into either platform.\n\nLast week a reporting dashboard rep took two of our team members to lunch.\n\nWe build our reports in Google Sheets.\n\nNext month I have a demo with an AI creative testing tool that just closed a $25M Series A.\n\nI'm going to let them buy me lunch.\n\nThen I'm going to tell them our creative pipeline has too many integration dependencies and we can't commit until Q3.\n\nDTC is just a vast ecosystem of free meals and branded merch if you know how to say \"we're still evaluating\" with a straight face."}, {"n": 24, "client_id": "arch", "post_ref": "7431763751353319426", "author_name": "Logan Burdick", "published": "2026-02-23", "post_type": "article", "image_count": 0, "source_url": "https://www.linkedin.com/posts/loganburdick_date-everything-interview-robbie-daymond-activity-7431763751353319426-nwSH", "post_text": "“We’re excited to expand 𝘋𝘢𝘵𝘦 𝘌𝘷𝘦𝘳𝘺𝘵𝘩𝘪𝘯𝘨! beyond games and bring the IP into other entertainment media.”\n\nGreat conversation with our CEO and Sassy Chap Games co-founder Robbie Daymond about what's next for the company following our recent signing with Creative Artists Agency.\n\nThe success of 𝘋𝘢𝘵𝘦 𝘌𝘷𝘦𝘳𝘺𝘵𝘩𝘪𝘯𝘨! continues to reinforce our thesis that when games are built creator-first and audience-aware, they don’t just launch: 𝘵𝘩𝘦𝘺 𝘳𝘦𝘴𝘰𝘯𝘢𝘵𝘦. And that resonance is when a game transcends being solely a game, and evolves into a community-powered IP with legitimate franchise potential.\n\nWe’ve recently seen how powerful that dynamic can be. Projects like Markiplier's 𝘐𝘳𝘰𝘯 𝘓𝘶𝘯𝘨  underscore a growing reality: when a game title is spearheaded by a passionate creator utilizing the core tenets of the creator economy, its IP often proves uniquely adaptable across other media.\n\nWith CAA’s partnership, we're excited to explore how 𝘋𝘢𝘵𝘦 𝘌𝘷𝘦𝘳𝘺𝘵𝘩𝘪𝘯𝘨! — and our growing slate of future titles — can live across linear media, consumer products, and new interactive experiences, building an ecosystem where brands, creators, and audiences evolve together.\n\nAppreciate TheGamer for this thoughtful interview and the chance to share more about what we're building here at Sassy Chap.\n\n#CreatorEconomy #IndieGameDev #GameDev"}, {"n": 25, "client_id": "ivan", "post_ref": "7436839839238344707", "author_name": "Allie K. Miller", "published": "2026-03-09", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/alliekmiller_every-single-claude-code-conversation-turn-activity-7436839839238344707-kqJz", "post_text": "Every single Claude Code conversation turn should end with it offering to do even more for you.\n\nIt should be so proactive and helpful that you cry with joy at how productive it is making you.\n\nAdd this to your global CLAUDE.md file ⬇️\n\n---------------------------------------------------\n\n# Task Endings - \"What Else Can I Handle?\"\n\nAfter completing any big task, end with a \"Let me take more off your plate\" section with three categories:\n\n1. Next actions I can do right now — specific follow-ups I can knock out immediately\n2. Automations or systems I can set up — so you never have to do it manually again\n3. Things to delegate to your team — draft messages for <insert team members>\n\n3-5 bullet points max, no fluff, goal is you walk away feeling lighter."}, {"n": 26, "client_id": "arch", "post_ref": "7476174469351325696", "author_name": "Viktor Ryzhov", "published": "2026-06-26", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/viktor-ryzhov_zorkaagency-gaming-zorkaagency-activity-7476174469351325696-cReo", "post_text": "❗️A quick note on a big decision. \nFor years #ZorkaAgency was known as an influencer marketing agency – and a good one. For E-Com, FinTech, Health&Beauty and other verticals. But let's be honest – #gaming was always where we belonged. It's where our best work happened, where our instincts are sharpest, where we've had the most fun.\n\n➡️ So we decided to lean all the way in: #ZorkaAgency is now a #gaming-only #influencermarketing agency ⬅️ \n\nWe're not changing what we're great at – we're pointing all of it at one industry we genuinely live and breathe.\n \nYou'll see it everywhere now including our new site, which we rebuilt to say exactly that. It's sharper, it's clearer, and it speaks to one audience: the people building games. \n\nIf you're scaling a game and want a partner who speaks your language natively, we'd love to talk 🖐️"}, {"n": 27, "client_id": "ivan", "post_ref": "7404512750070099970", "author_name": "Pascal Bornet", "published": "2025-12-10", "post_type": "article", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_gleanambassador-aitransformation-leadership-activity-7404512750070099970-Kwxe", "post_text": "Yesterday I had one of those rare conversations that stays with you.\n\nI sat down with Dr. Rebecca Hinds, PhD from Glean to unpack her new research, The AI Transformation 100, and it completely reframed how I think about AI in organizations.\n\nIn the article I just published, I share the insights that hit me hardest —\nbecause they match exactly what I see with executives and teams every day.\n\nHere’s what you’ll learn:\n🔸80% of AI transformation is just… transformation.\nThe same human issues, politics, and leadership gaps — simply amplified by AI.\n🔸AI is a megaphone. Healthy cultures accelerate. Broken workflows break faster. Rebecca’s data makes this painfully clear.\n🔸Leadership behavior is the biggest adoption driver. If leaders don’t use AI themselves, their teams won’t either.\n🔸100 practical ideas from 100+ leaders.\n\nNot hype — real moves happening right now.\n\nThis is one of the most grounded and useful reports I’ve come across.\n\nThe AI Transformation 100 releases today and I strongly encourage every business leader to read it. Access the full report and join the conversation:\nhttps://lnkd.in/e7YYwBrt\n\nAnd if you want the deeper story, don’t miss my full interview with Rebecca — you’ll want to watch it to the end: https://lnkd.in/egsdhVaA\n\n#GleanAmbassador #AITransformation #Leadership #ArtificialIntelligence\n#DigitalTransformation #ChangeManagement #FutureOfWork #BusinessStrategy #Innovation"}, {"n": 28, "client_id": "ivan", "post_ref": "7474799010453639168", "author_name": "Timi Merivirta", "published": "2026-06-22", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/timimerivirta_stop-using-claude-to-write-your-linkedin-activity-7474799010453639168-kGeO", "post_text": "STOP using Claude to write your LinkedIn posts.\n\nThat's the least valuable thing it can do ↓\n\nMost people use Claude to write their posts.\n\nThat's just 1% of what Claude can do.\n\nLast month we booked 34 qualified calls using Claude inside the LinkedIn workflow.\n\nHere's what the system actually does:\n\n1. Finds leads already showing buying signals, not cold scraped lists with zero context\n\n2. Writes DMs with Claude that read like a human wrote them, not a template\n\n3. Turns 1-2% cold reply rates into 25-40% warm ones by matching the message to the moment\n\n4. Books the meeting in under 30 words, no 3,000-word pitch\n\n5. Optimizes your profile, so it actually converts\n\nI put the whole thing into one playbook:\n\n→ The exact 3 DM scripts we use to book calls (copy-paste)\n→ The Claude prompts that writes posts like a human\n→ How to set up your profile so it actually converts\n→ The 4-week plan to go from 0 to 30+ calls a month\n\nWant it?\n\nComment \"CLAUDE\" and I'll send the full playbook over.\n\n♻️ Repost to help any founder still doing this by hand.\n\nPS - We've done this across 40+ industries. Yours is probably already on the list."}, {"n": 29, "client_id": "risedtc", "post_ref": "7485357995204358144", "author_name": "Sanocki", "published": "2026-07-21", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/sanocki_for-years-full-funnel-programmatic-direct-activity-7485357995204358144-jiGQ", "post_text": "For years, full-funnel programmatic direct mail on PostPilot meant you were on Shopify. \n\nNot anymore.\n\nStarting today, brands on any commerce platform can run it. Prospecting, retargeting, retention, the whole thing.\n\nWe built \"Meta and Klaviyo for mail\" for Shopify brands, and AcquisitionAI made that real this year. We're not slowing down on Shopify for a second. But there's a whole world of commerce outside it, demand for non-Shopify support went vertical this year, and we're giving people what they've been asking for.\n\nEveryone gets to print money now. Full announcement on the blog: https://lnkd.in/eCkPyqfA"}, {"n": 30, "client_id": "ivan", "post_ref": "7498338899241517056", "author_name": "Soheil Saeidmehr", "published": "2026-08-26", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/soheil-saeidmehr_the-top-gtm-engineer-roles-now-pay-250k-activity-7498338899241517056-oEgd", "post_text": "The top GTM engineer roles now pay $250K. Anthropic, Vercel and OpenAI have all hired one.\n\nWe've hired more than 30 GTMEs at ColdIQ so far, and there are currently over 3,000 roles are open right now.\n\n\nHere is what the job actually is:\n\nThe Go To Market Engineer owns the whole outbound machine.\n\n- The list, the enrichment and the signals\n- Deliverability and the inbox pool\n- The copy, the sequences and the agents running them\n\n\nHere are the four plays I watch them run every week 👇\n\n1. 🌍 TAM mapping\n\nBefore a campaign launches, the market becomes accounts and contacts.\n\nWe use GetLeads for that. The costs are at a flat rate, so nobody rations credits.\n\n\n2. 🎁 Give before you ask\n\nEvery campaign we've run sits in one repository.\n\nOur ColdIQ MCP pulls the ones that worked on the prospect's exact ICP.\n\nSo, they get a niche list and campaign ideas to run this week.\n\nWhat you give away proves you can do the work!\n\n\n3. 🤖 Campaigns that learn\n\nThe agent runs the loop instead of the GTME.\n\nIt picks the segment that works.\n\nThen it enriches with Vibe Prospecting in Claude Code.\n\nIt writes the copy, pushes it to Instantly.ai, reads the replies and starts over.\n\n\n4. 🎥 Context mining\n\nEvery call we record in Claap tells us why they bought, and why not.\n\nThose become the first line (aka the \"Hook\") of the next email.\n\n\nUsing a capable GTM Engineer, you would be saving money.\n\nA team of SDRs would cost about $28k a month. One GTM engineer with this stack costs about $6k-$10k depending on expertise.\n\nAnd the tools drop from $7k to $3k.\n\nBoth book 20 to 40 meetings a month.\n\n-----\nThe rest is on the sheet. Let me know in the comments if you want it in HD."}, {"n": 31, "client_id": "ivan", "post_ref": "7488564361578475520", "author_name": "Lara Acosta", "published": "2026-07-30", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/laraacostar_i-spent-the-last-30-days-breaking-down-how-activity-7488564361578475520-kO6M", "post_text": "I spent the last 30 days breaking down how to build a $10k/mo content system on LinkedIn.\n\nHere's the strategy you need that works (for any niche):\n\n1. Find a profitable niche using this formula:\n\n- Skill: What you are good at doing \n- Market: The people who need it most and fast\n- Problem: The painful problem your skill solves\n- Value: The content you'll make based on the above\n\nThis is how you become undeniable on LinkedIn.\n\nBy getting clear on the exact problem you solve.\nAnd how to talk about it in your content.\n\n2. Write for all three audience tiers\n\n- Diehards: Those who always engage with you\n- Drive-bys: Those who've seen your content sometimes\n- Drop-ins: Those who have 0 context on who you are\n\nThe key here is to optimize your content for the \"drop-ins\" - but most optimize for the \"die hards\".\n\nA quick tip: Think about every post as a re-introduction.\n\nYour hook should state either a result or proof you've done what you're about to educate them on. \n\nDon't say: \"How to grow your business\"\nSay: This system got 1,238+ new leads using email. \n\n3. Build every post on the 5 P's\n\n- Problem: name it better than your audience can\n- Promise: show the transformation clearly\n- Proof: back it with results and real stories\n- Personality: let your tone do the selling\n- Perspective: own the insight only you can give\n\n4. Four lead-generation posts (that work every time)\n\n- Celebrate a client win (for proof)\n- Turn a framework into a lead magnet (for free leads)\n- Show a before and after with real numbers (relatability)\n- Use a story to then talk about your offer (story-selling)\n\nBonus tip: Collect transcripts from calls with leads, upload them to Kleo and let it write your next post based on specific pain points your ideal clients have. \n\nMost people on LinkedIn are posting consistently.\nBut without a strategy to generate results.\n\nAnd I'm tired of it, so I just shared my playbook with you. \n\nSave this post for later, repost ♻️ it if it was useful! \n\nP.S: Have you noticed when posts have a specific outcome, like a number or a timeline - the posts do better? Exactly what I'm saying! \n—\nWant me to build this strategy for you live using AI? RSVP for my next live event here https://app.kleo.so/3\n\n (Attendees for my last one got leads within 24hrs!)"}, {"n": 32, "client_id": "risedtc", "post_ref": "7467239356584456194", "author_name": "Simon Solis Cohen", "published": "2026-06-01", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/simon-solis-cohen_big-news-huxley-is-making-a-massive-strategic-activity-7467239356584456194-kpHJ", "post_text": "📣 BIG NEWS: Huxley is making a massive strategic pivot. We’re dropping Energy Drink from our packaging. As of this July, Huxley will be relaunched as an Energy Refresher.\n\nSince our inception, we’ve been defensive and now it’s time to go on offense. Let’s face it, “energy drink” carries a stigma and for 2 years we’ve been fighting it, explaining why Huxley isn’t like all those other energy drinks. We can now shed that stigma and lean into what we really are.\n\nI came up with this idea last month walking past a Starbucks. They had a big sign advertising their new Energy Refreshers. I went home to do research and found every major QSR chain has launched their own version. Dunkin’ launched theirs last year, McDonald’s launched in May, Panera has them, Taco Bell has them, and the list keeps growing.\n\nSo what exactly is an Energy Refresher? It’s a moderately caffeinated, colorful drink made with real fruit juice and natural caffeine, served still or lightly fizzed. A refreshing alternative to coffee and less extreme than an energy drink.\n\nThis perfectly describes what Huxley already is.\n\nAnd it makes sense when you look at what’s in our can. Real fruit juice. Light fizz. Electrolytes for hydration. Every element is built around the feeling of refreshment, which is why Energy Refresher is the perfect framing for what we’ve been making all along.\n\nHere is the most staggering reason why I’m making this pivot: Energy Refreshers are a MULTI-BILLION dollar category in QSRs and a $0 category in grocery. These chains are spending millions educating consumers on Energy Refreshers for us. I saw a McDonald’s commercial for them this weekend alone.\n\nHuxley will be the first RTD Energy Refresher on the grocery shelf, and I expect many more brands to follow. This is the natural evolution of the energy category. The energy set will contain the legacy brands that sell adrenaline in a can, the “clean” energy brands that market health while still using artificial ingredients, and then Energy Refreshers. All three waves can and will coexist.\n\nTo be clear, we’re not changing anything about what’s in the can. We’re repositioning it. At its core, Huxley has always been an Energy Refresher. I just never had the language for it until now.\n\nWe’re excited to bring this evolution to our fans and retailer partners. New cans are coming in July!"}, {"n": 33, "client_id": "arch", "post_ref": "7485025050451030016", "author_name": "Andy Lunique", "published": "2026-07-20", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/andy-lunique-a0524920_to-the-many-dev-and-pr-teams-launching-games-activity-7485025050451030016-pNOG", "post_text": "To the many dev and PR teams launching games in the next few months, please remember the basics matter when it comes to creators. \n\nI want to give a special shout-out to Rick Lagnese 🔜 Gamescom and Refractive Entertainment. I'm looking at the press kit for \"Luminary\" and, simply put, very well done. Despite the size of your team, having this available for creators at a click is 100% the way to go. \n\nTalking points, access request, assets, and contact email all in one spot, and not too heavy of a lift for web. This is what most creators or managers need to get started, and it makes them more likely to choose your game over others. GG. This is standard to some, but missing from SO many devs. \n\nhttps://lnkd.in/e5YZqd2Z"}, {"n": 34, "client_id": "ivan", "post_ref": "7468659334034386944", "author_name": "Monika Grycz", "published": "2026-06-05", "post_type": "post", "image_count": null, "source_url": "https://www.linkedin.com/posts/grycz-monika_workflow-agents-37mo-vs-co-pilot-agents-activity-7468659334034386944-CnOZ", "post_text": "Workflow agents ($37/mo) vs Co-pilot agents ($49/mo) vs Autonomous agents ($250/mo).\n\nSame job, wildly different price. And most teams still can't tell which one they're actually buying.\n\nHere's every tool, sorted by what it actually does.\n\n1. Workflow agents\n\nYou design the path. The agent runs it on rails.\n\n→ Relevance AI\n\nBuild a custom agent in plain English, connect it to your data, and it runs the chain you defined.\n\nTheir AI BDR Bosh researches accounts and drafts outreach, but the platform handles any GTM agent you can describe.\n\n→ Clay\n\nWhere most of our workflows live.\n\nYou design the table and the logic. It runs enrichment, scoring, and research across 150+ providers, every row, every time.\n\n→ n8n\n\nFor the technical teams.\n\nYou wire the nodes once and it runs the automation across your whole stack on autopilot.\n\nThese break the moment something unexpected hits. Best when you already know what works and want to scale it.\n\n2. Co-pilot agents\n\nThe agent works beside the rep, not instead of them.\n\n→ Nooks\n\nHand it a task in plain English: \"build me a strategy for booking RevOps leaders this month.\"\n\nIt analyzes your pipeline, past calls, and CRM, then returns drafted sequences and prioritized accounts. You review and ship.\n\nTheir own team more than doubled email pipeline after rolling it out.\n\n→ Apollo.io\n\nApollo AI sits next to the rep for research, email drafting, and message rephrasing.\n\nYou keep the judgment. It removes the busywork.\n\nYou own the call. The agent owns the prep.\n\n3. Autonomous agents\n\nYou give the goal. The agent owns the execution.\n\n→ Artisan's Ava 2.0\n\nOne instruction: \"book meetings with mid-market RevOps leaders.\"\n\nShe sources from 300M+ contacts, enriches across 15+ providers, writes per-lead emails using funding and hiring signals, then sends, books, and self-optimizes.\n\nJust dropped to $250/month, 10x cheaper than before.\n\n→ Instantly.ai AI Sales Agent\n\nPoint it at a URL and it builds the outbound motion from there, with the deliverability moat Instantly is known for underneath.\n\nPowerful, but only as good as the ICP and brief you set. No strategy in, wrong people out.\n\nThat's the full map of who's running outbound in 2026.\n\n→ Workflow agents for known paths\n→ Co-pilots for context-heavy work\n→ Autonomous agents for the full execution\n\nThe teams winning aren't picking one. They're running all 3, each on the slice it fits.\n\nHumans set the strategy. Agents handle the execution.\n\nWhat tool did I overlook?"}, {"n": 35, "client_id": "arch", "post_ref": "7486122213851648001", "author_name": "Rohan Farquhar", "published": "2026-07-23", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/rohan-farquhar-21a154244_a-massive-creator-millions-of-followers-activity-7486122213851648001-BiEa", "post_text": "A massive creator. Millions of followers. A polished ad. 💸\n\nMost founders picture influencer marketing like this\n\nThe reality of our best-performing campaigns looks nothing like that.\n\nThis campaign ran on Instagram.\nOne creator. Smaller following than you'd expect.\nOne post. No production budget. No celebrity.\n\n150,000+ views and impressions.\nHundreds of genuine comments from real users engaging with the product.\n\n2597 sign-ups! (Tracked using UTM link)\n\nResults that the client could actually point to.\n\nThe gap between what teams think this looks like and what actually works is where most influencer marketing budgets get wasted.\n\nBig doesn't mean effective.\nPolished doesn't mean trusted.\nExpensive doesn't mean results. 🎯\n\nThe best campaigns we run look effortless because the right creator is talking to the right audience, about the right product, and doesn't need to try hard."}, {"n": 36, "client_id": "ivan", "post_ref": "7399779206701871104", "author_name": "Ruben Hassid", "published": "2025-11-27", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/ruben-hassid_so-ai-went-from-this-left-to-this-right-activity-7399779206701871104-wNf5", "post_text": "So AI went from this (left) to this (right) in 3 months.\n\nAnd you still think you can tell \"AI or not\"?\n\n✦ Left: the Nano-Banana model, from August 2025.\n✦ Right: same prompt, with the November model.\n\n3 months apart. \n\nAnd this new AI is already indistinguishable.\n\nHow to (best) use the new nano banana pro: \n\n1. Go to Gemini. \n2. Click “Tools” and then “create images.” \n3. Make sure it's on \"Thinking\" (bottom left).\n4. Use this prompt guide: https://lnkd.in/dqKd-qGM.\n\nReminder: that's the worst AI will ever be."}, {"n": 37, "client_id": "arch", "post_ref": "7447928632528007168", "author_name": "Viktor Ryzhov", "published": "2026-04-09", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/viktor-ryzhov_welcome-to-the-30s-club-we-spend-years-activity-7447928632528007168-rWXf", "post_text": "Welcome to the “30s club” 😂\n\nWe spend years here mastering work: strategy, growth, leadership, results.\nBut your home, your people, your everyday life… that’s not a side quest. That’s the real system you’re running. And honestly, often the harder one.\n\nWhen things are good at home, work feels easier and moves faster.\nAnd when work is stable, it’s much easier to handle everything else in life. True story.\n\nSo just a small reminder: take care of your people, support each other, and don’t forget there’s life beyond the screen."}, {"n": 38, "client_id": "risedtc", "post_ref": "7448017428615200768", "author_name": "Jasonbolt", "published": "2026-04-09", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/jasonbolt_buildbetter-reclaimyourframes-milestoneaward-activity-7448017428615200768-zNDF", "post_text": "1,000,000 orders through Shopify is an incredible milestone for Revant.\n\nThat number represents years of hard work, a team that kept showing up, customers who believed in us, and the steady work of building something real from the ground up over time.\n\nAs a manufacturer in Portland, this one means even more to me. It is a reminder that you can still build products here, create jobs here, and grow a brand that reaches customers all over the world.\n\nI’m proud of what our team has built and deeply grateful to everyone who has been part of the journey!"}, {"n": 39, "client_id": "arch", "post_ref": "7466116217897107456", "author_name": "Wiktoria Wójcik", "published": "2026-05-29", "post_type": "article", "image_count": 0, "source_url": "https://www.linkedin.com/posts/vikivojcik_gamingmarketing-livestreaming-brandstrategy-activity-7466116217897107456-_2LV", "post_text": "The average Twitch viewer spends 95 minutes on the platform per day. \nYet most brands still brief gaming campaigns in 6, 15, and 30-second formats. The math stopped working a long time ago.👇\n\nIn my latest newsletter, I break down what changes when the ad canvas is 90 minutes instead of 30 seconds.\n\n💡 Completion follows commitment: Akamai data shows mid-roll ads complete at 97%, pre-roll at 74%, post-roll at 45%. The deeper the viewer is in, the lower the chance they leave.\n\n💡 5 seconds to convince a skipper: Skippable pre-roll completion drops to 10-15% when the hook fails (MNTN). On stream, there's no skip button.\n\n💡 Brand presence, not interruption: Three inStreamly campaigns where the ad reacted to gameplay in real time — Danio, Snickers, and Knorr x Żabka, where viewers spammed Knorr emotes to remind streamers to trigger the sponsorship.\n\nPlus: Eleven All Stars filling Parc des Princes, Twitch opening monetization to all streamers globally, and the Esports World Cup moving to Paris.\n\n👉 POV FOR MARKETERS: If your gaming strategy starts with a list of deliverables inherited from TV, you're designing advertising for a room nobody's sitting in.\n\nRead the full edition below & subscribe if you haven't yet :)\n\n#GamingMarketing #LiveStreaming #BrandStrategy #CreatorEconomy"}, {"n": 40, "client_id": "risedtc", "post_ref": "7494709562609029120", "author_name": "Oli Mabane", "published": "2026-08-16", "post_type": "text", "image_count": null, "source_url": "https://www.linkedin.com/posts/oli-mabane_spend-less-time-creating-marketing-spend-activity-7494709562609029120-HBWd", "post_text": "\"Spend less time creating marketing.\n\nSpend more time understanding the people you're marketing to.\"\n\nThat's the biggest lesson I took from Sabri Suby\n \n\nResearch is the competitive advantage."}, {"n": 41, "client_id": "risedtc", "post_ref": "7483486848242319360", "author_name": "Ryan Trevis", "published": "2026-07-16", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/ryan-trevis_the-best-result-weve-ever-got-for-a-client-activity-7483486848242319360-Vuyb", "post_text": "The best result we've ever got for a client came from one hour of filming.\n\nWe went out in Manchester. Ryan, one of my guys back in the UK, spoke to around ten people. That was it. One hour.\n\nWe cut five ads from that footage.\n\n$164K in the first thirty days the ads were live.\n\nOne hour of filming. Ten strangers. Five ads. $164K.\n\nThat's the whole case for street interviews. Not the production. Not the budget. Real people saying real things, and the format built around it to make it convert.\n\nIf you're running this style of ad already, you're welcome.\n\nIf you want it done properly, DM me."}, {"n": 42, "client_id": "ivan", "post_ref": "7424791847996338176", "author_name": "Zain Kahn", "published": "2026-02-04", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/zainkahn_mit-quietly-released-its-entire-ai-library-activity-7424791847996338176-Plgw", "post_text": "🚨 MIT quietly released its entire AI library — completely free.\n\nI went through these and was surprised how much better they are than most paid courses.\n\nSharing more practical, no-fluff AI resources with 150K+ engineers here: https://lnkd.in/e64Jvdrt\n\nHere's the full list of books:\n\n𝗙𝗼𝘂𝗻𝗱𝗮𝘁𝗶𝗼𝗻𝘀\n\n1. Foundations of Machine Learning\nCore algorithms explained. Theory meets practice.\nhttps://lnkd.in/dHtqbQMH\n\n2. Understanding Deep Learning\nNeural networks demystified. Visual explanations included.\nhttps://lnkd.in/dDPkqd7g\n\n3. Machine Learning Systems\nProduction-ready architecture. System design principles.\nhttps://lnkd.in/dkiGZisg\n\n𝗔𝗱𝘃𝗮𝗻𝗰𝗲𝗱 𝗧𝗲𝗰𝗵𝗻𝗶𝗾𝘂𝗲𝘀\n\n4. Algorithms for ML\nComputational thinking simplified. Decision-making frameworks.\nhttps://algorithmsbook.com\n\n5. Deep Learning\nThe definitive textbook. Covers everything deeply.\nhttps://lnkd.in/dHp5PgPS\n\n𝗥𝗲𝗶𝗻𝗳𝗼𝗿𝗰𝗲𝗺𝗲𝗻𝘁 𝗟𝗲𝗮𝗿𝗻𝗶𝗻𝗴\n\n6. RL Basics (Sutton & Barto)\nThe classic. Agent training fundamentals.\nhttps://lnkd.in/dH9ap59P\n\n7. Distributional RL\nBeyond expected rewards. Advanced theory.\nhttps://lnkd.in/d4eNP-pe\n\n8. Multi-Agent Systems\nAgents working together. Coordination and competition.\nhttps://marl-book.com\n\n9. Long Game AI\nStrategic agent design. Future-focused thinking.\nhttps://lnkd.in/dpc6a3-6\n\n𝗘𝘁𝗵𝗶𝗰𝘀 & 𝗣𝗿𝗼𝗯𝗮𝗯𝗶𝗹𝗶𝘁𝘆\n\n10. Fairness in ML\nBias detection. Responsible AI practices.\nhttps://fairmlbook.org\n\n11. Probabilistic ML (Part 1)\nhttps://lnkd.in/dB-ZnwaH\n\n12. Probabilistic ML (Part 2)\nhttps://lnkd.in/dBmnsv_9\n\nMost people pay thousands for bootcamps that teach half of this.\n\nSave it and start wherever you’re curious."}, {"n": 43, "client_id": "arch", "post_ref": "7462915209893072896", "author_name": "Marion Balinoff", "published": "2026-05-20", "post_type": "image", "image_count": 1, "source_url": "https://www.linkedin.com/posts/marion-balinoff_las-vegas-hotels-are-something-else-ive-activity-7462915209893072896-0gcD", "post_text": "Las Vegas hotels are something else.\n\nI've travelled enough to know my way around most places, but this one genuinely required asking for directions just to find the elevators. That's a first.\n\nAnyway, once you're poolside with this crowd, none of that matters. The Google networking party last night was a great start to MAU Vegas! Good conversations, warm weather, and exactly the kind of energy you want heading into two days of talks.\n\nOnly question: Matej 🦩 Lancaric and Michal Bubernik where were you? We missed you!\n\nDay 1 down. More to come."}, {"n": 44, "client_id": "risedtc", "post_ref": "7503603316971667456", "author_name": "Christophermarrano", "published": "2026-09-10", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/christophermarrano_media-attachment-activity-7503603316971667456-pGCy", "post_text": "You raised the budget 20% on your best campaign and nothing changed.\n\nHere is the rule everybody repeats. Cost per purchase under target, bump the budget 20%. That works on auto bid, because the budget is the thing holding it back. On a bid cap campaign it is not. Meta only spends when it can win an auction at your cap, so raising the budget just raises a ceiling it was never touching.\n\nLook at one account, last week. Bid cap campaign, $2,000 a day budget, spent $3,156 across seven days. That is $451 a day, 23% of what it was allowed. The catalog campaign right next to it, also $2,000 a day, spent $2,742. That is 20%.\n\nThen the auto bid ad set in the same account. $553 a day budget, spent $3,804 in the same seven days. That is 98%.\n\nSame account, same week. One is limited by budget. Two are limited by the cap.\n\nSo check which one you are running. Campaigns tab, customize your columns, put Budget next to Amount Spent, and divide the daily spend by the budget.\n\nUnder 50% on a bid cap, the budget is not your lever. Raise the cap 10 to 20%, one step, and wait three to five days.\n\nOver 90% on auto bid, the budget is the lever, and the 20% rule works every single time.\n\nRead the utilization first.\n\n#metaads #ecommerce #paidsocial #bidcap #dtc"}, {"n": 45, "client_id": "risedtc", "post_ref": "7470089844514390017", "author_name": "Gavintrippe", "published": "2026-06-09", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/gavintrippe_theres-a-customer-on-your-file-who-buys-activity-7470089844514390017-qWpR", "post_text": "There's a customer on your file who buys from you exactly once a year the week before Christmas, but your retention campaign is running ads to them in March. They’re obviously not going to convert, you'll spend $400 on useless impressions, and they’re just one of thousands like them on your list.\n\nThat's what happens when you treat your customer file as one audience when, actually, it's a mix of cohorts: the Christmas-only buyer, the flash-sale ghost who's been gone two years, the 90-day repeat, the whale on a six-week cycle. They buy on different schedules, and Meta has no way to tell them apart.\n\nMost agencies upload the whole file to Meta, run a conversion campaign, and wait for sales. When ROAS keeps dropping, they blame the algorithm. The algorithm is doing what you asked. You gave it 200,000 names and told it to find the live ones. It will. But it's expensive work, and your Shopify data could have done most of it already.\n\nThe fix is cohorting your file using recency, frequency, and monetary value. Identify the 20,000 customers showing high probability-to-buy behavior in the next four weeks. Feed that cohort to Meta. Let the algorithm work against a real audience.\n\nYour customer file is the most underused asset ecom brands have. Most of it should never have been uploaded in the first place."}, {"n": 46, "client_id": "ivan", "post_ref": "7501578099629760514", "author_name": "Alex Vacca", "published": "2026-09-04", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/alex-vacca_last-week-salesforce-gave-up-the-interface-activity-7501578099629760514-ZYfc", "post_text": "Last week Salesforce gave up the interface people pay to log into.\n \nBest trading day for their stock since 2020.\n \nMarc Benioff had spent the whole spring calling the SaaS apocalypse nonsense. On the earnings call on August 26 he said it again, time for it to stop. A few hours later he was on CNBC next to Dario Amodei announcing Claudeforce, Salesforce's deal with Anthropic.\n \nClaude becomes the default brain of Slack, of Agentforce, and of Salesforce's own engineers, who move to Claude Code. 37 sales skills ship inside Claude in September.\nAnd Headless 360, the whole CRM usable from Claude, from WhatsApp, or from a terminal, without opening a Salesforce screen.\n \nThe whole SaaS apocalypse was about: if agents do the work, nobody opens the app. If nobody opens the app, nobody pays for the seat.\n \nBenioff's answer is to agree. Fine, the agent doesn't log in. But the agent still has to reach the customer data, and it still has to ask who is allowed to do what.\n \nSalesforce keeps that. An agent coming from Claude, from Slack, or from WhatsApp passes through it.\n \nHe agreed to die as the counter you walk up to, so he could survive as the toll every agent pays on the way to the data. People paid to use the app. Agents pay to reach the data.\n \nHe already owned Slack, the place the work gets talked about, bought in 2021 for $27.7 billion (while everyone told him he'd overpaid for a chat app)\nHe owned the data.\nThe only piece he didn't own was the brain, so he rents it, $300 million of Anthropic tokens this year, before it found a way around him.\n \nSaaS isn't dead but the idea that its value lives in the interface is what died.\n \nI know that move.\n \nIn 2023 the whole pitch at our agency was cold email. Cold was in the name. What people paid us for was the sending, a list, a template, ten thousand emails from one domain.\n \nThen the sending stopped working.\nIn 2023 it took about 120 cold emails to get one positive reply. 2024, 200. 2025, more than 430.\nGoogle and Microsoft put a model on every inbox.\n \nProspects say \"Cold email is dead\" and I agree.\n \nThe blast is dead. What we sell now is knowing who to write to, the 40 heads of sales whose company hired a GTM engineer this month, from a domain that never blasted anyone. The email is the last step, not the product.\n \nI stopped defending the thing I no longer sold.\n \nIf agents did your customers' work tomorrow, what would they still have to pay you for?"}, {"n": 47, "client_id": "ivan", "post_ref": "7501640396112973824", "author_name": "Braden Ricchini", "published": "2026-09-04", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/braden-ricchini-1b5b64324_i-dont-have-time-to-post-on-youtube-is-activity-7501640396112973824-IWRm", "post_text": "“I don’t have time to post on YouTube” is the biggest cope I’ve ever heard.\n \nYou think Alex Hormozi “has time”\n \nNo.\n \nHe MADE TIME.\n \nAnd that’s not even my point….\n \nMost of you who think about YouTube, picture an entire on-site film crew and 10 hours on a Saturday.\n \nAfter producing hundreds of these videos, here's where the dollars and the minutes actually go:\n \n1. Recording takes 45 minutes. My camera sits on a desk mount in front of me and never comes down, so filming is bending over and hitting record.\n2. Ideation costs nothing now. You point AI at your own call transcripts and it hands you back ideas in seconds.\n3. Thumbnails go out to a designer for $75 a thumbnail, and he concepts them for you. Don't sit there designing your own.\n4. The script takes 60 minutes and it has to be you. My team spends closer to 2 hours on ours, and that extra time is research a founder already has in his own head.\n5. Editing gets outsourced. You shouldn't be editing your own videos, not even with AI.\n \nAdd all of that up and one video costs $200 to $250.\n \nFour videos a month puts you right around $1,000.\n \nAnd you can expect to book 10-20+ calls/mo once the ball starts rolling.\n \nPS\n \nThe channels we've taken from 0 to 20+ qualified calls a month were built on 60min/mo of recording.\n \nThat’s it.\n \nWe handle the rest, AND we’ll guarantee you sign clients in the first 90 days, or your money back.\n \nDM me for more info."}, {"n": 48, "client_id": "ivan", "post_ref": "7406309611319799808", "author_name": "Pascal Bornet", "published": "2025-12-15", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/pascalbornet_redhatambassador-awsambassador-ai-activity-7406309611319799808-Xjgw", "post_text": "“Everybody thinks they’re late to AI.”\n\nThat’s how Tim Cramer from Red Hat opened our conversation at Amazon Web Services (AWS) re:Invent 2025 — and honestly, it hit hard.\n\nIn this short extract, Tim explains something I hear every week from executives and teams:\n- “We’re behind.”\n- “We’re not moving fast enough.”\n- “Startups are ahead. We have too much legacy.”\n\nBut here’s the truth:\n👉Most companies aren’t behind.\nThey’re just building AI in the real world — with 10–20 years of code, thousands of contributors, and massive open-source communities depending on them.\n\nAnd that’s a completely different game.\n\nTim shares how Red Hat navigates this challenge:\nworking upstream, collaborating with global communities, and figuring out how to use AI responsibly when your codebase isn’t a blank slate.\n\nIt’s a rare, honest look into the reality of AI adoption inside a major open-source organization.\n\nIf you want to understand what AI transformation looks like outside the hype, the full interview is worth your time.\n\n👉 Watch the full Red Hat AI deep dive: https://lnkd.in/ezh7p27Y\n\nWhat about you?\nDo you also feel this “AI FOMO”? Or do you think legacy can actually be an advantage?\n\n#RedHatAmbassador #AWSAmbassador #AI #OpenSource #AWSreInvent #DigitalTransformation #LegacySystems #Innovation #ad"}, {"n": 49, "client_id": "risedtc", "post_ref": "7460350695771308032", "author_name": "Codywittick", "published": "2026-05-13", "post_type": "video", "image_count": null, "source_url": "https://www.linkedin.com/posts/codywittick_were-not-in-the-business-of-burning-money-activity-7460350695771308032-HZlZ", "post_text": "We're not in the business of burning money, which is why 100% of our client accounts run on manual bids with cost controls.   \n\nIn this video I'll walk you through the exact setup: contribution margin per SKU, inflated budgets, the works.\n\nGrab a pen."}, {"n": 50, "client_id": "ivan", "post_ref": "7496150215566086144", "author_name": "Paolo Trivellato", "published": "2026-08-20", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/leadgenwiz_its-time-to-reintroduce-myself-my-following-activity-7496150215566086144-PBfe", "post_text": "It’s time to reintroduce myself.\n\nMy following has grown to nearly 35k on LinkedIn in 2026. \n\nMost of my new followers think I’m just the “lead magnet guy.” \n\nHere’s my intro for my new followers:\n\n➤ Generated $100k+ from an AI content SaaS at 17 y/o\n➤ Dropped out of school and founded Starborn\n➤ Rejected a 7-figure acqusition offer from an SF startup a few months later\n➤ Scaled Starborn to 10 team members and 40+ active clients\n➤ Now on a mission to become the #1 biggest LinkedIn content agency in the WORLD\n \nThe craziest part is that every single client I've ever signed came through inbound.\n\n(Which just so happens to be the exact same thing we do for our clients)\n\nThat being said, don’t be a stranger!\n\nSay hi in the comments or DMs if you’re building something cool."}, {"n": 51, "client_id": "arch", "post_ref": "7495406137433985024", "author_name": "Marion Balinoff", "published": "2026-08-18", "post_type": "image", "image_count": null, "source_url": "https://www.linkedin.com/posts/marion-balinoff_i-finished-life-is-strange-reunion-this-activity-7495406137433985024-m5xG", "post_text": "I finished Life is Strange: Reunion this weekend and...\n\nHonestly this game only works if you already played Double Exposure, because most of it is spent fixing what that game broke. Some choices you made just don't matter anymore. A character who felt like she was being set up for something big basically disappears, handled in a rushed phone call at the end.\n\nThere might be some 𝐬̲𝐩̲𝐨̲𝐢̲𝐥̲𝐞̲𝐫̲ ahead so read at your own risk!\n\nThe Max and Chloe story never needed to come back. We don't learn anything new about them, they don't face anything genuinely new, there's no real weight to it like the first 2 games h
