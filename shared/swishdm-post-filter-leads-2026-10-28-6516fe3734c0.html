<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="30 SwishDM leads collected after the 27 October filter update."><title>SwishDM | 194 leads</title><style>*{box-sizing:border-box}
html,body{margin:0;color:var(--foreground,#20252b);font-family:var(--font-sans,Arial,Helvetica,sans-serif);font-size:14px;line-height:1.5;background:transparent}
main{width:100%;min-width:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:0 0 18px}
h1{font-size:22px;line-height:1.3;letter-spacing:-.5px;margin:0;font-weight:700}
h1 span{font-size:14px;letter-spacing:0;font-weight:400;opacity:.65;margin-left:12px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
input,select{font:inherit;color:inherit;background:var(--background,#fff);border:1px solid var(--border,#dce1e6);border-radius:6px;padding:9px 11px;min-height:40px}
input{width:280px;max-width:100%}
.table-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;opacity:.7;margin:0 0 10px}
.table-scroll{width:100%;overflow-x:auto;border:1px solid var(--border,#dce1e6);border-radius:8px}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1320px}
.brand-col{width:15%}.products-col{width:23%}.person-col{width:15%}.sales-col{width:10%}.team-col{width:10%}.status-col{width:12%}.source-col{width:15%}
th{text-align:left;font-size:12px;font-weight:600;padding:13px 14px;border-bottom:1px solid var(--border,#dce1e6);background:var(--card,#f5f7f9);vertical-align:top;white-space:nowrap}
td{padding:16px 14px;border-bottom:1px solid var(--border,#dce1e6);vertical-align:top;overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--foreground,#20252b) 2.5%,transparent)}
tbody tr:hover{background:color-mix(in srgb,var(--foreground,#20252b) 5%,transparent)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.brand,.person{display:block;font-weight:600;text-decoration:none}
.brand:hover,.person:hover{text-decoration:underline}
.brand{font-size:15px;line-height:1.4}
.secondary{display:block;font-size:12px;line-height:1.5;opacity:.72;margin-top:5px}
.domain{text-decoration:none;word-break:break-word}
.products{line-height:1.6}
.sales{font-variant-numeric:tabular-nums;font-size:16px}
.status{display:inline-block;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 7px;border-radius:4px;border:1px solid var(--border,#dce1e6)}
.status-invite-sent,.status-dm-sent{background:color-mix(in srgb,var(--chart-1,#3867ba) 12%,transparent)}
.status-held,.status-in-review{background:color-mix(in srgb,var(--chart-2,#b67c27) 12%,transparent)}
time{font-size:12px;font-variant-numeric:tabular-nums}
.source-link{max-width:100%;text-decoration:underline}
.empty{padding:24px;margin:0}
footer{max-width:100ch;font-size:12px;opacity:.7;line-height:1.65;margin-top:16px}
:focus-visible{outline:3px solid var(--ring,#497acb);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:620px){.toolbar{gap:14px}.controls{width:100%}.controls input{flex:1;min-width:190px}.controls select{flex:0 1 auto}.table-meta{font-size:11px}.toolbar h1{font-size:20px}}
@media print{.controls{display:none}.table-scroll{overflow:visible;border:0}table{min-width:0;font-size:9px}td,th{padding:7px 5px}.secondary,time,.status{font-size:8px}.brand,.sales{font-size:10px}tr{break-inside:avoid}footer{font-size:9px}@page{size:A3 landscape;margin:12mm}}
